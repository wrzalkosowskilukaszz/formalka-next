              en: "Exempt: a decision for a minor child under art. 30(1) points 4 and 5 of the act (the groups of children)."
              uk: "Звільнено: рішення щодо неповнолітньої дитини на підставі ст. 30 ч. 1 п. 4 і 5 закону (групи дітей)."
              ru: "Освобождено: решение в отношении несовершеннолетнего ребенка на основании ст. 30 ч. 1 п. 4 и 5 закона (группы детей)."
            quotes:
              - page: *duty
                text: "Decyzja w przedmiocie nabycia obywatelstwa polskiego w trybie uznania za obywatela polskiego oraz przywrócenia obywatelstwa polskiego 1000 zł decyzja wydana na podstawie art. 30 ust. 1 pkt 4 i 5 ustawy z dnia 2 kwietnia 2009 r. o obywatelstwie polskim"
  deadlines:
    - id: decision-time
      description:
        pl: Tyle ma wojewoda na decyzję, licząc od wpływu wniosku. Według ministerstwa w uzasadnionych przypadkach termin może zostać wydłużony.
        en: How long the voivode has to decide, counted from when the application arrives. According to the ministry, the time can be extended in justified cases.
        uk: Стільки має воєвода на рішення, рахуючи від надходження заяви. За даними міністерства, в обґрунтованих випадках строк можуть продовжити.
        ru: Столько времени есть у воеводы на решение, считая со дня поступления заявления. По данным министерства, в обоснованных случаях срок могут продлить.
      rule:
        value: { kind: relative, amount: 6, unit: month, from: filing }
        quotes:
          - page: *act
            text: "Załatwienie spraw innych niż wymienione w ust. 1 i 2 następuje w terminie 6 miesięcy od dnia wpływu wniosku do organu właściwego do wydania decyzji."
          - page: *uznanie
            text: "Wojewoda ma 6 miesięcy na wydanie decyzji. W uzasadnionych przypadkach termin ten może zostać wydłużony."
    - id: appeal
      description:
        pl: Na odwołanie do ministra, od dnia otrzymania decyzji, na piśmie.
        en: To appeal to the minister, in writing, from the day you receive the decision.
        uk: На оскарження до міністра, письмово, від дня отримання рішення.
        ru: На обжалование министру, письменно, со дня получения решения.
      rule:
        value: { kind: relative, amount: 14, unit: day, from: decision_delivered }
        quotes:
          - page: *uznanie
            text: "Powinieneś to zrobić w formie pisemnej, w ciągu 14 dni, od kiedy otrzymasz decyzję."
    - id: court
      description:
        pl: Na skargę do sądu administracyjnego na decyzję ministra, od jej otrzymania; skargę składasz za pośrednictwem MSWiA.
        en: To complain to an administrative court about the minister's decision, from receiving it; you file it through the ministry.
        uk: На скаргу до адміністративного суду на рішення міністра, від його отримання; скаргу подають через міністерство.
        ru: На жалобу в административный суд на решение министра, со дня его получения; жалобу подают через министерство.
      rule:
        value: { kind: relative, amount: 30, unit: day, from: decision_delivered }
        quotes:
          - page: *uznanie
            text: "Powinieneś to zrobić w ciągu 30 dni od otrzymania decyzji Ministra. Pismo ze skargą złóż za pośrednictwem MSWiA."
  variations: []
  pitfalls:
    - id: dual-citizenship
      important: true
      statement:
        value:
          pl: "Obywatel polski posiadający równocześnie obywatelstwo innego państwa ma wobec Rzeczypospolitej Polskiej takie same prawa i obowiązki jak osoba posiadająca wyłącznie obywatelstwo polskie."
          en: "A Polish citizen who also holds another country's citizenship has the same rights and duties towards Poland as someone who holds only Polish citizenship."
          uk: "Громадянин Польщі, який одночасно має громадянство іншої держави, має щодо Польщі такі самі права й обов'язки, як особа, що має лише польське громадянство."
          ru: "Гражданин Польши, который одновременно имеет гражданство другого государства, имеет по отношению к Польше такие же права и обязанности, как человек, у которого есть только польское гражданство."
        quotes:
          - page: *act
            text: "Obywatel polski posiadający równocześnie obywatelstwo innego państwa ma wobec Rzeczypospolitej Polskiej takie same prawa i obowiązki jak osoba posiadająca wyłącznie obywatelstwo polskie."
    - id: other-citizenship-not-invoked
      statement:
        value:
          pl: "Obywatel polski nie może wobec władz Rzeczypospolitej Polskiej powoływać się ze skutkiem prawnym na posiadane równocześnie obywatelstwo innego państwa i na wynikające z niego prawa i obowiązki."
          en: "A Polish citizen cannot rely, with legal effect, on another citizenship they also hold, or on the rights and duties that come from it, towards the Polish authorities."
          uk: "Громадянин Польщі не може перед органами влади Польщі з правовим наслідком посилатися на одночасне громадянство іншої держави та на пов'язані з ним права й обов'язки."
          ru: "Гражданин Польши не может перед органами власти Польши с правовыми последствиями ссылаться на одновременно имеющееся у него гражданство другого государства и на вытекающие из него права и обязанности."
        quotes:
          - page: *act
            text: "Obywatel polski nie może wobec władz Rzeczypospolitej Polskiej powoływać się ze skutkiem prawnym na posiadane równocześnie obywatelstwo innego państwa i na wynikające z niego prawa i obowiązki."
    - id: post-secondary-school
      important: true
      statement:
        value:
          pl: "Znajomości języka polskiego, o której mowa w ust. 2, nie potwierdza świadectwo ukończenia szkoły policealnej"
          en: "A post-secondary school (szkoła policealna) certificate doesn't prove knowledge of Polish for recognition."
          uk: "Свідоцтво про закінчення післясередньої школи (szkoła policealna) не підтверджує знання польської для визнання."
          ru: "Свидетельство об окончании послесредней школы (szkoła policealna) не подтверждает знание польского для признания."
        quotes:
          - page: *act
            text: "Znajomości języka polskiego, o której mowa w ust. 2, nie potwierdza świadectwo ukończenia szkoły policealnej, o której mowa w art. 18 ust. 1 pkt 2 lit. f ustawy z dnia 14 grudnia 2016 r. – Prawo oświatowe (Dz. U. z 2025 r. poz. 1043 i 1160)."
    - id: unbroken-stay
      important: true
      statement:
        value:
          pl: "Pobyt cudzoziemca na terytorium Rzeczypospolitej Polskiej stanowiący podstawę do udzielenia mu zezwolenia na pobyt stały uznaje się za nieprzerwany, jeżeli żadna z przerw w nim nie była dłuższa niż 6 miesięcy i wszystkie przerwy nie przekroczyły łącznie 10 miesięcy w okresach stanowiących podstawę do udzielenia mu zezwolenia na pobyt stały, chyba że przerwa była spowodowana:"
          en: "How an 'unbroken' stay is judged (the citizenship act points to this rule of the Act on Foreigners): a stay counts as unbroken if no break was longer than 6 months and all breaks together didn't exceed 10 months, unless a break had one of the reasons the act lists."
          uk: "Як оцінюють «безперервне» перебування (закон про громадянство відсилає до цього правила Закону про іноземців): перебування вважають безперервним, якщо жодна перерва не була довшою за 6 місяців, а всі перерви разом не перевищили 10 місяців, хіба що перерва мала одну з причин, перелічених у законі."
          ru: "Как оценивают «непрерывное» пребывание (закон о гражданстве отсылает к этому правилу Закона об иностранцах): пребывание считают непрерывным, если ни один перерыв не был дольше 6 месяцев, а все перерывы вместе не превысили 10 месяцев, если только перерыв не был вызван одной из причин, перечисленных в законе."
        quotes:
          - page: *act
            text: "Do ustalenia, czy cudzoziemiec przebywa nieprzerwanie na terytorium Rzeczypospolitej Polskiej, stosuje się przepis art. 195 ust. 4 ustawy z dnia 12 grudnia 2013 r. o cudzoziemcach"
          - page: &foreigners https://api.sejm.gov.pl/eli/acts/DU/2025/1079/text.pdf
            text: "Pobyt cudzoziemca na terytorium Rzeczypospolitej Polskiej stanowiący podstawę do udzielenia mu zezwolenia na pobyt stały uznaje się za nieprzerwany, jeżeli żadna z przerw w nim nie była dłuższa niż 6 miesięcy i wszystkie przerwy nie przekroczyły łącznie 10 miesięcy w okresach stanowiących podstawę do udzielenia mu zezwolenia na pobyt stały, chyba że przerwa była spowodowana:"
    - id: grant-case-ends-recognition
      statement:
        value:
          pl: "W przypadku gdy wniosek o uznanie cudzoziemca za obywatela polskiego został złożony w czasie, gdy wobec tego cudzoziemca jest prowadzone postępowanie o nadanie obywatelstwa polskiego, postępowanie w sprawie o uznanie za obywatela polskiego umarza się."
          en: "If the application for recognition is filed while a case for a grant of Polish citizenship is pending for the same person, the recognition case is discontinued."
          uk: "Якщо заяву про визнання подано тоді, коли щодо цієї ж особи триває справа про надання польського громадянства, провадження про визнання припиняють."
          ru: "Если заявление о признании подано, когда в отношении того же человека ведется дело о предоставлении польского гражданства, производство о признании прекращают."
        quotes:
          - page: *act
            text: "W przypadku gdy wniosek o uznanie cudzoziemca za obywatela polskiego został złożony w czasie, gdy wobec tego cudzoziemca jest prowadzone postępowanie o nadanie obywatelstwa polskiego, postępowanie w sprawie o uznanie za obywatela polskiego umarza się."
    - id: children
      statement:
        value:
          pl: "Nadanie obywatelstwa polskiego jednemu z rodziców, uznanie go za obywatela polskiego oraz wyrażenie zgody na zrzeczenie się obywatelstwa polskiego obejmuje małoletniego pozostającego pod jego władzą rodzicielską, w przypadku gdy: 1) drugiemu z rodziców nie przysługuje władza rodzicielska; 2) drugie z rodziców złożyło oświadczenie o wyrażeniu zgody na nabycie lub utratę przez małoletniego obywatelstwa polskiego."
          en: "Children can be included in the application, even if they don't live in Poland. When only one parent is recognised, a minor child under their parental authority is covered only if the other parent has no parental authority or has declared consent; a child aged 16 or over must also consent."
          uk: "Дітей можна включити до заяви, навіть якщо вони не живуть у Польщі. Якщо визнають лише одного з батьків, неповнолітня дитина під його батьківською владою охоплюється, лише якщо другий з батьків не має батьківської влади або заявив про згоду; дитина, якій виповнилося 16 років, також має дати згоду."
          ru: "Детей можно включить в заявление, даже если они не живут в Польше. Если признают только одного из родителей, несовершеннолетний ребенок под его родительской властью охватывается, только если второй родитель не имеет родительской власти или заявил о согласии; ребенок, которому исполнилось 16 лет, тоже должен дать согласие."
        quotes:
          - page: *uznanie
            text: "Jeśli masz małoletnie dzieci, możesz je objąć wnioskiem – nawet gdy dzieci nie mieszkają w Polsce."
          - page: *act
            text: "Nadanie obywatelstwa polskiego jednemu z rodziców, uznanie go za obywatela polskiego oraz wyrażenie zgody na zrzeczenie się obywatelstwa polskiego obejmuje małoletniego pozostającego pod jego władzą rodzicielską, w przypadku gdy: 1) drugiemu z rodziców nie przysługuje władza rodzicielska; 2) drugie z rodziców złożyło oświadczenie o wyrażeniu zgody na nabycie lub utratę przez małoletniego obywatelstwa polskiego."
          - page: *act
            text: "Do nadania obywatelstwa polskiego małoletniemu, który ukończył 16 lat, uznania go za obywatela polskiego oraz utraty przez niego obywatelstwa polskiego wskutek wyrażenia zgody na zrzeczenie się obywatelstwa przez jego rodziców jest wymagane oświadczenie o wyrażeniu zgody złożone przez małoletniego."
    - id: grant-by-president
      statement:
        value:
          pl: "Złóż wniosek do Prezydenta o nadanie polskiego obywatelstwa\nJak załatwić sprawę?\nW urzędzie lub konsulacie.\nKto może skorzystać z usługi?\nOsoba, która nigdy nie posiadała obywatelstwa polskiego."
          en: "Apply to the President for a grant of Polish citizenship\nHow is it done?\nAt an office or a consulate.\nWho can use this service?\nA person who has never held Polish citizenship."
          uk: "Подайте заяву Президенту про надання польського громадянства\nЯк це зробити?\nВ установі або консульстві.\nХто може скористатися послугою?\nОсоба, яка ніколи не мала польського громадянства."
          ru: "Подайте заявление Президенту о предоставлении польского гражданства\nКак это сделать?\nВ учреждении или консульстве.\nКто может воспользоваться услугой?\nЧеловек, который никогда не имел польского гражданства."
        quotes:
          - page: &nadanie https://www.gov.pl/web/mswia/uzyskaj-polskie-obywatelstwo
            text: "Złóż wniosek do Prezydenta o nadanie polskiego obywatelstwa\nJak załatwić sprawę?\nW urzędzie lub konsulacie.\nKto może skorzystać z usługi?\nOsoba, która nigdy nie posiadała obywatelstwa polskiego."
    - id: grant-no-time-limit-no-appeal
      statement:
        value:
          pl: "Ile będziesz czekać?\nPrezydent RP nie jest związany żadnymi terminami w sprawach o nadanie obywatelstwa polskiego.\nJak możesz się odwołać?\nNie możesz się odwołać. Postanowienia Prezydenta RP są ostateczne."
          en: "How long will you wait?\nThe President is not bound by any time limits in cases of granting Polish citizenship.\nHow can you appeal?\nYou can't appeal. The President's decisions are final."
          uk: "Скільки чекати?\nПрезидент не зв'язаний жодними строками у справах про надання польського громадянства.\nЯк оскаржити?\nОскаржити не можна. Рішення Президента остаточні."
          ru: "Сколько ждать?\nПрезидент не связан никакими сроками в делах о предоставлении польского гражданства.\nКак обжаловать?\nОбжаловать нельзя. Решения Президента окончательны."
        quotes:
          - page: *nadanie
            text: "Ile będziesz czekać?\nPrezydent RP nie jest związany żadnymi terminami w sprawach o nadanie obywatelstwa polskiego.\nJak możesz się odwołać?\nNie możesz się odwołać. Postanowienia Prezydenta RP są ostateczne."
    - id: confirmation
      statement:
        value:
          pl: "Złóż wniosek do wojewody o potwierdzenie posiadania lub utraty obywatelstwa polskiego\nPotrzebujesz urzędowego potwierdzenia, że posiadasz obywatelstwo polskie lub go nie posiadasz? Tu znajdziesz potrzebne informacje.\nKto może skorzystać z usługi?\nKażdy, kto ma lub miał polskie obywatelstwo oraz podmiot, który ma w tym interes prawny lub też ciąży na nim obowiązek uzyskania potwierdzenia posiadania obywatelstwa polskiego."
          en: "Apply to the voivode for confirmation of having or losing Polish citizenship\nDo you need official confirmation that you hold Polish citizenship, or that you don't? Here is the information you need.\nWho can use this service?\nAnyone who has or had Polish citizenship, and any body with a legal interest in it or a duty to obtain confirmation of Polish citizenship."
          uk: "Подайте заяву воєводі про підтвердження наявності або втрати польського громадянства\nПотрібне офіційне підтвердження, що ви маєте польське громадянство або не маєте його? Тут потрібна інформація.\nХто може скористатися послугою?\nКожен, хто має або мав польське громадянство, а також суб'єкт, який має в цьому правовий інтерес або зобов'язаний отримати підтвердження польського громадянства."
          ru: "Подайте заявление воеводе о подтверждении наличия или утраты польского гражданства\nНужно официальное подтверждение, что у вас есть польское гражданство или его нет? Здесь нужная информация.\nКто может воспользоваться услугой?\nКаждый, у кого есть или было польское гражданство, а также субъект, у которого есть в этом правовой интерес или который обязан получить подтверждение польского гражданства."
        quotes:
          - page: &potwierdzenie https://www.gov.pl/web/mswia/potwierdzenie-posiadania-lub-utraty-obywatelstwa-polskiego
            text: "Złóż wniosek do wojewody o potwierdzenie posiadania lub utraty obywatelstwa polskiego\nPotrzebujesz urzędowego potwierdzenia, że posiadasz obywatelstwo polskie lub go nie posiadasz? Tu znajdziesz potrzebne informacje.\nKto może skorzystać z usługi?\nKażdy, kto ma lub miał polskie obywatelstwo oraz podmiot, który ma w tym interes prawny lub też ciąży na nim obowiązek uzyskania potwierdzenia posiadania obywatelstwa polskiego."
  handoff:
    when:
      pl: Jeśli nie wiesz, do której grupy należysz, czy Twój pobyt był nieprzerwany albo wojewoda odmówił. Polskie strony urzędowe nie mówią, czy zachowasz dotychczasowe obywatelstwo. To zależy od prawa tamtego państwa, więc zapytaj w jego konsulacie.
      en: If you're not sure which group you belong to or whether your stay counts as unbroken, or the voivode refused. The Polish official pages don't say whether you keep your current citizenship. That depends on the other country's law, so ask its consulate.
      uk: Якщо ви не впевнені, до якої групи належите або чи ваше перебування було безперервним, або воєвода відмовив. Польські офіційні сторінки не кажуть, чи збережете ви теперішнє громадянство. Це залежить від законодавства тієї держави, тож запитайте в її консульстві.
      ru: Если вы не уверены, к какой группе относитесь или было ли ваше пребывание непрерывным, или воевода отказал. Польские официальные страницы не говорят, сохраните ли вы нынешнее гражданство. Это зависит от законодательства того государства, поэтому спросите в его консульстве.
