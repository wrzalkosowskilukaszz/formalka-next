  fees:
    - id: decision
      purpose:
        pl: Opłata skarbowa za decyzję o uznaniu za obywatela polskiego
        en: Stamp duty for the decision on recognition as a Polish citizen
        uk: Гербовий збір за рішення про визнання громадянином Польщі
        ru: Гербовый сбор за решение о признании гражданином Польши
      amountPln:
        value: 1000
        quotes:
          - page: &duty https://api.sejm.gov.pl/eli/acts/DU/2025/1154/text.pdf
            text: "Decyzja w przedmiocie nabycia obywatelstwa polskiego w trybie uznania za obywatela polskiego oraz przywrócenia obywatelstwa polskiego 1000 zł"
      exemptions:
