    - id: language-proof
      condition: { fact: citizenship.group, in: [three_years, married_or_stateless, refugee, polish_origin, ten_years] }
      namePl:
        value: urzędowe poświadczenie, o którym mowa w art. 11a ustawy z dnia 7 października 1999 r. o języku polskim
        quotes:
          - page: *act
            text: "urzędowe poświadczenie, o którym mowa w art. 11a ustawy z dnia 7 października 1999 r. o języku polskim, świadectwo ukończenia szkoły w Rzeczypospolitej Polskiej lub świadectwo ukończenia szkoły za granicą z wykładowym językiem polskim, w przypadku gdy jest wymagane"
      description:
        pl: Certyfikat znajomości polskiego co najmniej B1 albo świadectwo szkoły w Polsce lub szkoły z polskim językiem wykładowym (nie świadectwo szkoły policealnej).
        en: A certificate of Polish at level B1 or higher, or a certificate from a school in Poland or a school taught in Polish (not a post-secondary school certificate).
        uk: Сертифікат знання польської щонайменше B1 або свідоцтво школи в Польщі чи школи з польською мовою навчання (не свідоцтво післясередньої школи).
        ru: Сертификат знания польского не ниже B1 или свидетельство школы в Польше либо школы с польским языком обучения (не свидетельство послесредней школы).
    - id: photos
      namePl:
        value: fotografie osób objętych wnioskiem
        quotes:
