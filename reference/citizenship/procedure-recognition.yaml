# Polish citizenship: recognition as a Polish citizen (uznanie za obywatela polskiego) by the
# voivode, GUIDES-01 (4), 2026-10-02. The route for people who already live in Poland on a
# permanent title. Grant by the President and confirmation of citizenship are signposted here
# and get their own guides later. Sources: MSWiA's service cards on gov.pl, the citizenship act
# (consolidated text Dz.U. 2025 poz. 1611) and the stamp duty act. Evidence pack:
# docs/knowledge/VERIFICATION-citizenship-2026-10-02.md. Polish statements are verbatim
# official wording; en/uk are our translations of it.

- id: citizenship-recognition
  domain: citizenship
  related: [free-legal-aid]
  riskClass: C
  verificationLevel: auto_structured
  checkedAt: "2026-10-02"
  title:
    pl: Obywatelstwo polskie przez uznanie
    en: Polish citizenship by recognition
    uk: Польське громадянство через визнання
    ru: Польское гражданство через признание
  summary:
    pl: Jak zostać uznanym za obywatela polskiego, jeśli masz zezwolenie na pobyt stały, zezwolenie na pobyt rezydenta długoterminowego UE albo prawo stałego pobytu. Kto może, jakie są warunki, ile to kosztuje i kiedy wojewoda decyduje.
    en: How to be recognised as a Polish citizen if you have a permanent residence permit, an EU long-term resident permit or a right of permanent residence. Who can apply, the conditions, the cost, and when the voivode decides.
    uk: Як отримати визнання громадянином Польщі, якщо ви маєте дозвіл на постійне перебування, дозвіл на перебування довгострокового резидента ЄС або право постійного перебування. Хто може подати заяву, які умови, скільки це коштує і коли воєвода ухвалює рішення.
    ru: Как получить признание гражданином Польши, если у вас есть разрешение на постоянное пребывание, разрешение на пребывание долгосрочного резидента ЕС или право постоянного пребывания. Кто может подать заявление, какие условия, сколько это стоит и когда воевода принимает решение.
  applicability:
    rule: { fact: citizenship.permanent_title, eq: "yes" }
    conditions:
      - id: qualifying-group
        rule: { fact: citizenship.group, in: [three_years, married_or_stateless, refugee, polish_origin, ten_years, minor_child] }
        statement:
          value:
            pl: "Stosownie do art. 30 ust. 1 ustawy z dnia 2 kwietnia 2009 r. o obywatelstwie polskim, za obywatela polskiego uznaje się:\ncudzoziemca przebywającego nieprzerwanie na terytorium Rzeczypospolitej Polskiej co najmniej od 3 lat na podstawie zezwolenia na pobyt stały, zezwolenia na pobyt rezydenta długoterminowego Unii Europejskiej lub prawa stałego pobytu, który posiada w Rzeczypospolitej Polskiej stabilne i regularne źródło dochodu oraz tytuł prawny do zajmowania lokalu mieszkalnego;\ncudzoziemca przebywającego nieprzerwanie na terytorium Rzeczypospolitej Polskiej co najmniej od 2 lat na podstawie zezwolenia na pobyt stały, zezwolenia na pobyt rezydenta długoterminowego Unii Europejskiej lub prawa stałego pobytu, który:\npozostaje co najmniej od 3 lat w związku małżeńskim zawartym z obywatelem polskim lub\nnie posiada żadnego obywatelstwa;\ncudzoziemca przebywającego nieprzerwanie na terytorium Rzeczypospolitej Polskiej co najmniej od 2 lat na podstawie zezwolenia na pobyt stały, które uzyskał w związku z posiadaniem statusu uchodźcy nadanego w Rzeczypospolitej Polskiej;\nmałoletniego cudzoziemca przebywającego na terytorium Rzeczypospolitej Polskiej na podstawie zezwolenia na pobyt stały, zezwolenia na pobyt rezydenta długoterminowego Unii Europejskiej lub prawa stałego pobytu, którego jedno z rodziców jest obywatelem polskim, a drugie z rodziców, nieposiadające obywatelstwa polskiego, wyraziło zgodę na to uznanie;\nmałoletniego cudzoziemca przebywającego na terytorium Rzeczypospolitej Polskiej na podstawie zezwolenia na pobyt stały, zezwolenia na pobyt rezydenta długoterminowego Unii Europejskiej lub prawa stałego pobytu, którego co najmniej jednemu z rodziców zostało przywrócone obywatelstwo polskie, a drugie z rodziców, nieposiadające obywatelstwa polskiego, wyraziło zgodę na to uznanie;\ncudzoziemca przebywającego nieprzerwanie i legalnie na terytorium Rzeczypospolitej Polskiej co najmniej od 10 lat, który spełnia łącznie następujące warunki:\nposiada zezwolenie na pobyt stały, zezwolenie na pobyt rezydenta długoterminowego Unii Europejskiej lub prawo stałego pobytu,\nposiada w Rzeczypospolitej Polskiej stabilne i regularne źródło dochodu oraz tytuł prawny do zajmowania lokalu mieszkalnego;\ncudzoziemca przebywającego nieprzerwanie na terytorium Rzeczypospolitej Polskiej co najmniej od roku na podstawie zezwolenia na pobyt stały, które uzyskał w związku z polskim pochodzeniem lub posiadaną Kartą Polaka."
            en: "Under art. 30(1) of the act on Polish citizenship, the following are recognised as Polish citizens:\n- a foreigner who has stayed in Poland without a break for at least 3 years on a permanent residence permit, an EU long-term resident permit or a right of permanent residence, with a stable and regular income in Poland and a legal right to occupy a home;\n- a foreigner who has stayed in Poland without a break for at least 2 years on one of those titles and has been married to a Polish citizen for at least 3 years, or has no citizenship;\n- a foreigner who has stayed in Poland without a break for at least 2 years on a permanent residence permit obtained through refugee status granted in Poland;\n- a minor foreigner staying in Poland on one of those titles, one of whose parents is a Polish citizen (or had Polish citizenship restored) and the other parent, not a Polish citizen, has consented;\n- a foreigner who has stayed in Poland without a break and legally for at least 10 years, holds one of those titles, and has a stable and regular income and a legal right to occupy a home;\n- a foreigner who has stayed in Poland without a break for at least a year on a permanent residence permit obtained through Polish origin or a Karta Polaka."
            uk: "Відповідно до ст. 30 ч. 1 закону про польське громадянство громадянином Польщі визнається:\n- іноземець, який безперервно перебуває в Польщі щонайменше 3 роки на підставі дозволу на постійне перебування, дозволу довгострокового резидента ЄС або права постійного перебування, має в Польщі стабільне й регулярне джерело доходу та правову підставу для проживання в житлі;\n- іноземець, який безперервно перебуває в Польщі щонайменше 2 роки на одній із цих підстав і щонайменше 3 роки перебуває в шлюбі з громадянином Польщі або не має жодного громадянства;\n- іноземець, який безперервно перебуває в Польщі щонайменше 2 роки на підставі дозволу на постійне перебування, отриманого у зв'язку зі статусом біженця, наданим у Польщі;\n- неповнолітній іноземець, який перебуває в Польщі на одній із цих підстав, один із батьків якого є громадянином Польщі (або відновив польське громадянство), а другий, не будучи громадянином Польщі, дав на це згоду;\n- іноземець, який безперервно й легально перебуває в Польщі щонайменше 10 років, має одну з цих підстав, стабільне й регулярне джерело доходу та правову підставу для проживання в житлі;\n- іноземець, який безперервно перебуває в Польщі щонайменше рік на підставі дозволу на постійне перебування, отриманого у зв'язку з польським походженням або Картою поляка."
            ru: "Согласно ст. 30 ч. 1 закона о польском гражданстве гражданином Польши признается:\n- иностранец, который непрерывно находится в Польше не менее 3 лет на основании разрешения на постоянное пребывание, разрешения на пребывание долгосрочного резидента ЕС или права постоянного пребывания, имеет в Польше стабильный и регулярный источник дохода и правовое основание для проживания в жилье;\n- иностранец, который непрерывно находится в Польше не менее 2 лет на одном из этих оснований и не менее 3 лет состоит в браке с гражданином Польши или не имеет никакого гражданства;\n- иностранец, который непрерывно находится в Польше не менее 2 лет на основании разрешения на постоянное пребывание, полученного в связи со статусом беженца, предоставленным в Польше;\n- несовершеннолетний иностранец, который находится в Польше на одном из этих оснований, один из родителей которого является гражданином Польши (или ему восстановили польское гражданство), а другой родитель, не являющийся гражданином Польши, дал на это согласие;\n- иностранец, который непрерывно и легально находится в Польше не менее 10 лет, имеет одно из этих оснований, стабильный и регулярный источник дохода и правовое основание для проживания в жилье;\n- иностранец, который непрерывно находится в Польше не менее года на основании разрешения на постоянное пребывание, полученного в связи с польским происхождением или Картой поляка."
          quotes:
            - page: &uznanie https://www.gov.pl/web/mswia/popros-o-uznanie-za-polskiego-obywatela
              text: "Stosownie do art. 30 ust. 1 ustawy z dnia 2 kwietnia 2009 r. o obywatelstwie polskim, za obywatela polskiego uznaje się:\ncudzoziemca przebywającego nieprzerwanie na terytorium Rzeczypospolitej Polskiej co najmniej od 3 lat na podstawie zezwolenia na pobyt stały, zezwolenia na pobyt rezydenta długoterminowego Unii Europejskiej lub prawa stałego pobytu, który posiada w Rzeczypospolitej Polskiej stabilne i regularne źródło dochodu oraz tytuł prawny do zajmowania lokalu mieszkalnego;\ncudzoziemca przebywającego nieprzerwanie na terytorium Rzeczypospolitej Polskiej co najmniej od 2 lat na podstawie zezwolenia na pobyt stały, zezwolenia na pobyt rezydenta długoterminowego Unii Europejskiej lub prawa stałego pobytu, który:\npozostaje co najmniej od 3 lat w związku małżeńskim zawartym z obywatelem polskim lub\nnie posiada żadnego obywatelstwa;\ncudzoziemca przebywającego nieprzerwanie na terytorium Rzeczypospolitej Polskiej co najmniej od 2 lat na podstawie zezwolenia na pobyt stały, które uzyskał w związku z posiadaniem statusu uchodźcy nadanego w Rzeczypospolitej Polskiej;\nmałoletniego cudzoziemca przebywającego na terytorium Rzeczypospolitej Polskiej na podstawie zezwolenia na pobyt stały, zezwolenia na pobyt rezydenta długoterminowego Unii Europejskiej lub prawa stałego pobytu, którego jedno z rodziców jest obywatelem polskim, a drugie z rodziców, nieposiadające obywatelstwa polskiego, wyraziło zgodę na to uznanie;\nmałoletniego cudzoziemca przebywającego na terytorium Rzeczypospolitej Polskiej na podstawie zezwolenia na pobyt stały, zezwolenia na pobyt rezydenta długoterminowego Unii Europejskiej lub prawa stałego pobytu, którego co najmniej jednemu z rodziców zostało przywrócone obywatelstwo polskie, a drugie z rodziców, nieposiadające obywatelstwa polskiego, wyraziło zgodę na to uznanie;\ncudzoziemca przebywającego nieprzerwanie i legalnie na terytorium Rzeczypospolitej Polskiej co najmniej od 10 lat, który spełnia łącznie następujące warunki:\nposiada zezwolenie na pobyt stały, zezwolenie na pobyt rezydenta długoterminowego Unii Europejskiej lub prawo stałego pobytu,\nposiada w Rzeczypospolitej Polskiej stabilne i regularne źródło dochodu oraz tytuł prawny do zajmowania lokalu mieszkalnego;\ncudzoziemca przebywającego nieprzerwanie na terytorium Rzeczypospolitej Polskiej co najmniej od roku na podstawie zezwolenia na pobyt stały, które uzyskał w związku z polskim pochodzeniem lub posiadaną Kartą Polaka."
      - id: polish-language
        rule: { any: [{ fact: citizenship.language, eq: "yes" }, { fact: citizenship.group, eq: minor_child }] }
        statement:
          value:
            pl: "Cudzoziemiec ubiegający się o uznanie za obywatela polskiego, z wyłączeniem cudzoziemca, o którym mowa w ust. 1 pkt 4 i 5, jest obowiązany posiadać znajomość języka polskiego potwierdzoną urzędowym poświadczeniem, o którym mowa w art. 11a ustawy z dnia 7 października 1999 r. o języku polskim (Dz. U. z 2024 r. poz. 1556 oraz z 2025 r. poz. 622), na poziomie biegłości językowej co najmniej B1, świadectwem ukończenia szkoły w Rzeczypospolitej Polskiej lub świadectwem ukończenia szkoły za granicą z wykładowym językiem polskim."
            en: "A foreigner applying for recognition as a Polish citizen, except minors in the groups of children, must have knowledge of Polish confirmed by an official certificate at level B1 or higher, by a certificate of completing a school in Poland, or by a certificate of completing a school abroad taught in Polish."
            uk: "Іноземець, який подає заяву про визнання громадянином Польщі, за винятком неповнолітніх із груп дітей, повинен мати знання польської мови, підтверджене офіційним посвідченням на рівні щонайменше B1, свідоцтвом про закінчення школи в Польщі або свідоцтвом про закінчення школи за кордоном з польською мовою навчання."
            ru: "Иностранец, который подает заявление о признании гражданином Польши, за исключением несовершеннолетних из групп детей, должен знать польский язык, что подтверждается официальным удостоверением на уровне не ниже B1, свидетельством об окончании школы в Польше или свидетельством об окончании школы за границей с польским языком обучения."
          quotes:
            - page: &act https://api.sejm.gov.pl/eli/acts/DU/2025/1611/text.pdf
              text: "Cudzoziemiec ubiegający się o uznanie za obywatela polskiego, z wyłączeniem cudzoziemca, o którym mowa w ust. 1 pkt 4 i 5, jest obowiązany posiadać znajomość języka polskiego potwierdzoną urzędowym poświadczeniem, o którym mowa w art. 11a ustawy z dnia 7 października 1999 r. o języku polskim (Dz. U. z 2024 r. poz. 1556 oraz z 2025 r. poz. 622), na poziomie biegłości językowej co najmniej B1, świadectwem ukończenia szkoły w Rzeczypospolitej Polskiej lub świadectwem ukończenia szkoły za granicą z wykładowym językiem polskim."
            - page: *act
              text: "Znajomości języka polskiego, o której mowa w ust. 2, nie potwierdza świadectwo ukończenia szkoły policealnej, o której mowa w art. 18 ust. 1 pkt 2 lit. f ustawy z dnia 14 grudnia 2016 r. – Prawo oświatowe (Dz. U. z 2025 r. poz. 1043 i 1160)."
  exclusions:
    - id: security
      statement:
        value:
          pl: "Cudzoziemcowi odmawia się uznania za obywatela polskiego, w przypadku gdy: 1) nie spełnia wymogów, o których mowa w art. 30; 2) nabycie przez niego obywatelstwa polskiego stanowi zagrożenie dla obronności lub bezpieczeństwa państwa albo ochrony bezpieczeństwa i porządku publicznego."
          en: "Recognition as a Polish citizen is refused if the foreigner doesn't meet the requirements of art. 30, or if their acquiring Polish citizenship threatens the defence or security of the state, or public safety and order."
          uk: "У визнанні громадянином Польщі відмовляють, якщо іноземець не відповідає вимогам ст. 30 або якщо набуття ним польського громадянства загрожує обороні чи безпеці держави або громадській безпеці й порядку."
          ru: "В признании гражданином Польши отказывают, если иностранец не соответствует требованиям ст. 30 или если приобретение им польского гражданства угрожает обороне или безопасности государства либо общественной безопасности и порядку."
        quotes:
          - page: *act
            text: "Cudzoziemcowi odmawia się uznania za obywatela polskiego, w przypadku gdy: 1) nie spełnia wymogów, o których mowa w art. 30; 2) nabycie przez niego obywatelstwa polskiego stanowi zagrożenie dla obronności lub bezpieczeństwa państwa albo ochrony bezpieczeństwa i porządku publicznego."
          - page: *uznanie
            text: "Pamiętaj! Wojewoda może odmówić uznania za polskiego obywatela, jeśli stanowiłoby to zagrożenie dla obronności lub bezpieczeństwa państwa albo ochrony bezpieczeństwa i porządku publicznego."
  requiredFacts:
    - citizenship.permanent_title
    - citizenship.group
    - citizenship.language
  steps:
    - id: collect-documents
      title:
        pl: Zbierz dokumenty
        en: Collect the documents
        uk: Зберіть документи
        ru: Соберите документы
      description:
        pl: Listę dokumentów podaje urząd wojewódzki właściwy dla Twojego miejsca zamieszkania. Dokumenty w obcym języku dołączasz z tłumaczeniem przysięgłym albo konsularnym.
        en: The voivodeship office for where you live publishes the list of documents. Documents in a foreign language go with a sworn or consular translation.
        uk: Перелік документів публікує воєводське управління за вашим місцем проживання. Документи іноземною мовою додають із присяжним або консульським перекладом.
        ru: Перечень документов публикует воеводское управление по вашему месту жительства. Документы на иностранном языке прилагают с присяжным или консульским переводом.
      channels: [in_person]
      quotes:
        - page: *uznanie
          text: "Zbierz wszystkie potrzebne dokumenty. Szczegóły znajdziesz na stronie internetowej właściwego dla Ciebie urzędu wojewódzkiego."
        - page: *uznanie
          text: "Takie tłumaczenie musi być wykonane przez tłumacza przysięgłego lub przez konsula RP."
    - id: pay
      title:
        pl: Zapłać opłatę skarbową
        en: Pay the stamp duty
        uk: Сплатіть гербовий збір
        ru: Оплатите гербовый сбор
      description:
        pl: Numer konta jest na stronie urzędu wojewódzkiego.
        en: The account number is on the voivodeship office's website.
        uk: Номер рахунку є на сайті воєводського управління.
        ru: Номер счета есть на сайте воеводского управления.
      dependsOn: [collect-documents]
      channels: [online]
      quotes:
        - page: *uznanie
          text: "Na stronie internetowej urzędu wojewódzkiego znajdziesz numer konta."
    - id: file
      title:
        pl: Złóż wniosek do wojewody
        en: File the application with the voivode
        uk: Подайте заяву воєводі
        ru: Подайте заявление воеводе
      description:
        pl: Osobiście albo pocztą, do wojewody właściwego dla Twojego miejsca zamieszkania.
        en: In person or by post, to the voivode for where you live.
        uk: Особисто або поштою, воєводі за вашим місцем проживання.
        ru: Лично или по почте, воеводе по вашему месту жительства.
      dependsOn: [pay]
      channels: [in_person, post]
      officeKind: voivodeship_office
      quotes:
        - page: *uznanie
          text: "Wniosek możesz złożyć osobiście albo wysłać pocztą do wojewody – właściwego dla Twojego miejsca zamieszkania."
    - id: decision
      title:
        pl: Czekaj na decyzję wojewody
        en: Wait for the voivode's decision
        uk: Чекайте на рішення воєводи
        ru: Ждите решения воеводы
      description:
        pl: Przed decyzją urząd pyta policję, Agencję Bezpieczeństwa Wewnętrznego i inne instytucje, czy nabycie przez Ciebie obywatelstwa polskiego nie stanowi zagrożenia dla obronności lub bezpieczeństwa państwa albo dla bezpieczeństwa i porządku publicznego. Od decyzji możesz się odwołać do Ministra Spraw Wewnętrznych i Administracji, a od jego decyzji złożyć skargę do sądu administracyjnego.
        en: Before deciding, the office asks the police, the Internal Security Agency and other institutions whether your acquiring Polish citizenship would threaten the defence or security of the state, or public safety and order. You can appeal the decision to the Minister of the Interior and Administration, and then complain about the minister's decision to an administrative court.
        uk: Перед рішенням управління запитує поліцію, Агентство внутрішньої безпеки та інші установи, чи не становить набуття вами польського громадянства загрози для обороноздатності чи безпеки держави або для громадської безпеки й порядку. Рішення можна оскаржити до міністра внутрішніх справ і адміністрації, а рішення міністра можна оскаржити до адміністративного суду.
        ru: Перед решением управление запрашивает полицию, Агентство внутренней безопасности и другие учреждения, не представляет ли приобретение вами польского гражданства угрозы для обороноспособности или безопасности государства либо для общественной безопасности и порядка. Решение можно обжаловать министру внутренних дел и администрации, а решение министра можно обжаловать в административном суде.
      dependsOn: [file]
      channels: [post]
      officeKind: voivodeship_office
      quotes:
        - page: *uznanie
          text: "Przed wydaniem decyzji w sprawie urząd zwraca się do Komendanta Stołecznego lub Komendanta Wojewódzkiego Policji, Dyrektora Delegatury Agencji Bezpieczeństwa Wewnętrznego, a także do innych instytucji i organów o udzielenie informacji, czy nabycie przez Ciebie obywatelstwa polskiego nie stanowi zagrożenia dla obronności lub bezpieczeństwa państwa albo ochrony bezpieczeństwa i porządku publicznego."
        - page: *uznanie
          text: "Jeśli nie zgadzasz się z decyzją wojewody, możesz złożyć odwołanie do Ministra Spraw Wewnętrznych i Administracji (MSWiA)."
        - page: *uznanie
          text: "Jeśli nie zgadzasz się z decyzją MSWiA, masz prawo zaskarżyć ją do sądu administracyjnego."
  documents:
