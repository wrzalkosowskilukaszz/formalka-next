# The state certificate of Polish as a foreign language (certyfikat znajomości języka polskiego),
# from the evidence pack docs/knowledge/VERIFICATION-certyfikat-polski-2026-10-02.md. The citizenship
# guide (recognition) and the EU long-term resident guide require Polish at B1 or higher and point
# here. Sources: the act on the Polish language (consolidated Dz.U. 2026 poz. 81, chapter 2a), the
# exam regulation (Dz.U. 2025 poz. 217), the State Commission's site (certyfikatpolski.pl), and the
# act changing the system from 1 January 2027 (Dz.U. 2026 poz. 676).
# The exam price is a ceiling in euro set by the act; each exam centre sets its own price. The
# fee section takes amounts in złoty only, so the ceiling is a quoted warning instead.
# Polish statements are verbatim official wording; en/uk/ru are our translations.

- id: polish-language-certificate
  domain: citizenship
  related: [citizenship-recognition, eu-long-term-resident]
  riskClass: B
  verificationLevel: auto_structured
  checkedAt: "2026-10-02"
  title:
    pl: Certyfikat znajomości języka polskiego
    en: Polish language certificate (state exam)
    uk: Сертифікат знання польської мови (державний іспит)
    ru: Сертификат знания польского языка (государственный экзамен)
  summary:
    pl: Państwowy certyfikat znajomości polskiego. Przy uznaniu za obywatela polskiego certyfikat na wymaganym poziomie potwierdza znajomość języka (świadectwo szkoły też się liczy), a przy zezwoleniu rezydenta długoterminowego UE jest jednym z przyjmowanych dokumentów. Jak wybrać sesję i ośrodek, zapisać się, jak wygląda egzamin, ile może kosztować i co zmienia nowa ustawa.
    en: The state certificate of Polish. For recognition as a Polish citizen, a certificate at the required level proves your Polish (a school certificate counts too), and for the EU long-term resident permit it is one of the accepted documents. How to pick a session and a centre, sign up, what the exam is like, what it can cost, and what a new act changes.
    uk: Державний сертифікат знання польської. Для визнання громадянином Польщі сертифікат потрібного рівня підтверджує знання мови (свідоцтво школи теж підходить), а для дозволу довгострокового резидента ЄС він є одним із прийнятих документів. Як вибрати сесію й центр, записатися, який вигляд має іспит, скільки він може коштувати і що змінює новий закон.
    ru: Государственный сертификат знания польского. Для признания гражданином Польши сертификат нужного уровня подтверждает знание языка (свидетельство школы тоже подходит), а для разрешения долгосрочного резидента ЕС он является одним из принимаемых документов. Как выбрать сессию и центр, записаться, как проходит экзамен, сколько он может стоить и что меняет новый закон.
  applicability:
    conditions:
      - id: who-can-take-it
        statement:
          value:
            pl: "Cudzoziemiec lub obywatel polski na stałe zamieszkały za granicą może uzyskać urzędowe poświadczenie znajomości języka polskiego jako obcego po zdaniu egzaminu z języka polskiego jako obcego"
            en: "A foreigner, or a Polish citizen living abroad permanently, can get the official confirmation of Polish as a foreign language after passing the exam in Polish as a foreign language."
            uk: "Іноземець або громадянин Польщі, який постійно проживає за кордоном, може отримати офіційне підтвердження знання польської мови як іноземної після складання іспиту з польської мови як іноземної."
            ru: "Иностранец или гражданин Польши, постоянно проживающий за границей, может получить официальное подтверждение знания польского языка как иностранного после сдачи экзамена по польскому языку как иностранному."
          quotes:
            - page: &act https://api.sejm.gov.pl/eli/acts/DU/2026/81/text.pdf
              text: "Cudzoziemiec lub obywatel polski na stałe zamieszkały za granicą może uzyskać urzędowe poświadczenie znajomości języka polskiego jako obcego po zdaniu egzaminu z języka polskiego jako obcego"
      - id: the-certificate
        statement:
          value:
            pl: "Urzędowym poświadczeniem znajomości języka polskiego jako obcego jest certyfikat znajomości języka polskiego"
            en: "The official confirmation is the certificate of Polish, issued by the State Commission for Certifying Proficiency in Polish as a Foreign Language. Exams are held by centres the minister licenses."
            uk: "Офіційним підтвердженням є сертифікат знання польської мови, який видає Державна комісія з підтвердження знання польської мови як іноземної. Іспити проводять центри, яким міністр надав право."
            ru: "Официальным подтверждением является сертификат знания польского языка, который выдает Государственная комиссия по подтверждению знания польского языка как иностранного. Экзамены проводят центры, которым министр предоставил право."
          quotes:
            - page: *act
              text: "Urzędowym poświadczeniem znajomości języka polskiego jako obcego jest certyfikat znajomości języka polskiego, zwany dalej „certyfikatem”, wydawany przez Państwową Komisję do spraw Poświadczania Znajomości Języka Polskiego jako Obcego, zwaną dalej „Komisją”."
            - page: *act
              text: "Minister właściwy do spraw szkolnictwa wyższego i nauki po zasięgnięciu opinii Komisji nadaje, w drodze decyzji administracyjnej, uprawnienie do organizowania egzaminów z języka polskiego jako obcego na określonym poziomie biegłości językowej na wniosek:"
            - page: *act
              text: "Listę podmiotów uprawnionych oraz informacje o terminach i miejscach przeprowadzania egzaminów publikuje się w Biuletynie Informacji Publicznej na stronie podmiotowej ministra właściwego do spraw szkolnictwa wyższego i nauki."
  exclusions: []
  requiredFacts: [certyfikat.purpose, certyfikat.school_in_polish]
  steps:
    - id: pick-session
      title:
        pl: Wybierz poziom i sesję egzaminacyjną
        en: Choose the level and an exam session
        uk: Виберіть рівень і сесію іспитів
        ru: Выберите уровень и экзаменационную сессию
      description:
        pl: "Do uznania za obywatela polskiego i do zezwolenia rezydenta długoterminowego UE potrzebny jest co najmniej poziom B1 (szczegóły w części „Warto wiedzieć”). Opublikowane terminy sesji: 5 i 6 grudnia 2026 r. (B1 dla dorosłych, B2 dla dzieci i młodzieży), a w 2027 r. 6 i 7 lutego, 10 i 11 kwietnia, 12 i 13 czerwca, 2 i 3 października oraz 27 i 28 listopada. Nie każda sesja obejmuje wszystkie poziomy: sprawdź poziomy w brzmieniu urzędowym poniżej."
        en: "Recognition as a Polish citizen and the EU long-term resident permit need at least level B1 (details under \"Worth knowing\"). Published session dates: 5 and 6 December 2026 (B1 for adults, B2 for children and young people), then in 2027: 6 and 7 February, 10 and 11 April, 12 and 13 June, 2 and 3 October, and 27 and 28 November. Not every session offers every level: check the levels in the official wording below."
        uk: "Для визнання громадянином Польщі та дозволу довгострокового резидента ЄС потрібен щонайменше рівень B1 (подробиці в розділі «Варто знати»). Опубліковані дати сесій: 5 і 6 грудня 2026 року (B1 для дорослих, B2 для дітей і молоді), а у 2027 році 6 і 7 лютого, 10 і 11 квітня, 12 і 13 червня, 2 і 3 жовтня та 27 і 28 листопада. Не кожна сесія охоплює всі рівні: перевірте рівні в офіційному формулюванні нижче."
        ru: "Для признания гражданином Польши и разрешения долгосрочного резидента ЕС нужен уровень не ниже B1 (подробности в разделе «Полезно знать»). Опубликованные даты сессий: 5 и 6 декабря 2026 года (B1 для взрослых, B2 для детей и молодежи), а в 2027 году 6 и 7 февраля, 10 и 11 апреля, 12 и 13 июня, 2 и 3 октября, а также 27 и 28 ноября. Не каждая сессия охватывает все уровни: проверьте уровни в официальной формулировке ниже."
      channels: [online]
      quotes:
        - page: https://certyfikatpolski.pl/terminy-sesji-egzaminacyjnych-w-2026-roku/
          text: "- 5-6 grudnia 2026 r. (sobota-niedziela) poziom B1 - w grupie dostosowanej do potrzeb osób dorosłych oraz B2 – w grupie dostosowanej do potrzeb dzieci i młodzieży."
        - page: &y2027 https://certyfikatpolski.pl/terminy-sesji-egzaminacyjnych-w-2027-roku/
          text: "- 6-7 lutego 2027 r. – poziomy B1 i B2 w grupie dostosowanej do potrzeb osób dorosłych;"
        - page: *y2027
          text: "- 10-11 kwietnia 2027 r. – poziomy B1, B2 i C1 w grupie dostosowanej do potrzeb osób dorosłych;"
        - page: *y2027
          text: "- 12-13 czerwca 2027 r. – poziomy B1 i B2 w grupie dostosowanej do potrzeb osób dorosłych oraz B1 i B2 w grupie dostosowanej do potrzeb dzieci i młodzieży;"
        - page: *y2027
          text: "- 2-3 października 2027 r. – poziomy B1 i C2 w grupie dostosowanej do potrzeb osób dorosłych;"
        - page: *y2027
          text: "- 27-28 listopada 2027 r. – poziomy B1 i C1 w grupie dostosowanej do potrzeb osób dorosłych oraz B2 w grupie dostosowanej do potrzeb dzieci i młodzieży."
    - id: register-at-centre
      title:
        pl: Zapisz się w ośrodku egzaminacyjnym
        en: Sign up at an exam centre
        uk: Запишіться в екзаменаційному центрі
        ru: Запишитесь в экзаменационном центре
      description:
        pl: Wybierasz ośrodek z listy na daną sesję i zapisujesz się na jego stronie, w terminie, który ośrodek wyznacza. Listy ośrodków i zapisy ruszają na dwa miesiące przed egzaminem. Ośrodek musi Cię zarejestrować najpóźniej miesiąc przed egzaminem, więc zapisz się wcześnie.
        en: You pick a centre from the list for that session and sign up on its website, within the window the centre sets. The centre lists and sign-up open two months before the exam. The centre has to register you at the latest one month before the exam, so sign up early.
        uk: Ви вибираєте центр зі списку на цю сесію і записуєтеся на його сайті в строк, який встановлює центр. Списки центрів і запис відкриваються за два місяці до іспиту. Центр має зареєструвати вас не пізніше ніж за місяць до іспиту, тож записуйтеся заздалегідь.
        ru: Вы выбираете центр из списка на эту сессию и записываетесь на его сайте в срок, который устанавливает центр. Списки центров и запись открываются за два месяца до экзамена. Центр должен зарегистрировать вас не позднее чем за месяц до экзамена, поэтому записывайтесь заранее.
      dependsOn: [pick-session]
      channels: [online]
      quotes:
        - page: &signup https://certyfikatpolski.pl/rejestracja-na-egzamin/
          text: "Proszę wybrać z poniższej listy ośrodek, w którym planuje Pan/Pani zdawać egzamin."
        - page: *signup
          text: "Proszę wejść na stronę wybranego ośrodka i dokonać rejestracji w terminie wyznaczonym przez ośrodek."
        - page: *signup
          text: "Listy ośrodków organizujących egzamin w danej sesji publikowane są na 2 miesiące przed egzaminem. Wtedy też zaczyna się rejestracja w poszczególnych ośrodkach."
        - page: &reg https://api.sejm.gov.pl/eli/acts/DU/2025/217/text.pdf
          text: "Podmiot uprawniony nie później niż na miesiąc przed terminem egzaminu dokonuje rejestracji osoby zamierzającej przystąpić do egzaminu przez wprowadzenie danych, o których mowa w art. 11g ust. 3 ustawy, oraz danych dotyczących egzaminu do elektronicznej bazy prowadzonej przez Komisję."
    - id: pay-centre
      title:
        pl: Zapłać ośrodkowi za egzamin
        en: Pay the centre for the exam
        uk: Сплатіть центру за іспит
        ru: Оплатите центру экзамен
      description:
        pl: Płacisz na konto ośrodka, w którym jest Twoja rejestracja; dane do przelewu i termin płatności podaje ośrodek. Bez opłaty nie ma rejestracji.
        en: You pay to the account of the centre where you signed up; the centre gives the transfer details and the payment date. Without payment there is no registration.
        uk: Ви платите на рахунок центру, де записалися; реквізити й строк оплати вказує центр. Без оплати реєстрації немає.
        ru: Вы платите на счет центра, где записались; реквизиты и срок оплаты указывает центр. Без оплаты регистрации нет.
      dependsOn: [register-at-centre]
      channels: [online]
      quotes:
        - page: *signup
          text: "Proszę dokonać opłaty za egzamin na konto ośrodka, w którym została dokonana rejestracja. Dane do przelewu znajdzie Pan/Pani na stronie ośrodka."
        - page: &faq https://certyfikatpolski.pl/najczesciej-zadawane-pytania/
          text: "Termin rejestracji rozpoczyna się nie wcześniej, niż na 2 miesiące przed egzaminem, z kolei termin płatności ustala każdy ośrodek egzaminacyjny indywidulanie, informacja zamieszczana jest na stronie www ośrodka."
        - page: *act
          text: "Warunkiem rejestracji jest uiszczenie podmiotowi uprawnionemu opłaty za przystąpienie do egzaminu."
    - id: sit-exam
      title:
        pl: Przystąp do części pisemnej i ustnej
        en: Take the written and the oral part
        uk: Складіть письмову та усну частини
        ru: Сдайте письменную и устную части
      description:
        pl: Na poziomie B1 dla dorosłych część pisemna sprawdza słuchanie, czytanie, gramatykę i pisanie; w części ustnej losujesz zestaw zadań i wykonujesz je przed komisją. Weź dokument tożsamości, jaki wskazał ośrodek. Tak wygląda egzamin według obecnego rozporządzenia; od 1 stycznia 2027 r. zasady ma określić nowe rozporządzenie, którego jeszcze nie ogłoszono (stan na 2 października 2026 r.).
        en: At level B1 for adults, the written part tests listening, reading, grammar and writing; in the oral part you draw a set of tasks and do them in front of the examiners. Bring the ID document the centre named. This is the exam under the current regulation; from 1 January 2027 a new regulation is to set the rules, and it had not been published as of 2 October 2026.
        uk: На рівні B1 для дорослих письмова частина перевіряє аудіювання, читання, граматику й письмо; в усній частині ви витягуєте один із наборів завдань і виконуєте їх перед комісією. Візьміть документ, що посвідчує особу, який вказав центр. Так іспит виглядає за чинним розпорядженням; з 1 січня 2027 року правила має визначити нове розпорядження, яке станом на 2 жовтня 2026 року ще не оприлюднено.
        ru: На уровне B1 для взрослых письменная часть проверяет аудирование, чтение, грамматику и письмо; в устной части вы вытягиваете один из наборов заданий и выполняете их перед комиссией. Возьмите документ, удостоверяющий личность, который указал центр. Так экзамен выглядит по действующему распоряжению; с 1 января 2027 года правила должно определить новое распоряжение, которое по состоянию на 2 октября 2026 года еще не опубликовано.
      dependsOn: [pay-centre]
      channels: [in_person]
      quotes:
        - page: *act
          text: "Egzamin składa się z części pisemnej i części ustnej."
        - page: *reg
          text: "na poziomie B1 trwa nie dłużej niż 190 minut i składa się z modułów polegających na sprawdzeniu: – rozumienia ze słuchu, – rozumienia tekstów pisanych, – poprawności gramatycznej, – umiejętności pisania,"
        - page: *reg
          text: "b) na poziomach B1 i B2 trwa nie dłużej niż 15 minut,"
        - page: &structure https://certyfikatpolski.pl/o-egzaminie/struktura-egzaminu/
          text: "Zdający losują jeden z trzech zestawów, z których każdy składa się z dwóch lub trzech zadań, a następnie wykonują zadania przed komisją."
    - id: result
      title:
        pl: Odbierz wynik i certyfikat
        en: Get the result and the certificate
        uk: Отримайте результат і сертифікат
        ru: Получите результат и сертификат
      description:
        pl: Wynik na piśmie przekazuje ośrodek w ciągu trzech dni od otrzymania protokołu egzaminu. Certyfikat wydaje Komisja w ciągu 30 dni od otrzymania protokołu i przekazuje go ośrodkowi, a ośrodek niezwłocznie doręcza go Tobie. To terminy z obecnego rozporządzenia. Jeśli ośrodek zarejestrował Cię od 1 stycznia 2027 r., Komisja przekaże certyfikat w ciągu 30 dni od wniesienia przez ośrodek opłaty za certyfikat.
        en: The centre gives you the result in writing within three days of getting the exam protocol. The Commission issues the certificate within 30 days of getting the protocol and sends it to the centre, which hands it to you without delay. These are the deadlines in the current regulation. If the centre registered you on or after 1 January 2027, the Commission sends the certificate within 30 days of the centre paying the certificate fee.
        uk: Центр письмово передає вам результат протягом трьох днів після отримання протоколу іспиту. Комісія видає сертифікат протягом 30 днів після отримання протоколу і передає його центру, а центр невідкладно вручає його вам. Це строки за чинним розпорядженням. Якщо центр зареєстрував вас 1 січня 2027 року або пізніше, Комісія передасть сертифікат протягом 30 днів після сплати центром збору за сертифікат.
        ru: Центр письменно передает вам результат в течение трех дней после получения протокола экзамена. Комиссия выдает сертификат в течение 30 дней после получения протокола и передает его центру, а центр незамедлительно вручает его вам. Это сроки по действующему распоряжению. Если центр зарегистрировал вас 1 января 2027 года или позже, Комиссия передаст сертификат в течение 30 дней после оплаты центром сбора за сертификат.
      dependsOn: [sit-exam]
      channels: [post]
      quotes:
        - page: *reg
          text: "Podmiot uprawniony przekazuje zdającemu informację o wyniku egzaminu w postaci pisemnej, w terminie trzech dni od dnia doręczenia mu przez komisję egzaminacyjną protokołu z egzaminu."
        - page: *reg
          text: "Komisja wydaje i przekazuje podmiotowi uprawnionemu certyfikaty dla osób, które zdały egzamin, w terminie 30 dni od dnia otrzymania protokołu egzaminu wraz z załącznikami."
        - page: *reg
          text: "Podmiot uprawniony niezwłocznie doręcza certyfikaty osobom, które zdały egzamin."
        - page: &act2027 https://api.sejm.gov.pl/eli/acts/DU/2026/676/text.pdf
          text: "Komisja przekazuje podmiotowi uprawnionemu certyfikaty osób, które zdały egzamin, w terminie 30 dni od dnia przekazania przez podmiot uprawniony opłat, o których mowa w ust. 4c pkt 2."
  documents:
    - id: id-document
      namePl:
        value: dokumentu potwierdzającego tożsamość
        quotes:
          - page: *reg
            text: "rodzaju dokumentu potwierdzającego tożsamość, który osoba zamierzająca przystąpić do egzaminu jest obowiązana okazać przed przystąpieniem do egzaminu"
      description:
        pl: Ten, który ośrodek wskazał przed egzaminem.
        en: The one the centre named before the exam.
        uk: Той, який центр вказав перед іспитом.
        ru: Тот, который центр указал перед экзаменом.
  fees: []
  deadlines:
    - id: recheck
      description:
        pl: Jeśli nie zgadzasz się z wynikiem części pisemnej, możesz złożyć do Komisji wniosek o ponowne sprawdzenie w ciągu 21 dni od otrzymania informacji o wyniku, na piśmie, pocztą albo osobiście w siedzibie NAWA (Narodowej Agencji Wymiany Akademickiej), z potwierdzeniem opłaty. Przy wysyłce pocztą liczy się data stempla. Do czasu decyzji Komisja wstrzymuje wydanie certyfikatu. W tym samym terminie możesz poprosić ośrodek o wgląd w kopię swojej pracy. To zasady dla osób zarejestrowanych przed 1 stycznia 2027 r.
        en: If you disagree with the result of the written part, you can ask the Commission to check it again within 21 days of receiving the result, in writing, by post or in person at NAWA (Polish National Agency for Academic Exchange), with proof of payment. For a request sent by post, the postmark date counts. Until the Commission decides, the certificate is held back. Within the same 21 days you can ask the centre to see a copy of your paper. These are the rules for people registered before 1 January 2027.
        uk: Якщо ви не згодні з результатом письмової частини, можна подати до Комісії заяву про повторну перевірку протягом 21 дня від отримання результату, письмово, поштою або особисто в NAWA (Національному агентстві академічного обміну), з підтвердженням оплати. Якщо заяву надіслано поштою, рахується дата поштового штемпеля. До рішення Комісії видачу сертифіката зупиняють. Протягом тих самих 21 дня можна попросити центр показати копію вашої роботи. Це правила для осіб, зареєстрованих до 1 січня 2027 року.
        ru: Если вы не согласны с результатом письменной части, можно подать в Комиссию заявление о повторной проверке в течение 21 дня с получения результата, письменно, по почте или лично в NAWA (Национальном агентстве академического обмена), с подтверждением оплаты. Если заявление отправлено по почте, считается дата почтового штемпеля. До решения Комиссии выдачу сертификата приостанавливают. В течение тех же 21 дня можно попросить центр показать копию вашей работы. Это правила для людей, зарегистрированных до 1 января 2027 года.
      rule:
        value: { kind: relative, amount: 21, unit: day, from: result_notice }
        quotes:
          - page: *act
            text: "Osoba, która przystąpiła do egzaminu, może w terminie 21 dni od dnia otrzymania informacji o wyniku egzaminu złożyć do Komisji wniosek o ponowne sprawdzenie części pisemnej egzaminu."
          - page: &procedures https://certyfikatpolski.pl/o-egzaminie/procedury/
            text: "Do czasu rozpatrzenia wniosku przez Komisję wstrzymuje się wydanie certyfikatu."
          - page: *procedures
            text: "Wypełniony wniosek należy przesłać pocztą bądź złożyć osobiście w siedzibie NAWA (ul. Polna 40, 00-635 Warszawa)."
          - page: *procedures
            text: "Wniosek nie zostanie rozpatrzony przez Komisję, jeżeli został złożony po ustawowym terminie (w przypadku wniosków wysłanych pocztą decyduje data stempla pocztowego)."
          - page: *reg
            text: "Na wniosek zdającego złożony w terminie 21 dni od dnia otrzymania informacji o wyniku egzaminu podmiot uprawniony, który organizował ten egzamin, jest obowiązany udostępnić zdającemu do wglądu kopię pracy egzaminacyjnej."
  variations: []
  pitfalls:
    - id: price
      important: true
      statement:
        value:
          pl: "Opłata za przystąpienie do egzaminu nie może być wyższa niż równowartość w walucie kraju, w którym egzamin jest przeprowadzany:"
          en: "The price is set by each exam centre. The act only caps it: for levels B1 and B2 for adults, at most the equivalent of 150 euro in the currency of the country where the exam takes place. If you pay in zloty, the euro amount is converted at the National Bank of Poland's average euro rate from the last day of the month before the month you pay. Ask the centre for its price. These are the rules for people registered before 1 January 2027."
          uk: "Ціну встановлює кожен екзаменаційний центр. Закон лише обмежує її: для рівнів B1 і B2 для дорослих не більше еквівалента 150 євро у валюті країни, де проводиться іспит. У разі оплати в злотих суму в євро перераховують за середнім курсом Національного банку Польщі на останній день місяця перед оплатою. Фактичну ціну уточнюйте в центрі. Це правила для осіб, зареєстрованих до 1 січня 2027 року."
          ru: "Цену устанавливает каждый экзаменационный центр. Закон лишь ограничивает ее: для уровней B1 и B2 для взрослых не более эквивалента 150 евро в валюте страны, где проводится экзамен. При оплате в злотых сумму в евро пересчитывают по среднему курсу Национального банка Польши на последний день месяца перед оплатой. Фактическую цену уточняйте в центре. Это правила для людей, зарегистрированных до 1 января 2027 года."
        quotes:
          - page: *act
            text: "Opłata za przystąpienie do egzaminu nie może być wyższa niż równowartość w walucie kraju, w którym egzamin jest przeprowadzany:"
