          - page: *faq
            text: "Wysokość opłaty egzaminacyjnej ustala każdy ośrodek indywidulanie, przy czym opłata nie może być wyższa niż:"
    - id: pass-mark
      important: true
      statement:
        value:
          pl: "B1 – jest uzyskanie co najmniej 50 % punktów z każdego modułu części pisemnej egzaminu oraz z części ustnej egzaminu,"
          en: "To pass at level B1 (adults) you need at least 50% of the points in each written module, and at least 50% in the oral part. A strong score in one module doesn't make up for a weak one. This is the current regulation; from 1 January 2027 a new regulation is to set the pass marks, and it had not been published as of 2 October 2026."
          uk: "Щоб скласти іспит на рівні B1 (дорослі), потрібно щонайменше 50 % балів з кожного модуля письмової частини і щонайменше 50 % з усної частини. Високий результат в одному модулі не компенсує слабкий в іншому. Так визначає чинне розпорядження; з 1 січня 2027 року прохідні пороги має встановити нове розпорядження, яке станом на 2 жовтня 2026 року ще не оприлюднено."
          ru: "Чтобы сдать экзамен на уровне B1 (взрослые), нужно не менее 50 % баллов по каждому модулю письменной части и не менее 50 % по устной части. Высокий результат в одном модуле не компенсирует слабый в другом. Так определяет действующее распоряжение; с 1 января 2027 года проходные пороги должно установить новое распоряжение, которое по состоянию на 2 октября 2026 года еще не опубликовано."
        quotes:
          - page: *reg
            text: "na poziomach biegłości językowej w grupie dostosowanej do potrzeb osób dorosłych:"
          - page: *reg
            text: "B1 – jest uzyskanie co najmniej 50 % punktów z każdego modułu części pisemnej egzaminu oraz z części ustnej egzaminu,"
    - id: age-groups
      statement:
        value:
          pl: "Do egzaminu certyfikatowego z języka polskiego jako obcego w grupie dostosowanej do potrzeb osób dorosłych mogą przystąpić osoby, które w dniu egzaminu mają ukończone 18 lat."
          en: "According to the Commission, the adult group is for people who are 18 or older on the day of the exam; the group for children and young people is for ages 14 to 17. The official pages don't say whether the voivodeship office accepts a B1 from the group for young people; ask the voivodeship office."
          uk: "За даними Комісії, група для дорослих призначена для осіб, яким у день іспиту виповнилося 18 років; група для дітей і молоді призначена для віку від 14 до 17 років. Офіційні сторінки не кажуть, чи приймає воєводське управління рівень B1 з групи для молоді; запитайте у воєводському управлінні."
          ru: "По данным Комиссии, группа для взрослых предназначена для людей, которым в день экзамена исполнилось 18 лет; группа для детей и молодежи предназначена для возраста от 14 до 17 лет. Официальные страницы не говорят, принимает ли воеводское управление уровень B1 из группы для молодежи; спросите в воеводском управлении."
        quotes:
          - page: &who https://certyfikatpolski.pl/o-egzaminie/kto-moze-zdawac-egzamin/
            text: "Do egzaminu certyfikatowego z języka polskiego jako obcego w grupie dostosowanej do potrzeb osób dorosłych mogą przystąpić osoby, które w dniu egzaminu mają ukończone 18 lat."
