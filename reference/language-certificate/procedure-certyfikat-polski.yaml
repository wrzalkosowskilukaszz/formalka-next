    - id: school-instead-of-exam
      important: true
      condition: { all: [{ fact: certyfikat.purpose, in: [citizenship] }, { fact: certyfikat.school_in_polish, eq: "yes" }] }
      statement:
        value:
          pl: "Cudzoziemiec ubiegający się o uznanie za obywatela polskiego, z wyłączeniem cudzoziemca, o którym mowa w ust. 1 pkt 4 i 5, jest obowiązany posiadać znajomość języka polskiego potwierdzoną urzędowym poświadczeniem, o którym mowa w art. 11a ustawy z dnia 7 października 1999 r. o języku polskim (Dz. U. z 2024 r. poz. 1556 oraz z 2025 r. poz. 622), na poziomie biegłości językowej co najmniej B1, świadectwem ukończenia szkoły w Rzeczypospolitej Polskiej lub świadectwem ukończenia szkoły za granicą z wykładowym językiem polskim."
          en: "For recognition as a Polish citizen, the citizenship act also accepts a certificate from a school in Poland or from a school abroad taught in Polish, so you may not need the exam. A post-secondary (policealna) school certificate doesn't count."
          uk: "Для визнання громадянином Польщі закон про громадянство приймає також свідоцтво школи в Польщі або школи за кордоном з польською мовою навчання, тож іспит може бути не потрібен. Свідоцтво післясередньої школи не підходить."
          ru: "Для признания гражданином Польши закон о гражданстве принимает также свидетельство школы в Польше или школы за границей с польским языком обучения, поэтому экзамен может быть не нужен. Свидетельство послесредней школы не подходит."
        quotes:
          - page: &citizenship https://api.sejm.gov.pl/eli/acts/DU/2025/1611/text.pdf
            text: "Cudzoziemiec ubiegający się o uznanie za obywatela polskiego, z wyłączeniem cudzoziemca, o którym mowa w ust. 1 pkt 4 i 5, jest obowiązany posiadać znajomość języka polskiego potwierdzoną urzędowym poświadczeniem, o którym mowa w art. 11a ustawy z dnia 7 października 1999 r. o języku polskim (Dz. U. z 2024 r. poz. 1556 oraz z 2025 r. poz. 622), na poziomie biegłości językowej co najmniej B1, świadectwem ukończenia szkoły w Rzeczypospolitej Polskiej lub świadectwem ukończenia szkoły za granicą z wykładowym językiem polskim."
          - page: *citizenship
            text: "Znajomości języka polskiego, o której mowa w ust. 2, nie potwierdza świadectwo ukończenia szkoły policealnej, o której mowa w art. 18 ust. 1 pkt 2 lit. f ustawy z dnia 14 grudnia 2016 r. – Prawo oświatowe (Dz. U. z 2025 r. poz. 1043 i 1160)."
    - id: ask-the-office
      statement:
        value:
          pl: "Informacje w tej sprawie można uzyskać w lokalnym urzędzie wojewódzkim rozpatrującym wnioski o nadanie obywatelstwa (Wydział ds. Cudzoziemców)."
          en: "Asked which exam level is enough for citizenship, the Commission sends readers to the local voivodeship office that handles citizenship applications (its foreigners' department). For recognition as a Polish citizen (by the voivode), the citizenship act requires B1 or higher, except for minors in the two cases it lists. For a grant by the President, the act asks only for information about your Polish and sets no level."
          uk: "На питання, якого рівня іспиту достатньо для громадянства, Комісія відсилає до місцевого воєводського управління, що розглядає заяви про громадянство (відділ у справах іноземців). Для визнання громадянином (воєводою) закон про громадянство вимагає рівня щонайменше B1, крім неповнолітніх у двох названих у ньому випадках. Для надання громадянства Президентом закон вимагає лише інформації про знання польської і рівня не визначає."
          ru: "На вопрос, какого уровня экзамена достаточно для гражданства, Комиссия отсылает в местное воеводское управление, которое рассматривает заявления о гражданстве (отдел по делам иностранцев). Для признания гражданином (воеводой) закон о гражданстве требует уровня не ниже B1, кроме несовершеннолетних в двух названных в нем случаях. Для предоставления гражданства Президентом закон требует только информации о знании польского и уровня не устанавливает."
        quotes:
          - page: *faq
            text: "Jaki poziom egzaminu wystarczy do ubiegania się o obywatelstwo polskie?"
          - page: *faq
            text: "Informacje w tej sprawie można uzyskać w lokalnym urzędzie wojewódzkim rozpatrującym wnioski o nadanie obywatelstwa (Wydział ds. Cudzoziemców)."
          - page: *citizenship
            text: "Cudzoziemiec ubiegający się o uznanie za obywatela polskiego, z wyłączeniem cudzoziemca, o którym mowa w ust. 1 pkt 4 i 5, jest obowiązany posiadać znajomość języka polskiego potwierdzoną urzędowym poświadczeniem, o którym mowa w art. 11a ustawy z dnia 7 października 1999 r. o języku polskim (Dz. U. z 2024 r. poz. 1556 oraz z 2025 r. poz. 622), na poziomie biegłości językowej co najmniej B1, świadectwem ukończenia szkoły w Rzeczypospolitej Polskiej lub świadectwem ukończenia szkoły za granicą z wykładowym językiem polskim."
          - page: *citizenship
            text: "informację o znajomości przez cudzoziemca języka polskiego;"
    - id: certificate-without-exam
      statement:
        value:
          pl: "– może otrzymać, na wniosek, certyfikat bez konieczności zdania egzaminu."
          en: "Some people can get the certificate without the exam, on request through NAWA (Polish National Agency for Academic Exchange): among others, those with a doctorate written and defended in Polish at a Polish university, graduates of studies taught in Polish at a Polish university, and graduates of certain secondary schools in Poland or schools abroad taught in Polish. This certificate is not the same as a school certificate: for recognition as a Polish citizen, the act accepts a school certificate directly, but not a university diploma."
          uk: "Деякі люди можуть отримати сертифікат без іспиту, за заявою через NAWA (Національне агентство академічного обміну): зокрема ті, хто має ступінь доктора за дисертацією, написаною й захищеною польською мовою в польському університеті, випускники навчання польською мовою в польському університеті та випускники певних середніх шкіл у Польщі або шкіл за кордоном з польською мовою навчання. Цей сертифікат не те саме, що свідоцтво школи: для визнання громадянином Польщі закон приймає безпосередньо свідоцтво школи, але не диплом університету."
          ru: "Некоторые люди могут получить сертификат без экзамена, по заявлению через NAWA (Национальное агентство академического обмена): в частности те, у кого есть степень доктора за диссертацию, написанную и защищенную на польском языке в польском вузе, выпускники обучения на польском языке в польском вузе и выпускники определенных средних школ в Польше или школ за границей с польским языком обучения. Этот сертификат не то же самое, что свидетельство школы: для признания гражданином Польши закон принимает непосредственно свидетельство школы, но не диплом вуза."
        quotes:
          - page: *act
            text: "– może otrzymać, na wniosek, certyfikat bez konieczności zdania egzaminu."
          - page: *act
            text: "uzyskał stopień doktora na podstawie rozprawy doktorskiej napisanej i obronionej w języku polskim w uczelni lub podmiocie, działających w systemie szkolnictwa wyższego i nauki Rzeczypospolitej Polskiej"
          - page: *act
            text: "studia prowadzone w języku polskim w uczelni działającej w systemie szkolnictwa wyższego i nauki Rzeczypospolitej Polskiej"
          - page: *act
            text: "Wniosek o wydanie certyfikatu, o którym mowa w art. 11a ust. 4, składa się do Komisji za pośrednictwem Narodowej Agencji Wymiany Akademickiej, działającej na podstawie ustawy z dnia 7 lipca 2017 r. o Narodowej Agencji Wymiany Akademickiej (Dz. U. z 2025 r. poz. 1643)."
    - id: other-certificates-eu-only
      statement:
        value:
          pl: "certyfikaty następujących instytucji:"
          en: "For the EU long-term resident permit, certificates from ECL and TELC also count, besides this state certificate. For recognition as a Polish citizen they don't: the citizenship act accepts only this state certificate or a school certificate."
          uk: "Для дозволу довгострокового резидента ЄС, крім цього державного сертифіката, підходять також сертифікати ECL і TELC. Для визнання громадянином Польщі не підходять: закон про громадянство приймає лише цей державний сертифікат або свідоцтво школи."
          ru: "Для разрешения долгосрочного резидента ЕС, кроме этого государственного сертификата, подходят также сертификаты ECL и TELC. Для признания гражданином Польши не подходят: закон о гражданстве принимает только этот государственный сертификат или свидетельство школы."
        quotes:
          - page: &eu https://api.sejm.gov.pl/eli/acts/DU/2023/1076/text.pdf
            text: "certyfikat znajomości języka polskiego, o którym mowa w art. 11a ust. 2 ustawy z dnia 7 października 1999 r. o języku polskim"
          - page: *eu
            text: "certyfikaty następujących instytucji:"
          - page: *eu
            text: "European Consortium for the Certificate of Attainment in Modern Languages (ECL),"
          - page: *eu
            text: "telc GmbH, WBT Weiterbildungs-Testsysteme GmbH (TELC);"
          - page: *citizenship
            text: "Cudzoziemiec ubiegający się o uznanie za obywatela polskiego, z wyłączeniem cudzoziemca, o którym mowa w ust. 1 pkt 4 i 5, jest obowiązany posiadać znajomość języka polskiego potwierdzoną urzędowym poświadczeniem, o którym mowa w art. 11a ustawy z dnia 7 października 1999 r. o języku polskim (Dz. U. z 2024 r. poz. 1556 oraz z 2025 r. poz. 622), na poziomie biegłości językowej co najmniej B1, świadectwem ukończenia szkoły w Rzeczypospolitej Polskiej lub świadectwem ukończenia szkoły za granicą z wykładowym językiem polskim."
    - id: changes-2027
      important: true
      statement:
        value:
          pl: "Do osób zarejestrowanych w bazie, o której mowa w art. 11g ust. 2 ustawy zmienianej w art. 1, w brzmieniu dotychczasowym, przed dniem wejścia w życie niniejszej ustawy, stosuje się przepisy dotychczasowe."
          en: "Changes from 1 January 2027 (the act is already published). If the centre registered you before 1 January 2027, today's rules still apply to you. For everyone else: the exam price cap becomes a share of the average wage in the third quarter of the year before the exam, as announced by Statistics Poland: 7% for levels B1 and B2 in the older group. The certificate costs 100 zloty, and so does a duplicate; after you pass, you pay it to the centre within 7 days of learning that you passed. You can ask the Commission to re-check the written part within 21 days of receiving your result; the fee for this becomes 20% of the maximum exam fee, paid to NAWA's bank account in zloty within 7 days of the request. A lost or destroyed certificate can be replaced on request within 25 years of receiving it. The groups are split by age: the older group, for people who are 16 or older on the exam day, can take levels A1 to C2; the younger group, for those under 16, levels A1 to B2."
          uk: "Зміни з 1 січня 2027 року (закон уже опубліковано). Якщо центр зареєстрував вас до 1 січня 2027 року, до вас і далі застосовують чинні правила. Для інших: граничну ціну іспиту визначатимуть як частку середньої зарплати за третій квартал року перед іспитом, яку оголошує Головне статистичне управління: 7 % для рівнів B1 і B2 у старшій групі. Сертифікат коштуватиме 100 злотих, дублікат так само; після складання іспиту ви платите центру протягом 7 днів від отримання інформації, що склали. Заяву до Комісії про повторну перевірку письмової частини можна подати протягом 21 дня від отримання інформації про результат; збір за це становитиме 20 % максимальної ціни іспиту; його сплачують на рахунок NAWA в злотих протягом 7 днів від подання заяви. Загублений або знищений сертифікат можна буде замінити за заявою протягом 25 років від його отримання. Групи ділитимуть за віком: у старшій групі, для тих, кому в день іспиту виповнилося 16 років, можна складати рівні від A1 до C2; у молодшій, для тих, кому ще немає 16, рівні від A1 до B2."
          ru: "Изменения с 1 января 2027 года (закон уже опубликован). Если центр зарегистрировал вас до 1 января 2027 года, к вам по-прежнему применяют действующие правила. Для остальных: предельную цену экзамена будут определять как долю средней зарплаты за третий квартал года перед экзаменом, которую объявляет Главное статистическое управление: 7 % для уровней B1 и B2 в старшей группе. Сертификат будет стоить 100 злотых, дубликат столько же; после сдачи экзамена вы платите центру в течение 7 дней с получения информации, что сдали. Заявление в Комиссию о повторной проверке письменной части можно подать в течение 21 дня с получения информации о результате; сбор за это составит 20 % максимальной цены экзамена; его платят на счет NAWA в злотых в течение 7 дней с подачи заявления. Утерянный или уничтоженный сертификат можно будет заменить по заявлению в течение 25 лет с его получения. Группы будут делить по возрасту: в старшей группе, для тех, кому в день экзамена исполнилось 16 лет, можно сдавать уровни от A1 до C2; в младшей, для тех, кому еще нет 16, уровни от A1 до B2."
        quotes:
          - page: *act2027
            text: "Ustawa wchodzi w życie z dniem 1 stycznia 2027 r., z wyjątkiem art. 1 pkt 2 lit. b i d, które wchodzą w życie po upływie 14 dni od dnia ogłoszenia."
          - page: *act2027
            text: "Do osób zarejestrowanych w bazie, o której mowa w art. 11g ust. 2 ustawy zmienianej w art. 1, w brzmieniu dotychczasowym, przed dniem wejścia w życie niniejszej ustawy, stosuje się przepisy dotychczasowe."
          - page: *act2027
            text: "– przeciętnego wynagrodzenia w 3 kwartale roku kalendarzowego poprzedzającego rok, w którym jest przeprowadzany egzamin, ogłaszanego przez Prezesa Głównego Urzędu Statystycznego na podstawie art. 20 pkt 2 ustawy z dnia 17 grudnia 1998 r. o emeryturach i rentach z Funduszu Ubezpieczeń Społecznych (Dz. U. z 2025 r. poz. 1749 oraz z 2026 r. poz. 26 i 425)."
          - page: *act2027
            text: "3) B1 i B2 w grupie, o której mowa w art. 11a ust. 3 pkt 1 – 7 %,"
          - page: *act2027
            text: "Za wydanie certyfikatu i duplikatu certyfikatu pobiera się opłatę w wysokości 100 zł, przy czym opłatę wnosi się na rachunek bankowy:"
          - page: *act2027
            text: "2) podmiotu uprawnionego do organizowania egzaminu, zwanego dalej „podmiotem uprawnionym”, w terminie 7 dni od dnia otrzymania informacji o zdaniu egzaminu – w przypadku certyfikatu, o którym mowa w ust. 4a."
          - page: *act2027
            text: "Osoba, która przystąpiła do egzaminu, może, w terminie 21 dni od dnia otrzymania informacji o wyniku egzaminu, złożyć do Komisji wniosek o ponowne sprawdzenie i ocenę pracy z części pisemnej egzaminu. NAWA dokonuje oceny formalnej wniosku. Wniosek przekazuje się na adres NAWA."
          - page: *act2027
            text: "Za ponowne sprawdzenie i ocenę pracy z części pisemnej egzaminu pobiera się opłatę w wysokości 20 % maksymalnej wysokości opłaty za przystąpienie do danego egzaminu, określonej w art. 11g ust. 5. Opłatę wnosi się na rachunek bankowy NAWA w złotych, w terminie 7 dni od dnia złożenia wniosku, o którym mowa w ust. 1."
          - page: *act2027
            text: "W przypadku zniszczenia lub utraty certyfikatu, na wniosek osoby, która go otrzymała, złożony niepóźniej niż w terminie 25 lat od dnia jego otrzymania, wydaje się duplikat certyfikatu."
          - page: *act2027
            text: "1) A1, A2, B1, B2, C1 i C2 – w grupie dostosowanej do potrzeb osób, które w dniu przystąpienia do egzaminu ukończyły 16. rok życia,"
          - page: *act2027
            text: "2) A1, A2, B1 i B2 – w grupie dostosowanej do potrzeb osób, które w dniu przystąpienia do egzaminu nie ukończyły 16. roku życia"
