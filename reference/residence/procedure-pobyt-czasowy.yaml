    - id: wait-epuap-ended
      statement:
        value:
          pl: "Doręczenie korespondencji nadanej przez osobę fizyczną lub podmiot niebędący podmiotem publicznym, będące użytkownikami konta w ePUAP, do podmiotu publicznego posiadającego elektroniczną skrzynkę podawczą w ePUAP, w ramach usługi udostępnianej w ePUAP, jest równoważne w skutkach prawnych z doręczeniem przy wykorzystaniu publicznej usługi rejestrowanego doręczenia elektronicznego do dnia 31 grudnia 2025 r."
          en: "A letter sent through ePUAP by a private person to a public body's ePUAP box had the same legal effect as e‑Doręczenia only until 31 December 2025. The digital affairs ministry announced that from January 2026 e‑Doręczenia is the basic way to deliver official letters electronically, and ePUAP is used only where the law says so."
          uk: "Лист, надісланий приватною особою через ePUAP до скриньки органу в ePUAP, мав таку саму юридичну силу, як e‑Doręczenia, лише до 31 грудня 2025 р. Міністерство цифровізації повідомило, що з січня 2026 р. e‑Doręczenia є основним способом електронного вручення офіційних листів, а ePUAP застосовують лише у випадках, визначених законом."
          ru: "Письмо, отправленное частным лицом через ePUAP в ящик органа в ePUAP, имело ту же юридическую силу, что и e‑Doręczenia, только до 31 декабря 2025 г. Министерство цифровизации сообщило, что с января 2026 г. e‑Doręczenia являются основным способом электронного вручения официальных писем, а ePUAP применяют только в случаях, указанных в законе."
        quotes:
          - page: &edor-act https://api.sejm.gov.pl/eli/acts/DU/2026/3/text.pdf
            text: "Doręczenie korespondencji nadanej przez osobę fizyczną lub podmiot niebędący podmiotem publicznym, będące użytkownikami konta w ePUAP, do podmiotu publicznego posiadającego elektroniczną skrzynkę podawczą w ePUAP, w ramach usługi udostępnianej w ePUAP, jest równoważne w skutkach prawnych z doręczeniem przy wykorzystaniu publicznej usługi rejestrowanego doręczenia elektronicznego do dnia 31 grudnia 2025 r."
          - page: https://www.gov.pl/web/cyfryzacja/od-stycznia-2026-r-zmienia-sie-cyfrowa-korespondencja-z-urzedami--zaplanowane-prace-techniczne
            text: "Od 1 stycznia 2026 r. e-Doręczenia staną się podstawowym sposobem elektronicznego doręczania pism urzędowych, a ePUAP będzie stosowany wyłącznie w przypadkach wskazanych w przepisach."
