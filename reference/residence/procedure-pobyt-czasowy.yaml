      condition: { not: { fact: pobyt_czasowy.filed_via, eq: paper_before_mos } }
      statement:
        value:
          pl: "Czy portal MOS poinformuje mnie o konieczności uzupełnienia dokumentów lub o aktualnym statusie sprawy?\nNie. O konieczności osobistego stawiennictwa i uzupełnienia dokumentów poinformuje Cię pracownik urzędu wojewódzkiego."
          en: "Will the MOS portal tell me that I need to add documents, or what my case's current status is? No. An employee of the voivodeship office will tell you if you need to come in person or add documents."
          uk: "Чи повідомить портал MOS, що потрібно доповнити документи, або який поточний статус справи? Ні. Про потребу з'явитися особисто чи доповнити документи вас повідомить працівник воєводського управління."
          ru: "Сообщит ли портал MOS, что нужно дополнить документы, или какой текущий статус дела? Нет. О необходимости явиться лично или дополнить документы вам сообщит сотрудник воеводского управления."
        quotes:
          - page: *qa
            text: "Czy portal MOS poinformuje mnie o konieczności uzupełnienia dokumentów lub o aktualnym statusie sprawy?\nNie. O konieczności osobistego stawiennictwa i uzupełnienia dokumentów poinformuje Cię pracownik urzędu wojewódzkiego."
    - id: wait-udsc-line
      statement:
        value:
          pl: "Sprawy związane z wydawaniem zezwoleń na pobyt, pracę oraz rejestracją zaproszeń dla cudzoziemców są realizowane przez wydziały spraw cudzoziemców oraz wydziały spraw obywatelskich i cudzoziemców w urzędach wojewódzkich. W przypadku pytań związanych z tego typu postępowaniami należy kontaktować się z właściwym urzędem wojewódzkim."
          en: "The Office for Foreigners (UDSC) says: residence and work permits and invitations for foreigners are handled by the foreigners' departments of the voivodeship offices. For questions about these cases, contact the competent voivodeship office."
          uk: "Управління у справах іноземців (UDSC) зазначає: дозволами на перебування, роботу та реєстрацією запрошень для іноземців займаються відділи у справах іноземців воєводських управлінь. З питаннями щодо таких справ звертайтеся до відповідного воєводського управління."
          ru: "Управление по делам иностранцев (UDSC) указывает: разрешениями на пребывание, работу и регистрацией приглашений для иностранцев занимаются отделы по делам иностранцев воеводских управлений. С вопросами по таким делам обращайтесь в соответствующее воеводское управление."
        quotes:
          - page: https://www.gov.pl/web/udsc/dane-kontaktowe
            text: "Sprawy związane z wydawaniem zezwoleń na pobyt, pracę oraz rejestracją zaproszeń dla cudzoziemców są realizowane przez wydziały spraw cudzoziemców oraz wydziały spraw obywatelskich i cudzoziemców w urzędach wojewódzkich. W przypadku pytań związanych z tego typu postępowaniami należy kontaktować się z właściwym urzędem wojewódzkim."
    - id: wait-udsc-helplines
      condition: { not: { fact: pobyt_czasowy.office, eq: mazowieckie } }
      statement:
        value:
          pl: "Infolinie dla cudzoziemców"
          en: "The Office for Foreigners (UDSC) publishes a list of helplines for foreigners („Infolinie dla cudzoziemców”), with lines of several voivodeship offices."
          uk: "Управління у справах іноземців (UDSC) публікує перелік гарячих ліній для іноземців („Infolinie dla cudzoziemców”), зокрема лінії кількох воєводських управлінь."
          ru: "Управление по делам иностранцев (UDSC) публикует список горячих линий для иностранцев („Infolinie dla cudzoziemców”), в том числе линии нескольких воеводских управлений."
        quotes:
          - page: https://www.gov.pl/web/udsc/infolinie-dla-cudzoziemcow
            text: "Infolinie dla cudzoziemców"
    - id: wait-mazowiecki-status-line
      condition: { fact: pobyt_czasowy.office, eq: mazowieckie }
      statement:
        value:
          pl: "Dzwoniąc pod numer (22) 695 67 73 sprawdzisz nie tylko status swojej sprawy ale także uzyskasz odpowiedzi na najczęściej zadawane pytania."
          en: "By calling (22) 695 67 73 you can check your case's status and also get answers to the most common questions. If you applied to make your stay legal, you check the status by typing your case number on the phone's keypad."
          uk: "Зателефонувавши за номером (22) 695 67 73, ви можете перевірити статус своєї справи, а також отримати відповіді на найчастіші запитання. Якщо ви подали заяву про легалізацію перебування, статус перевіряють, ввівши номер справи на клавіатурі телефону."
          ru: "Позвонив по номеру (22) 695 67 73, вы можете проверить статус своего дела, а также получить ответы на самые частые вопросы. Если вы подали заявление о легализации пребывания, статус проверяют, введя номер дела на клавиатуре телефона."
        quotes:
          - page: &maz-status https://www.gov.pl/web/uw-mazowiecki/jak-sprawdzic-status-sprawy
            text: "Dzwoniąc pod numer (22) 695 67 73 sprawdzisz nie tylko status swojej sprawy ale także uzyskasz odpowiedzi na najczęściej zadawane pytania."
          - page: *maz-status
            text: "Jeśli złożyłeś wniosek o legalizację pobytu, możesz w prosty sposób sprawdzić status swojej sprawy wpisując jej numer na klawiaturze numerycznej telefonu, zgodnie z przykładem zaprezentowanym powyżej."
    - id: wait-mazowiecki-helpline-no-status
