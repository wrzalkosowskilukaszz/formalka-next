      statement:
        value:
          pl: "Załóż adres i skrzynkę do doręczeń elektronicznych e-Doręczeń."
          en: "The Mazowiecki office asks you to set up an e‑Doręczenia address and mailbox. Its steps: get a PESEL number, set up a Trusted Profile (profil zaufany), then apply for the address online on the gov.pl e‑Doręczenia page, sign the application electronically and activate the mailbox."
          uk: "Мазовецьке управління просить створити адресу і скриньку e‑Doręczenia. Його кроки: отримати номер PESEL, створити довірений профіль (profil zaufany), потім подати заяву на адресу онлайн на сторінці e‑Doręczenia на gov.pl, підписати заяву електронно і активувати скриньку."
          ru: "Мазовецкое управление просит создать адрес и ящик e‑Doręczenia. Его шаги: получить номер PESEL, создать доверенный профиль (profil zaufany), затем подать заявление на адрес онлайн на странице e‑Doręczenia на gov.pl, подписать заявление электронно и активировать ящик."
        quotes:
          - page: *maz-ed
            text: "Załóż adres i skrzynkę do doręczeń elektronicznych e-Doręczeń."
          - page: *maz-ed
            text: "- Uzyskaj numer PESEL https://www.gov.pl/web/gov/uzyskaj-numer-pesel-dla-cudzoziemcow(link is external)."
          - page: *maz-ed
            text: "- Załóż profil zaufany https://pz.gov.pl/pz/registerMainPage(link is external)."
          - page: *maz-ed
            text: "- Złóż wniosek elektronicznie i uzyskaj adres do e-Doręczeń:"
          - page: *maz-ed
            text: "- sprawdź wniosek i podpisz go elektronicznie;"
          - page: *maz-ed
            text: "- kliknij Aktywuj skrzynkę;"
    - id: wait-mazowiecki-templates
      condition: { fact: pobyt_czasowy.office, eq: mazowieckie }
      statement:
        value:
          pl: "Korzystaj z wzorów pism zamieszczonych na naszej stronie internetowej w zakładce https://migrant.wsc.mazowieckie.pl/pl/pliki-do-pobrania/327"
          en: "The Mazowiecki office asks you to use the letter templates on its own website (the address of the tab is in the official wording)."
          uk: "Мазовецьке управління просить користуватися зразками листів на його власному сайті (адреса вкладки є в офіційному формулюванні)."
          ru: "Мазовецкое управление просит пользоваться образцами писем на его собственном сайте (адрес вкладки есть в официальной формулировке)."
        quotes:
          - page: *maz-ed
            text: "Korzystaj z wzorów pism zamieszczonych na naszej stronie internetowej w zakładce https://migrant.wsc.mazowieckie.pl/pl/pliki-do-pobrania/327"
    - id: wait-mazowiecki-title
      condition: { fact: pobyt_czasowy.office, eq: mazowieckie }
      statement:
        value:
          pl: "Wszelkie przesyłane pisma dotyczące spraw w toku, muszą być zatytułowane w następujący sposób:"
          en: "Every letter you send about a pending case must be titled with the case number and the foreigner's first name and surname; when you send through e‑Doręczenia, that goes in the title of the message. In the letter itself, add the foreigner's date of birth, citizenship and current address. One electronic letter = one case."
          uk: "Кожен лист щодо справи, що триває, має мати заголовок із номером справи та ім'ям і прізвищем іноземця; якщо ви надсилаєте через e‑Doręczenia, це пишуть у темі відправлення. У самому листі додайте дату народження, громадянство й поточну адресу проживання іноземця. Один електронний лист = одна справа."
          ru: "Каждое письмо по текущему делу должно иметь заголовок с номером дела и именем и фамилией иностранца; если вы отправляете через e‑Doręczenia, это пишут в теме отправления. В самом письме добавьте дату рождения, гражданство и текущий адрес проживания иностранца. Одно электронное письмо = одно дело."
        quotes:
          - page: *maz-ed
            text: "Wszelkie przesyłane pisma dotyczące spraw w toku, muszą być zatytułowane w następujący sposób:"
          - page: *maz-ed
            text: "Pamiętaj, że wysyłając przez e-Doręczenia pisma i dokumenty do spraw zawsze wpisuj w tytuł przesyłki:"
          - page: *maz-ed
            text: "- numer sprawy,"
          - page: *maz-ed
            text: "- imię i nazwisko cudzoziemca."
          - page: *maz-ed
            text: "W treści załączonego do przesyłki pisma, oprócz powyższych danych, dopisz datę urodzenia, obywatelstwo i aktualny adres zamieszkania cudzoziemca."
          - page: *maz-ed
            text: "1 pismo elektroniczne = 1 sprawa."
    - id: wait-mazowiecki-signature
      condition: { fact: pobyt_czasowy.office, eq: mazowieckie }
      statement:
        value:
          pl: "Dokumenty wymagające Twojego podpisu, musisz podpisać własnym profilem zaufanym lub osobistym podpisem certyfikowanym (kwalifikowanym)."
          en: "Documents that need your signature must be signed with your own Trusted Profile (profil zaufany) or a personal certified (qualified) signature."
          uk: "Документи, які потребують вашого підпису, треба підписати власним довіреним профілем (profil zaufany) або особистим сертифікованим (кваліфікованим) підписом."
          ru: "Документы, которые требуют вашей подписи, нужно подписать собственным доверенным профилем (profil zaufany) или личной сертифицированной (квалифицированной) подписью."
        quotes:
          - page: *maz-ed
            text: "Dokumenty wymagające Twojego podpisu, musisz podpisać własnym profilem zaufanym lub osobistym podpisem certyfikowanym (kwalifikowanym)."
    - id: wait-mazowiecki-mos-electronic
      condition: { all: [{ fact: pobyt_czasowy.office, eq: mazowieckie }, { not: { fact: pobyt_czasowy.filed_via, eq: paper_before_mos } }] }
      statement:
        value:
          pl: "Po uruchomieniu nowego systemu MOS, do wniosków złożonych elektronicznie za pośrednictwem tego systemu, dokumenty wysyłaj wyłącznie elektronicznie. Nie przesyłaj dokumentów papierowych pocztą tradycyjną."
          en: "Since the new MOS system started, for applications filed electronically through it, send documents electronically only. Don't send paper documents by post."
          uk: "Після запуску нової системи MOS до заяв, поданих через неї в електронній формі, надсилайте документи лише електронно. Не надсилайте паперових документів звичайною поштою."
          ru: "После запуска новой системы MOS к заявлениям, поданным через нее в электронной форме, отправляйте документы только в электронном виде. Не отправляйте бумажные документы обычной почтой."
        quotes:
          - page: *maz-ed
            text: "Po uruchomieniu nowego systemu MOS, do wniosków złożonych elektronicznie za pośrednictwem tego systemu, dokumenty wysyłaj wyłącznie elektronicznie. Nie przesyłaj dokumentów papierowych pocztą tradycyjną."
  handoff:
    when:
      pl: Jeśli nie wiesz, o jakie zezwolenie wnioskować, albo urząd wezwie Cię do uzupełnienia wniosku. Pomocy przy składaniu wniosku udziela też urząd wojewódzki, do którego go składasz.
      en: If you're not sure which permit to apply for, or the office asks you to complete your application. The voivodeship office you're filing with also helps with filing.
      uk: Якщо ви не впевнені, на який дозвіл подавати заяву, або установа вимагає доповнити заяву. Допомогу з поданням заяви надає також воєводське управління, куди ви її подаєте.
      ru: Если вы не уверены, на какое разрешение подавать заявление, или учреждение требует дополнить заявление. Помощь с подачей заявления оказывает также воеводское управление, куда вы его подаете.
    options:
      - id: free-legal-aid
        kind: free_legal_aid
        name:
          pl: Nieodpłatna pomoc prawna
          en: Free legal aid (state programme)
          uk: Безоплатна правова допомога (державна програма)
          ru: Бесплатная юридическая помощь (государственная программа)
        link: { url: https://www.gov.pl/web/nieodplatna-pomoc/nieodplatna-pomoc-prawna }
