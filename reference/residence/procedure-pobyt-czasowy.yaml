          - page: *wm
            text: "85 zł:\n- Zezwolenie na pobyt czasowy ze względu na okoliczności wymagające krótkotrwałego pobytu cudzoziemca na terytorium RP, jeżeli przebywa na terytorium:\n- jest zobowiązany do osobistego stawiennictwa przed polskim organem w władzy publicznej,\n- obecność cudzoziemca na terytorium RP wymaga interes RP"
