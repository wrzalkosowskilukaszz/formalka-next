        uk: "Якщо заява стосується особи за кордоном: її фото. Скільки фото і в якому форматі, уточніть у воєводському управлінні."
        ru: "Если заявление касается человека за границей: его фото. Сколько фото и в каком формате, уточните в воеводском управлении."
    - id: paper-consent
      condition: { fact: pobyt_czasowy.purpose, eq: family_abroad }
      namePl:
        value: zgodę na złożenie przez członka rodziny rozdzielonej wniosku
        quotes:
          - page: https://api.sejm.gov.pl/eli/acts/DU/2025/1794/text.pdf
            text: "Członek rodziny rozdzielonej, składając wniosek o udzielenie zezwolenia na pobyt czasowy, o którym mowa w art. 159 ust. 1 lub art. 160 pkt 1, 3, 4 lub 6, przedstawia kopię ważnego dokumentu podróży cudzoziemca oraz dołącza do wniosku aktualną fotografię cudzoziemca i zgodę na złożenie przez członka rodziny rozdzielonej wniosku o udzielenie zezwolenia na pobyt czasowy w celu połączenia się z rodziną lub zezwolenia na pobyt czasowy, o którym mowa w art. 160 pkt 1, 3, 4 lub 6, wyrażoną na formularzu określonym w przepisach wydanych na podstawie art. 107 ust. 1, chyba że członek rodziny rozdzielonej jest przedstawicielem ustawowym cudzoziemca."
      description:
        pl: "Gdy wniosek dotyczy osoby za granicą: jej zgoda, wyrażona na urzędowym formularzu. Nie jest potrzebna, jeśli członek rodziny w Polsce jest jej przedstawicielem ustawowym."
        en: "If the application is for a person abroad: their consent, given on the official form. Not needed if the family member in Poland is their legal representative."
        uk: "Якщо заява стосується особи за кордоном: її згода, надана на офіційному бланку. Не потрібна, якщо член сім'ї в Польщі є її законним представником."
        ru: "Если заявление касается человека за границей: его согласие, данное на официальном бланке. Не нужно, если член семьи в Польше является его законным представителем."
    - id: paper-supporting
      condition: { fact: pobyt_czasowy.purpose, eq: family_abroad }
      namePl:
        value: dokumenty niezbędne do potwierdzenia danych zawartych we wniosku
        quotes:
          - page: https://api.sejm.gov.pl/eli/acts/DU/2025/1794/text.pdf
            text: "Do wniosku o udzielenie zezwolenia na pobyt czasowy, o którym mowa w art. 159 ust. 1 lub art. 160 pkt 1, 3, 4 lub 6, członek rodziny rozdzielonej dodatkowo dołącza dokumenty niezbędne do potwierdzenia danych zawartych we wniosku i okoliczności uzasadniających ubieganie się o udzielenie zezwolenia, o którym mowa w art. 159 ust. 1 lub art. 160 pkt 1, 3, 4 lub 6."
      description:
        pl: "Gdy wniosek dotyczy osoby za granicą: dokumenty, które potwierdzają dane z wniosku. O pełną listę zapytaj w urzędzie wojewódzkim."
        en: "If the application is for a person abroad: documents that prove what the application says. Ask the voivodeship office for the full list."
        uk: "Якщо заява стосується особи за кордоном: документи, що підтверджують дані із заяви. Повний перелік уточніть у воєводському управлінні."
        ru: "Если заявление касается человека за границей: документы, подтверждающие данные из заявления. Полный перечень уточните в воеводском управлении."
  fees:
