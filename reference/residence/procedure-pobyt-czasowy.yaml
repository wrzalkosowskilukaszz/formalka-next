          uk: "Міністерство внутрішніх справ писало, що чекає на рішення Суду справедливості ЄС у справі C-254/25 щодо питань про ст. 100c і 100d закону про допомогу громадянам України, які йому поставив воєводський адміністративний суд у Глівіце."
          ru: "Министерство внутренних дел писало, что ждет решения Суда Европейского союза по делу C-254/25 по вопросам о ст. 100c и 100d закона о помощи гражданам Украины, которые ему задал воеводский административный суд в Гливице."
        quotes:
          - page: https://bip.brpo.gov.pl/pl/content/rpo-cudzoziemcy-legalizacja-pobytu-przewleklosc-mswia-ponowne
            text: "Jednocześnie pragnę poinformować, że resort spraw wewnętrznych i administracji obecnie oczekuje na rozstrzygnięcie w sprawie C-254/25 prowadzonej przed Europejskim Trybunałem Sprawiedliwości Unii Europejskiej (TSUE) – przywołanej w wystąpieniu Pana Rzecznika – dotyczącej odpowiedzi na pytania prejudycjalne skierowane do TSUE przez Wojewódzki Sąd Administracyjny w Gliwicach, odnośnie do art. 100c i 100d ustawy pomocowej."
    # A ponaglenie is a formal remedy, kept apart from an ordinary inquiry: who rules on it, and the
    # official template (linked, never drafted by us).
    - id: wait-ponaglenie-authority
      condition: { fact: pobyt_czasowy.waiting_for, eq: decision }
      statement:
        value:
          pl: "Szef Urzędu jest organem wyższego stopnia w rozumieniu przepisów Kodeksu postępowania administracyjnego w stosunku do wojewody w sprawach uregulowanych w ustawach, o których mowa w ust. 1 pkt 1."
          en: "In the matters governed by the Act on Foreigners (and the other acts it lists), the Head of the Office for Foreigners is the voivode's higher authority under the Code of Administrative Procedure."
          uk: "У справах, які регулює Закон про іноземців (та інші перелічені в ньому закони), Голова Управління у справах іноземців є органом вищого рівня щодо воєводи в розумінні Кодексу адміністративного провадження."
          ru: "В делах, которые регулирует Закон об иностранцах (и другие перечисленные в нем законы), Глава Управления по делам иностранцев является органом высшей инстанции по отношению к воеводе в смысле Кодекса административного производства."
        quotes:
          - page: *foreigners
            text: "Szef Urzędu jest organem wyższego stopnia w rozumieniu przepisów Kodeksu postępowania administracyjnego w stosunku do wojewody w sprawach uregulowanych w ustawach, o których mowa w ust. 1 pkt 1."
    - id: wait-ponaglenie-where
      condition: { fact: pobyt_czasowy.waiting_for, eq: decision }
      statement:
        value:
          pl: "Ponaglenie wnosi się:"
          en: "A ponaglenie is filed with the higher authority, through the authority handling the case."
          uk: "Ponaglenie подають до органу вищого рівня через орган, який веде справу."
          ru: "Ponaglenie подают в орган высшей инстанции через орган, который ведет дело."
        quotes:
          - page: https://api.sejm.gov.pl/eli/acts/DU/2025/1691/text.pdf
            text: "Ponaglenie wnosi się:"
          - page: https://api.sejm.gov.pl/eli/acts/DU/2025/1691/text.pdf
            text: "1) do organu wyższego stopnia za pośrednictwem organu prowadzącego postępowanie;"
    - id: wait-ponaglenie-too-early
      condition: { fact: pobyt_czasowy.waiting_for, eq: decision }
      statement:
        value:
          pl: "Jeżeli ponaglenie zostało wniesione przed upływem terminu określonego w art. 35 albo przepisach szczególnych, organ prowadzący postępowanie pozostawia ponaglenie bez rozpoznania."
          en: "If a ponaglenie is filed before the time limit in art. 35 of the Code (or in specific rules) has passed, the authority handling the case leaves it unexamined. A ponaglenie must give its reasons."
          uk: "Якщо ponaglenie подано до спливу строку, визначеного ст. 35 Кодексу (або спеціальними правилами), орган, який веде справу, залишає його без розгляду. Ponaglenie має містити обґрунтування."
          ru: "Если ponaglenie подано до истечения срока, определенного ст. 35 Кодекса (или специальными правилами), орган, который ведет дело, оставляет его без рассмотрения. Ponaglenie должно содержать обоснование."
        quotes:
          - page: https://api.sejm.gov.pl/eli/acts/DU/2025/1691/text.pdf
            text: "Jeżeli ponaglenie zostało wniesione przed upływem terminu określonego w art. 35 albo przepisach szczególnych, organ prowadzący postępowanie pozostawia ponaglenie bez rozpoznania."
          - page: https://api.sejm.gov.pl/eli/acts/DU/2025/1691/text.pdf
            text: "Ponaglenie zawiera uzasadnienie."
    - id: wait-ponaglenie-no-notice
      condition: { fact: pobyt_czasowy.waiting_for, eq: decision }
      statement:
        value:
          pl: "W okresie, o którym mowa w ust. 1:"
          en: "During the suspension period (until 4 March 2027), the rules on an authority's inaction, and on its duty to tell the party that a case wasn't dealt with on time, don't apply to these cases."
          uk: "У період зупинення строків (до 4 березня 2027 р.) правила про бездіяльність органу і про його обов'язок повідомити сторону, що справу не вирішено вчасно, до цих справ не застосовуються."
          ru: "В период приостановления сроков (до 4 марта 2027 г.) правила о бездействии органа и о его обязанности сообщить стороне, что дело не решено вовремя, к этим делам не применяются."
        quotes:
          - page: *ukr-aid
            text: "W okresie, o którym mowa w ust. 1:"
          - page: *ukr-aid
            text: "1) przepisów o bezczynności organu oraz o obowiązku organu prowadzącego postępowanie w sprawach, o których mowa w ust. 1, do powiadamiania strony lub uczestnika postępowania o niezałatwieniu sprawy w terminie nie stosuje się;"
    - id: wait-ponaglenie-template
      condition: { fact: pobyt_czasowy.waiting_for, eq: decision }
      statement:
        value:
          pl: "Wzór ponaglenia"
          en: "biznes.gov.pl publishes a ponaglenie template („Wzór ponaglenia”). The service is free; a stamp duty of 17 zł applies only to a power of attorney, if someone represents you. It doesn't apply if your representative is your husband, wife, child, parent, grandparent, grandchild or sibling."
          uk: "Портал biznes.gov.pl публікує зразок ponaglenia („Wzór ponaglenia”). Послуга безкоштовна; гербовий збір 17 зл. сплачують лише за довіреність, якщо вас хтось представляє. Він не стягується, якщо вашим представником є чоловік, дружина, дитина, батько чи мати, дідусь, бабуся, онук чи онука, брат або сестра."
          ru: "Портал biznes.gov.pl публикует образец ponaglenia („Wzór ponaglenia”). Услуга бесплатная; гербовый сбор 17 зл. платят только за доверенность, если вас кто-то представляет. Он не взимается, если вашим представителем является муж, жена, ребенок, отец или мать, дедушка, бабушка, внук или внучка, брат или сестра."
        quotes:
          - page: &biznes https://www.biznes.gov.pl/pl/portal/ou590
            text: "Wzór ponaglenia"
          - page: *biznes
            text: "Usługa jest bezpłatna."
          - page: *biznes
            text: "17 zł – opłata skarbowa za pełnomocnictwo (jeśli cię dotyczy)"
          - page: *biznes
            text: "Opłata nie obowiązuje cię, jeśli twoim pełnomocnikiem jest mąż, żona, dziecko, rodzic, dziadek, babcia, wnuk lub rodzeństwo."
    # The card stage (owner clarification: decision and card never conflated). Art. 100d names
    # permit cases, not the card, so none of the remedies above is shown here.
    - id: wait-card-ex-officio
      condition: { all: [{ fact: pobyt_czasowy.waiting_for, eq: card }, { not: { fact: pobyt_czasowy.purpose, eq: family_abroad } }] }
      statement:
        value:
          pl: "Pierwszą kartę pobytu i europejski dokument podróży do celów powrotu wydaje się z urzędu."
          en: "The first residence card is issued ex officio: you don't apply for it separately. A residence card is issued to a foreigner who has been granted, among others, a temporary residence permit."
          uk: "Першу карту побиту видають з власної ініціативи органу: окремо подавати заяву на неї не потрібно. Карту побиту видають іноземцю, якому надано, зокрема, дозвіл на тимчасове перебування."
          ru: "Первую карту побыту выдают по инициативе органа: отдельно подавать заявление на нее не нужно. Карту побыту выдают иностранцу, которому выдано, в частности, разрешение на временное пребывание."
        quotes:
          - page: *mos-act
            text: "Pierwszą kartę pobytu i europejski dokument podróży do celów powrotu wydaje się z urzędu."
          - page: *foreigners
            text: "Kartę pobytu wydaje się cudzoziemcowi, któremu udzielono:"
          - page: *foreigners
            text: "1) zezwolenia na pobyt czasowy;"
    - id: wait-card-in-person
      condition: { fact: pobyt_czasowy.waiting_for, eq: card }
      statement:
        value:
          pl: "Cudzoziemiec odbiera kartę pobytu osobiście, chyba że w stosunku do tego cudzoziemca odstąpiono od wezwania do osobistego stawiennictwa na podstawie art. 106h ust. 1, art. 203h ust. 1 lub art. 219h ust. 1."
          en: "You collect the residence card in person, unless you were excused from the summons to come in person for your application. When you collect it, you show a valid travel document; in a particularly justified case, if you have none and can't get one, another identity document. For a child under 13 on the collection day, or a fully incapacitated person, a parent, guardian or curator collects the card and shows their own identity document. A child who was already 6 when the application was filed, and a fully incapacitated person, must be present."
          uk: "Карту побиту ви забираєте особисто, якщо вас не звільнили від виклику на особисту явку у справі вашої заяви. Забираючи її, ви показуєте чинний проїзний документ; в особливо обґрунтованому випадку, якщо його немає і отримати його неможливо, інший документ, що посвідчує особу. За дитину, якій у день отримання ще немає 13 років, або за повністю недієздатну особу карту забирає батько, мати, опікун або куратор і показує свій документ, що посвідчує особу. Дитина, якій на день подання заяви вже виповнилося 6 років, і недієздатна особа мають бути присутні."
          ru: "Карту побыту вы забираете лично, если вас не освободили от вызова на личную явку по вашему заявлению. Забирая ее, вы показываете действительный проездной документ; в особо обоснованном случае, если его нет и получить его невозможно, другой документ, удостоверяющий личность. За ребенка, которому в день получения еще нет 13 лет, или за полностью недееспособного человека карту забирает родитель, опекун или куратор и показывает свой документ, удостоверяющий личность. Ребенок, которому на день подачи заявления уже исполнилось 6 лет, и недееспособный человек должны присутствовать."
        quotes:
          - page: *mos-act
            text: "Cudzoziemiec odbiera kartę pobytu osobiście, chyba że w stosunku do tego cudzoziemca odstąpiono od wezwania do osobistego stawiennictwa na podstawie art. 106h ust. 1, art. 203h ust. 1 lub art. 219h ust. 1."
          - page: *mos-act
            text: "Cudzoziemiec, odbierając kartę pobytu, okazuje ważny dokument podróży."
          - page: *mos-act
            text: "W szczególnie uzasadnionym przypadku, gdy cudzoziemiec nie posiada ważnego dokumentu podróży ani nie ma możliwości jego uzyskania, może okazać inny dokument potwierdzający tożsamość."
          - page: *mos-act
            text: "W przypadku gdy karta pobytu została wydana cudzoziemcowi będącemu osobą małoletnią, która nie ukończyła 13. roku życia do dnia jej odbioru, albo osobą ubezwłasnowolnioną całkowicie, odbioru karty pobytu dokonuje odpowiednio rodzic, opiekun albo kurator, po okazaniu ważnego dokumentu potwierdzającego jego tożsamość."
          - page: *mos-act
            text: "osobą małoletnią, która ukończyła 6. rok życia do dnia złożenia wniosku o:"
          - page: *mos-act
            text: "– wymaga obecności tej osoby."
    - id: wait-card-pickup-mazowiecki
      condition: { all: [{ fact: pobyt_czasowy.waiting_for, eq: card }, { fact: pobyt_czasowy.office, eq: mazowieckie }] }
      statement:
        value:
          pl: "Skrzynka będzie Ci potrzebna między innymi do otrzymywania wezwań, informacji o terminach osobistego stawiennictwa w celu pobrania odcisków palców czy informacji o terminie odbioru karty pobytu kierowanych do Ciebie przez urząd."
          en: "The Mazowiecki office says you'll need an e‑Doręczenia mailbox, among other things, to receive the summonses, the dates to come in person for fingerprints and the date to collect your residence card that the office sends you."
          uk: "Мазовецьке управління зазначає: скринька e‑Doręczenia знадобиться вам, зокрема, щоб отримувати від управління виклики, дати особистої явки для зняття відбитків пальців і дату, коли можна забрати карту побиту."
          ru: "Мазовецкое управление указывает: ящик e‑Doręczenia понадобится вам, в частности, чтобы получать от управления вызовы, даты личной явки для снятия отпечатков пальцев и дату, когда можно забрать карту побыту."
        quotes:
          - page: *maz-ed
            text: "Skrzynka będzie Ci potrzebna między innymi do otrzymywania wezwań, informacji o terminach osobistego stawiennictwa w celu pobrania odcisków palców czy informacji o terminie odbioru karty pobytu kierowanych do Ciebie przez urząd."
    # Checking the status: MOS shows none; the Mazowiecki phone line (undated page, 2017 project);
