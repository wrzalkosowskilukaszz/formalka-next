            text: "Infolinia dla Obywatela nie udziela informacji dotyczących procedur wewnętrznych poszczególnych wydziałów oraz statusów spraw prowadzonych przez urząd."
          - page: *maz-contact
            text: "Punkt informacyjny nie udziela informacji dotyczących procedur wewnętrznych poszczególnych wydziałów oraz statusów spraw prowadzonych przez urząd."
    - id: wait-file-inspection
      statement:
        value:
          pl: "Strona ma prawo wglądu w akta sprawy, sporządzania z nich notatek, kopii lub odpisów."
          en: "As a party to the case you have the right to see the case file and to make notes, copies or extracts from it. This is done at the authority's premises, with one of its employees present. The authority may also let you do it in its online system, after you log in."
          uk: "Як сторона справи ви маєте право ознайомлюватися з матеріалами справи, робити з них нотатки, копії чи витяги. Це відбувається в приміщенні органу в присутності його працівника. Орган може також дозволити це у своїй онлайн-системі після входу."
          ru: "Как сторона дела вы имеете право знакомиться с материалами дела, делать из них заметки, копии или выписки. Это происходит в помещении органа в присутствии его сотрудника. Орган может также разрешить это в своей онлайн-системе после входа."
        quotes:
          - page: &kpa https://api.sejm.gov.pl/eli/acts/DU/2025/1691/text.pdf
            text: "Strona ma prawo wglądu w akta sprawy, sporządzania z nich notatek, kopii lub odpisów."
          - page: *kpa
            text: "Czynności określone w § 1 są dokonywane w lokalu organu administracji publicznej w obecności pracownika tego organu."
          - page: *kpa
            text: "Organ administracji publicznej może zapewnić stronie dokonanie czynności, o których mowa w § 1, w swoim systemie teleinformatycznym, po uwierzytelnieniu strony w sposób określony w art. 20a ust. 1 albo 2 ustawy z dnia 17 lutego 2005 r. o informatyzacji działalności podmiotów realizujących zadania publiczne."
    # Asking in writing: an ordinary inquiry is a podanie (KPA art. 63), backed by the duty to inform
    # (art. 9). No statutory answer deadline was found (art. 237's month is for a skarga, not shown).
    - id: wait-duty-to-inform
      statement:
        value:
          pl: "Organy administracji publicznej są obowiązane do należytego i wyczerpującego informowania stron o okolicznościach faktycznych i prawnych, które mogą mieć wpływ na ustalenie ich praw i obowiązków będących przedmiotem postępowania administracyjnego."
          en: "Public authorities must inform the parties properly and fully about the facts and the law that may affect their rights and obligations in the proceedings."
          uk: "Органи публічної адміністрації зобов'язані належно і вичерпно інформувати сторони про фактичні та правові обставини, які можуть вплинути на їхні права та обов'язки, що є предметом провадження."
          ru: "Органы публичной администрации обязаны надлежащим образом и исчерпывающе информировать стороны о фактических и правовых обстоятельствах, которые могут повлиять на их права и обязанности, являющиеся предметом производства."
        quotes:
          - page: *kpa
            text: "Organy administracji publicznej są obowiązane do należytego i wyczerpującego informowania stron o okolicznościach faktycznych i prawnych, które mogą mieć wpływ na ustalenie ich praw i obowiązków będących przedmiotem postępowania administracyjnego."
    - id: wait-podanie-forms
      statement:
        value:
          pl: "Podania (żądania, wyjaśnienia, odwołania, zażalenia) wnosi się na piśmie, za pomocą telefaksu lub ustnie do protokołu."
          en: "Letters to an authority (each one a podanie: requests, explanations, appeals, complaints) are filed in writing, by fax, or orally to be put on record."
          uk: "Звернення до органу (кожне з них є podanie: вимоги, пояснення, оскарження, скарги) подають письмово, факсом або усно до протоколу."
          ru: "Обращения в орган (каждое из них является podanie: требования, объяснения, обжалования, жалобы) подают письменно, по факсу или устно в протокол."
        quotes:
          - page: *kpa
            text: "Podania (żądania, wyjaśnienia, odwołania, zażalenia) wnosi się na piśmie, za pomocą telefaksu lub ustnie do protokołu."
    - id: wait-podanie-minimum
      statement:
        value:
          pl: "Podanie powinno zawierać co najmniej wskazanie osoby, od której pochodzi, jej adres, również w przypadku złożenia podania w postaci elektronicznej, i żądanie oraz czynić zadość innym wymaganiom ustalonym w przepisach szczególnych."
          en: "A letter must at least say who it is from, give that person's address (also when it is filed electronically) and say what is asked for, and meet any other requirements of specific rules. If it gives no address and the authority can't find one in the data it has, the letter is left unexamined."
          uk: "Звернення має містити щонайменше зазначення особи, від якої воно надходить, її адресу (також у разі подання в електронній формі) і вимогу, а також відповідати іншим вимогам спеціальних правил. Якщо адресу не зазначено і орган не може встановити її з наявних даних, звернення залишають без розгляду."
          ru: "Обращение должно содержать как минимум указание лица, от которого оно исходит, его адрес (также при подаче в электронной форме) и требование, а также отвечать другим требованиям специальных правил. Если адрес не указан и орган не может установить его по имеющимся данным, обращение оставляют без рассмотрения."
        quotes:
          - page: *kpa
            text: "Podanie powinno zawierać co najmniej wskazanie osoby, od której pochodzi, jej adres, również w przypadku złożenia podania w postaci elektronicznej, i żądanie oraz czynić zadość innym wymaganiom ustalonym w przepisach szczególnych."
          - page: *kpa
            text: "Jeżeli w podaniu nie wskazano adresu wnoszącego i nie ma możności ustalenia tego adresu na podstawie posiadanych danych, podanie pozostawia się bez rozpoznania."
    - id: wait-paper-signed
      statement:
        value:
          pl: "Podanie wniesione na piśmie albo ustnie do protokołu powinno być podpisane przez wnoszącego, a protokół ponadto przez pracownika, który go sporządził."
          en: "A letter filed on paper, or orally for the record, should be signed by the person filing it (and the record also by the employee who wrote it)."
          uk: "Звернення, подане письмово або усно до протоколу, має бути підписане особою, яка його подає (а протокол також працівником, який його склав)."
          ru: "Обращение, поданное письменно или устно в протокол, должно быть подписано лицом, которое его подает (а протокол также сотрудником, который его составил)."
        quotes:
          - page: *kpa
            text: "Podanie wniesione na piśmie albo ustnie do protokołu powinno być podpisane przez wnoszącego, a protokół ponadto przez pracownika, który go sporządził."
    - id: wait-electronic-address
      statement:
