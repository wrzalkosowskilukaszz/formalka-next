    - id: wait-which-office
      condition: { not: { fact: pobyt_czasowy.office, in: [mazowieckie, other] } }
      statement:
        value:
          pl: "Zezwolenia na pobyt czasowy udziela lub odmawia jego udzielenia wojewoda właściwy ze względu na miejsce pobytu cudzoziemca, w drodze decyzji."
          en: "A temporary residence permit is granted or refused, by a decision, by the voivode of the region where the foreigner is staying. Some permits follow other rules: for an intra-company transfer or long-term mobility, the voivode of the host entity's seat; for a family member still abroad, the voivode of the region where the family member in Poland is staying."
          uk: "Дозвіл на тимчасове перебування надає або відмовляє в ньому, рішенням, воєвода за місцем перебування іноземця. Для деяких дозволів правила інші: для внутрішньокорпоративного переведення чи довгострокової мобільності це воєвода за місцезнаходженням приймаючої організації; для члена сім'ї, який ще за кордоном, воєвода за місцем перебування члена сім'ї в Польщі."
          ru: "Разрешение на временное пребывание выдает или отказывает в нем, решением, воевода по месту пребывания иностранца. Для некоторых разрешений правила другие: для внутрикорпоративного перевода или долгосрочной мобильности это воевода по месту нахождения принимающей организации; для члена семьи, который еще за границей, воевода по месту пребывания члена семьи в Польше."
        quotes:
          - page: *mos-act
            text: "Zezwolenia na pobyt czasowy udziela lub odmawia jego udzielenia wojewoda właściwy ze względu na miejsce pobytu cudzoziemca, w drodze decyzji."
          - page: *mos-act
            text: "Zezwolenia na pobyt czasowy, o którym mowa w art. 139a ust. 1 i art. 139o ust. 1, udziela lub odmawia jego udzielenia wojewoda właściwy ze względu na siedzibę jednostki przyjmującej, w drodze decyzji."
          - page: *mos-act
            text: "Zezwolenia na pobyt czasowy, o którym mowa w art. 159 ust. 1 lub art. 160 pkt 1, 3, 4 lub 6, cudzoziemcowi przebywającemu poza granicami Rzeczypospolitej Polskiej, udziela lub odmawia jego udzielenia wojewoda właściwy ze względu na miejsce pobytu członka rodziny rozdzielonej, w drodze decyzji."
