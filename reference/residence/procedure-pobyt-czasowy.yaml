            text: "Jedyne koszty, jakie poniesiesz, to opłata skarbowa przy składaniu wniosku (w wysokości zależnej od rodzaju zezwolenia – od 340 zł do 640 zł) oraz opłata za wydanie karty pobytu (100 zł)."
  deadlines:
    - id: outage
      condition: { not: { fact: pobyt_czasowy.purpose, eq: family_abroad } }
      description:
        pl: Tylko gdy MOS nie działa w ostatnim dniu Twojego legalnego pobytu. Najpóźniej w 3. dniu roboczym po dniu, w którym MOS naprawiono; wniosek uznaje się wtedy za złożony w pierwszym dniu awarii.
        en: Only if MOS is down on the last day of your legal stay. No later than the 3rd working day after the day MOS is fixed; your application then counts as filed on the first day of the outage.
        uk: Лише якщо MOS не працює в останній день вашого легального перебування. Не пізніше 3-го робочого дня після дня, коли MOS полагодили; заява тоді вважається поданою в перший день збою.
        ru: Только если MOS не работает в последний день вашего легального пребывания. Не позднее 3-го рабочего дня после дня, когда работу MOS восстановили; заявление тогда считается поданным в первый день сбоя.
      rule:
        value: { kind: relative, amount: 3, unit: working_day, from: system_restored }
        quotes:
          - page: *qa
            text: "W takiej sytuacji wniosek powinieneś złożyć najpóźniej w ciągu 3 dni roboczych następujących po dniu, w którym usunięto niedostępność systemu. Jako datę złożenia wniosku uznany zostanie pierwszy dzień niedostępności systemu,"
          - page: *mos-act
            text: "W przypadku nieprawidłowego działania systemu teleinformatycznego, o którym mowa w art. 225a ust. 1, powodującego brak możliwości złożenia wniosków, o których mowa w art. 225a ust. 1, w terminie określonym odpowiednio w art. 105 ust. 1, art. 202 ust. 1 lub art. 218a ust. 1 wniosek składa się najpóźniej w 3. dniu roboczym następującym po dniu, w którym usunięto nieprawidłowości. W takim przypadku wniosek uznaje się za złożony w pierwszym dniu nieprawidłowego działania systemu teleinformatycznego, o którym mowa w art. 225a ust. 1."
  variations: []
  pitfalls:
    # Alert #42 (2026-10-07): the Ukraine-aid act suspends this time limit for every foreigner until
    # 4 March 2027 (art. 100d ust. 1). What that means for a reminder or a court complaint is disputed
    # (docs/knowledge/VERIFICATION-slow-proceedings-2026-10-07.md, on branch claude/backlog-inventory until merged), so the guide states the rule and
    # hands the reader to free legal aid instead of naming a remedy.
    - id: decision-time-suspended
      important: true
      seeProcedures: [free-legal-aid]
      statement:
        value:
          pl: "W okresie do dnia 4 marca 2027 r. bieg terminów na załatwienie spraw dotyczących:"
          en: "Until 4 March 2027 the time limits the law gives the voivode to decide residence permit cases don't run: they don't start, and one already running is suspended. This applies to every foreigner, not only to citizens of Ukraine. How this affects your case, and whether anything can be done about a long wait, is a question for free legal aid."
          uk: "До 4 березня 2027 р. строки, які закон дає воєводі на рішення у справах про дозволи на перебування, не плинуть: вони не починаються, а той, що вже почався, зупиняється. Це стосується всіх іноземців, а не лише громадян України. Як це впливає на вашу справу і чи можна щось зробити, якщо вона триває довго, пояснить безоплатна правова допомога."
          ru: "До 4 марта 2027 г. сроки, которые закон даёт воеводе на решение по делам о разрешениях на пребывание, не текут: они не начинаются, а уже начавшийся приостанавливается. Это касается всех иностранцев, а не только граждан Украины. Как это влияет на ваше дело и можно ли что-то сделать, если оно длится долго, объяснит бесплатная юридическая помощь."
        quotes:
          - page: https://api.sejm.gov.pl/eli/acts/DU/2026/1293/text.pdf
            text: "W okresie do dnia 4 marca 2027 r. bieg terminów na załatwienie spraw dotyczących:"
          - page: https://api.sejm.gov.pl/eli/acts/DU/2026/1293/text.pdf
            text: "1) udzielenia cudzoziemcowi: a) zezwolenia na pobyt czasowy, b) zezwolenia na pobyt stały, c) zezwolenia na pobyt rezydenta długoterminowego Unii Europejskiej, 2) zmiany: a) zezwolenia na pobyt czasowy i pracę, b) zezwolenia na pobyt czasowy w celu wykonywania pracy w zawodzie wymagającym wysokich kwalifikacji, 3) cofnięcia cudzoziemcowi: a) zezwolenia na pobyt czasowy, b) zezwolenia na pobyt stały, c) zezwolenia na pobyt rezydenta długoterminowego Unii Europejskiej – w postępowaniach prowadzonych przez wojewodę nie rozpoczyna się, a rozpoczęty ulega zawieszeniu na ten okres."
    # Was an applicability "condition"; it is how the application is filed, not who may apply, and it
    # doesn't hold for a family member still abroad (paper, art. 106j and 106l): UX audit F3.
    - id: online-only
      important: true
      condition: { not: { fact: pobyt_czasowy.purpose, eq: family_abroad } }
      statement:
        value:
          pl: "Od 27 kwietnia 2026 r. wniosek o udzielenie zezwolenia na pobyt w Polsce (pobyt czasowy, stały i rezydenta długoterminowego UE) możesz złożyć wyłącznie w formie elektronicznej, za pomocą dedykowanego portalu MOS, dostępnego poprzez przeglądarkę internetową."
          en: "Since 27 April 2026 you can file an application for a residence permit in Poland (temporary, permanent or EU long-term resident) only electronically, through the dedicated MOS portal, which you open in a web browser."
          uk: "З 27 квітня 2026 р. заяву на дозвіл на перебування в Польщі (тимчасове, постійне або довгострокового резидента ЄС) можна подати лише в електронній формі, через спеціальний портал MOS, який відкривається у веббраузері."
          ru: "С 27 апреля 2026 г. заявление на разрешение на пребывание в Польше (временное, постоянное или долгосрочного резидента ЕС) можно подать только в электронной форме, через специальный портал MOS, который открывается в веб-браузере."
        quotes:
          - page: *info
            text: "Od 27 kwietnia 2026 r. wniosek o udzielenie zezwolenia na pobyt w Polsce (pobyt czasowy, stały i rezydenta długoterminowego UE) możesz złożyć wyłącznie w formie elektronicznej, za pomocą dedykowanego portalu MOS, dostępnego poprzez przeglądarkę internetową."
    - id: file-in-legal-stay
      condition: { not: { fact: pobyt_czasowy.purpose, eq: family_abroad } }
      important: true
      statement:
        value:
          pl: "Cudzoziemiec składa wniosek o udzielenie mu zezwolenia na pobyt czasowy nie później niż w ostatnim dniu jego legalnego pobytu na terytorium Rzeczypospolitej Polskiej."
          en: "You must file the application for a temporary residence permit no later than the last day of your legal stay in Poland."
          uk: "Заяву на дозвіл на тимчасове перебування потрібно подати не пізніше останнього дня вашого легального перебування в Польщі."
          ru: "Заявление на разрешение на временное пребывание нужно подать не позднее последнего дня вашего легального пребывания в Польше."
        quotes:
          - page: *mos-act
            text: "Cudzoziemiec składa wniosek o udzielenie mu zezwolenia na pobyt czasowy nie później niż w ostatnim dniu jego legalnego pobytu na terytorium Rzeczypospolitej Polskiej."
    - id: legal-stay-while-pending
      condition: { not: { fact: pobyt_czasowy.purpose, eq: family_abroad } }
      important: true
      statement:
        value:
          pl: "pobyt cudzoziemca na terytorium Rzeczypospolitej Polskiej uważa się za legalny od dnia złożenia wniosku do dnia, w którym decyzja w sprawie udzielenia zezwolenia na pobyt czasowy stanie się ostateczna."
          en: "If you file on time and your application has no formal gaps (or you fill them in time), your stay in Poland counts as legal from the day you file until the decision becomes final. This doesn't apply if the case is suspended at your own request."
          uk: "Якщо ви подали заяву вчасно і вона не має формальних недоліків (або ви усунули їх у строк), ваше перебування в Польщі вважається легальним від дня подання заяви до дня, коли рішення стане остаточним. Це не діє, якщо провадження зупинено на ваше прохання."
          ru: "Если вы подали заявление вовремя и в нем нет формальных недостатков (или вы устранили их в срок), ваше пребывание в Польше считается легальным со дня подачи заявления до дня, когда решение станет окончательным. Это не действует, если производство приостановлено по вашей просьбе."
        quotes:
          - page: *foreigners
            text: "Jeżeli termin na złożenie wniosku o udzielenie cudzoziemcowi zezwolenia na pobyt czasowy został zachowany i wniosek nie zawiera braków formalnych lub braki formalne zostały uzupełnione w terminie:"
          - page: *foreigners
            text: "pobyt cudzoziemca na terytorium Rzeczypospolitej Polskiej uważa się za legalny od dnia złożenia wniosku do dnia, w którym decyzja w sprawie udzielenia zezwolenia na pobyt czasowy stanie się ostateczna."
          - page: *foreigners
            text: "Przepisu ust. 1 pkt 2 nie stosuje się w razie zawieszenia postępowania w sprawie udzielenia cudzoziemcowi zezwolenia na pobyt czasowy na wniosek strony."
    - id: no-show-ends-case
      condition: { not: { fact: pobyt_czasowy.purpose, eq: family_abroad } }
      important: true
      statement:
        value:
          pl: "O ile nie zachodzą podstawy do pozostawienia bez rozpoznania wniosku cudzoziemca o udzielenie mu zezwolenia na pobyt czasowy, do jego zwrotu lub odmowy wszczęcia postępowania w sprawie udzielenia cudzoziemcowi zezwolenia na pobyt czasowy, wojewoda umarza postępowanie w sprawie udzielenia cudzoziemcowi zezwolenia na pobyt czasowy, w przypadku gdy cudzoziemiec:\n1) nie stawił się mimo prawidłowego wezwania, o którym mowa w art. 106e ust. 1 lub art. 106g;"
          en: "If you don't come when properly summoned, or you come but don't give your fingerprints, a specimen signature or your passport, the voivode discontinues the case. (If there are grounds to return the application, leave it unexamined or refuse to open the case, the voivode does that instead.) If the office can't take your fingerprints on the day for reasons on its side, the case goes on: the voivode sets a new date, at least 7 days after you receive the summons. If you don't come then, the case is discontinued. Each exception covers only its own requirement. Not coming doesn't end the case for a child under 6, or for someone who can't come because of an illness or disability confirmed by a specialist's certificate. Missing fingerprints don't end it for a child under 6, for someone from whom taking them is physically impossible, or for someone who can't come because of an illness or disability. A missing signature doesn't end it for a child under 13, or for someone who can't sign because of an illness or disability. The passport rule has no exception: if you are excused from coming because of an illness or disability, you must send a certified copy of your passport when asked, unless you attached one when you filed."
          uk: "Якщо ви не з'явитеся на належний виклик або з'явитеся, але не здасте відбитки пальців, зразок підпису чи паспорт, воєвода припиняє провадження. (Якщо є підстави повернути заяву, залишити її без розгляду чи відмовити в порушенні провадження, воєвода робить це замість припинення.) Якщо установа не може зняти відбитки пальців того дня з причин на її боці, провадження триває: воєвода призначає нову дату, не раніше ніж через 7 днів після того, як ви отримаєте виклик. Якщо ви тоді не з'явитеся, провадження припиняють. Кожен виняток стосується лише своєї вимоги. Неявка не припиняє провадження для дитини до 6 років або для того, хто не може з'явитися через хворобу чи інвалідність, підтверджені довідкою лікаря-спеціаліста. Відсутність відбитків пальців не припиняє його для дитини до 6 років, для того, у кого зняти їх фізично неможливо, або для того, хто не може з'явитися через хворобу чи інвалідність. Відсутність зразка підпису не припиняє його для дитини до 13 років або для того, хто не може підписатися через хворобу чи інвалідність. Для паспорта винятку немає: якщо вас звільнено від явки через хворобу чи інвалідність, ви маєте надіслати засвідчену копію паспорта на вимогу, хіба що ви додали її під час подання заяви."
          ru: "Если вы не явитесь по надлежащему вызову или явитесь, но не сдадите отпечатки пальцев, образец подписи или паспорт, воевода прекращает производство. (Если есть основания вернуть заявление, оставить его без рассмотрения или отказать в возбуждении производства, воевода делает это вместо прекращения.) Если учреждение не может снять отпечатки пальцев в тот день по причинам на его стороне, производство продолжается: воевода назначает новую дату, не ранее чем через 7 дней после того, как вы получите вызов. Если вы тогда не явитесь, производство прекращают. Каждое исключение касается только своего требования. Неявка не прекращает производство для ребенка до 6 лет или для того, кто не может явиться из-за болезни или инвалидности, подтвержденных справкой врача-специалиста. Отсутствие отпечатков пальцев не прекращает его для ребенка до 6 лет, для того, у кого снять их физически невозможно, или для того, кто не может явиться из-за болезни или инвалидности. Отсутствие образца подписи не прекращает его для ребенка до 13 лет или для того, кто не может расписаться из-за болезни или инвалидности. Для паспорта исключения нет: если вас освободили от явки из-за болезни или инвалидности, вы должны прислать заверенную копию паспорта по требованию, разве что вы приложили ее при подаче заявления."
        quotes:
          - page: *mos-act
            text: "O ile nie zachodzą podstawy do pozostawienia bez rozpoznania wniosku cudzoziemca o udzielenie mu zezwolenia na pobyt czasowy, do jego zwrotu lub odmowy wszczęcia postępowania w sprawie udzielenia cudzoziemcowi zezwolenia na pobyt czasowy, wojewoda umarza postępowanie w sprawie udzielenia cudzoziemcowi zezwolenia na pobyt czasowy, w przypadku gdy cudzoziemiec:\n1) nie stawił się mimo prawidłowego wezwania, o którym mowa w art. 106e ust. 1 lub art. 106g;"
          - page: *mos-act
            text: "2) nie złożył odcisków linii papilarnych pomimo osobistego stawiennictwa, chyba że zachodzi przypadek, o którym mowa w art. 106g;"
          - page: *mos-act
            text: "3) nie złożył wzoru podpisu pomimo osobistego stawiennictwa;"
          - page: *mos-act
            text: "4) nie przedstawił ważnego dokumentu podróży lub innego dokumentu potwierdzającego tożsamość w przypadku, o którym mowa w art. 106a ust. 2, pomimo osobistego stawiennictwa lub odpisu jednego z takich dokumentów w przypadku, o którym mowa w art. 106h ust. 3 pkt 1."
          - page: *mos-act
            text: "W przypadku gdy z przyczyn zależnych od wojewody nie jest możliwe pobranie odcisków linii papilarnych od cudzoziemca ubiegającego się o zezwolenie na pobyt czasowy w dniu, w którym nastąpiło jego osobiste stawiennictwo, wojewoda wyznacza termin na ich złożenie nie krótszy niż 7 dni od dnia doręczenia wezwania."
          - page: *mos-act
            text: "1) pkt 1 nie stosuje się w przypadku, o którym mowa w art. 106h ust. 1;"
          - page: *mos-act
            text: "2) pkt 2 nie stosuje się w przypadku, o którym mowa w art. 106b ust. 2;"
          - page: *mos-act
            text: "3) pkt 3 nie stosuje się w przypadku, o którym mowa w art. 106b ust. 3."
          - page: *mos-act
            text: "1) który do dnia złożenia wniosku o udzielenie zezwolenia na pobyt czasowy nie ukończył 6. roku życia;"
          - page: *mos-act
            text: "1) będącego osobą małoletnią, która do dnia złożenia wniosku o udzielenie zezwolenia na pobyt czasowy nie ukończyła 6. roku życia;"
          - page: *mos-act
            text: "2) który z powodu choroby lub niepełnosprawności, potwierdzonych zaświadczeniem lekarskim wystawionym nie wcześniej niż na 3 miesiące przed złożeniem wniosku przez właściwego lekarza specjalistę mającego prawo wykonywania zawodu lekarza w rozumieniu ustawy z dnia 5 grudnia 1996 r. o zawodach lekarza i lekarza dentysty, nie może stawić się osobiście w urzędzie wojewódzkim."
          - page: *mos-act
            text: "2) od którego pobranie odcisków linii papilarnych jest fizycznie niemożliwe;"
          - page: *mos-act
            text: "3) który z powodu choroby lub niepełnosprawności, potwierdzonych zaświadczeniem lekarskim wystawionym nie wcześniej niż na 3 miesiące przed złożeniem wniosku przez właściwego lekarza specjalistę mającego prawo wykonywania zawodu lekarza w rozumieniu ustawy z dnia 5 grudnia 1996 r. o zawodach lekarza i lekarza dentysty (Dz. U. z 2024 r. poz. 1287 i 1897 oraz z 2025 r. poz. 619, 769 i 1301), nie może stawić się osobiście na wezwanie wojewody."
          - page: *mos-act
            text: "1) do dnia złożenia wniosku o udzielenie zezwolenia na pobyt czasowy nie ukończył 13. roku życia;"
          - page: *mos-act
            text: "2) z powodu choroby lub niepełnosprawności, potwierdzonych zaświadczeniem lekarskim wystawionym nie wcześniej niż na 3 miesiące przed złożeniem wniosku przez właściwego lekarza specjalistę mającego prawo wykonywania zawodu lekarza w rozumieniu ustawy z dnia 5 grudnia 1996 r. o zawodach lekarza i lekarza dentysty, nie może złożyć podpisu samodzielnie."
          - page: *mos-act
            text: "W przypadku, o którym mowa w ust. 1 pkt 2, wojewoda wzywa cudzoziemca w terminie nie krótszym niż 7 dni od dnia doręczenia wezwania do przedstawienia:"
          - page: *mos-act
            text: "1) odpisu ważnego dokumentu podróży lub innego dokumentu potwierdzającego tożsamość w przypadku, o którym mowa w art. 106a ust. 2, poświadczonego za zgodność z oryginałem zgodnie z art. 76a § 2 Kodeksu postępowania administracyjnego, chyba że taki odpis został dołączony do wniosku cudzoziemca o udzielenie mu zezwolenia na pobyt czasowy;"
    - id: no-refund
      statement:
        value:
          pl: "W przypadku wydania przez wojewodę decyzji o odmowie udzielenia zezwolenia na pobyt czasowy lub decyzji o umorzeniu postępowania w sprawie udzielenia zezwolenia na pobyt czasowy, uiszczona należna opłata skarbowa za udzielenie zezwolenia na pobyt czasowy nie podlega zwrotowi."
          en: "If the voivode refuses the permit or discontinues the case, the stamp duty you paid is not refunded."
          uk: "Якщо воєвода відмовить у дозволі або припинить провадження, сплачений гербовий збір не повертається."
          ru: "Если воевода откажет в разрешении или прекратит производство, уплаченный гербовый сбор не возвращается."
        quotes:
          - page: &phaseout https://api.sejm.gov.pl/eli/acts/DU/2026/203/text.pdf
            text: "W przypadku wydania przez wojewodę decyzji o odmowie udzielenia zezwolenia na pobyt czasowy lub decyzji o umorzeniu postępowania w sprawie udzielenia zezwolenia na pobyt czasowy, uiszczona należna opłata skarbowa za udzielenie zezwolenia na pobyt czasowy nie podlega zwrotowi."
    - id: card-fee-relief
      statement:
        value:
          pl: "Ulga w opłacie, o której mowa w ust. 1, wynosi 50 % kwoty określonej w przepisach wydanych na podstawie art. 239 ust. 1."
          en: "The card fee is halved (a 50% relief) for foreigners in a difficult financial situation, for those staying to study at a secondary school or university in Poland, and for children under 16. Ask the office what proves it."
          uk: "Плату за карту зменшують наполовину (пільга 50 %) для іноземців у скрутному матеріальному становищі, для тих, хто перебуває для навчання в середній школі чи університеті в Польщі, і для дітей до 16 років. Запитайте в установі, чим це підтвердити."
          ru: "Плату за карту уменьшают вдвое (льгота 50 %) для иностранцев в трудном материальном положении, для тех, кто находится в Польше для учебы в средней школе или университете, и для детей до 16 лет. Спросите в учреждении, чем это подтвердить."
        quotes:
          - page: *foreigners
            text: "Ulga w opłacie, o której mowa w ust. 1, wynosi 50 % kwoty określonej w przepisach wydanych na podstawie art. 239 ust. 1."
          - page: *foreigners
            text: "1) którzy znajdują się w trudnej sytuacji materialnej;"
          - page: *foreigners
            text: "2) których celem pobytu jest pobieranie nauki w szkole ponadpodstawowej i szkole wyższej na terytorium Rzeczypospolitej Polskiej;"
          - page: *foreigners
            text: "małoletnim, którzy w dniu złożenia wniosku o wydanie lub wymianę dokumentu, o którym mowa w art. 226, lub – w przypadku wydawania pierwszej karty pobytu – do dnia złożenia wniosku o udzielenie zezwolenia na pobyt czasowy, zezwolenia na pobyt stały lub zezwolenia na pobyt rezydenta długoterminowego UE, nie ukończyli 16. roku życia."
    - id: dont-wait
      condition: { not: { fact: pobyt_czasowy.purpose, eq: family_abroad } }
      important: true
      statement:
        value:
          pl: "Zwracamy uwagę, aby nie czekać ze złożeniem wniosku do ostatniego dnia legalnego pobytu. Może się okazać, że w jeden dzień nie będziesz w stanie dołączyć do wniosku wszystkich niezbędnych dokumentów."
          en: "Don't wait until the last day of your legal stay to file. You may not manage to attach every document you need in one day."
          uk: "Не чекайте з поданням заяви до останнього дня легального перебування. Може виявитися, що за один день ви не встигнете додати всі потрібні документи."
          ru: "Не ждите с подачей заявления до последнего дня легального пребывания. Может оказаться, что за один день вы не успеете приложить все нужные документы."
        quotes:
          - page: *info
            text: "Zwracamy uwagę, aby nie czekać ze złożeniem wniosku do ostatniego dnia legalnego pobytu. Może się okazać, że w jeden dzień nie będziesz w stanie dołączyć do wniosku wszystkich niezbędnych dokumentów."
    - id: fee-in-advance
      important: true
      statement:
        value:
          pl: "Oznacza to, że jeśli nie opłacisz opłaty skarbowej przed złożeniem wniosku, zostaniesz wezwany przez wojewodę do jej uiszczenia w terminie mogącym wynosić od 7 do 14 dni, co znacznie wydłuży proces postępowania. Jeśli zaś nie zastosujesz się do wezwania, musisz się liczyć z tym, że wojewoda zwróci Twój wniosek w drodze postanowienia. Na postanowienie to przysługuje zażalenie."
          en: "According to the voivodeship office in Olsztyn: if you don't pay the stamp duty before filing, the voivode will ask you to pay it within a period of 7 to 14 days, which makes the case much longer. If you don't, expect the voivode to return your application by a ruling (postanowienie). You can appeal that ruling (zażalenie)."
          uk: "За даними Вармінсько-Мазурського воєводського управління: якщо ви не сплатите гербовий збір до подання заяви, воєвода викличе вас сплатити його в строк від 7 до 14 днів, що значно подовжить розгляд. Якщо ви цього не зробите, будьте готові до того, що воєвода поверне вашу заяву постановою (postanowienie). Цю постанову можна оскаржити (zażalenie)."
          ru: "По данным Варминьско-Мазурского воеводского управления: если вы не оплатите гербовый сбор до подачи заявления, воевода вызовет вас оплатить его в срок от 7 до 14 дней, что значительно удлинит рассмотрение. Если вы этого не сделаете, будьте готовы к тому, что воевода вернет ваше заявление постановлением (postanowienie). Это постановление можно обжаловать (zażalenie)."
        quotes:
          - page: *wm
            text: "Oznacza to, że jeśli nie opłacisz opłaty skarbowej przed złożeniem wniosku, zostaniesz wezwany przez wojewodę do jej uiszczenia w terminie mogącym wynosić od 7 do 14 dni, co znacznie wydłuży proces postępowania. Jeśli zaś nie zastosujesz się do wezwania, musisz się liczyć z tym, że wojewoda zwróci Twój wniosek w drodze postanowienia. Na postanowienie to przysługuje zażalenie."
    - id: paper-exceptions
      important: true
      # Shown for work (intra-company transfers), a family abroad, other purposes and "I don't know".
      condition: { not: { fact: pobyt_czasowy.purpose, in: [seasonal, study, internship, family, business, short] } }
      statement:
        value:
          pl: "Wnioski o udzielenie zezwolenia na pobyt czasowy:\n- w celu wykonywania pracy w ramach przeniesienia wewnątrz przedsiębiorstwa;\n- w celu mobilności długoterminowej pracownika kadry kierowniczej, specjalisty lub pracownika odbywającego staż, w ramach przeniesienia wewnątrz przedsiębiorstwa;\n- w celu połączenia się z rodziną – w sytuacji, gdy cudzoziemiec, którego wniosek dotyczy, przebywa poza granicami Polski;\n- dla członka rodziny obywatela RP, obywatela państwa członkowskiego UE lub obywatela Zjednoczonego Królestwa Wielkiej Brytanii i Irlandii Północnej, o którym mowa w art. 10 ust. 1 lit. b i d Umowy Wystąpienia – w sytuacji, gdy cudzoziemiec, którego wniosek dotyczy, przebywa poza granicami Polski;\n- cudzoziemcowi prowadzącemu życie rodzinne w rozumieniu Konwencji o ochronie praw człowieka i podstawowych wolności z obywatelem RP, obywatelem państwa członkowskiego UE lub obywatelem Zjednoczonego Królestwa Wielkiej Brytanii i Irlandii Północnej, o którym mowa w art. 10 ust. 1 lit. b i d Umowy Wystąpienia – w sytuacji, gdy cudzoziemiec którego wniosek dotyczy przebywa poza terytorium RP,\nnadal należy składać w wersji papierowej, na dotychczasowych zasadach."
          en: "These temporary residence applications still go on paper, not through MOS: work as an intra-company transfer; long-term mobility of a manager, specialist or trainee within an intra-company transfer; joining family when the person concerned is outside Poland; and, when they are outside Poland, certain family members of Polish or EU citizens or of UK citizens covered by the Withdrawal Agreement, or people living a family life with them (as the notice lists them)."
          uk: "Ці заяви на тимчасове перебування й далі подають на папері, а не через MOS: робота в рамках внутрішньокорпоративного переведення; довгострокова мобільність керівника, спеціаліста або стажера в рамках такого переведення; возз'єднання з сім'єю, коли особа, якої стосується заява, перебуває за межами Польщі; а також, коли вони перебувають за межами Польщі, окремі члени сімей громадян Польщі, ЄС або громадян Великої Британії, на яких поширюється Угода про вихід, чи особи, які ведуть із ними сімейне життя."
          ru: "Эти заявления на временное пребывание по-прежнему подают на бумаге, а не через MOS: работа в рамках внутрикорпоративного перевода; долгосрочная мобильность руководителя, специалиста или стажера в рамках такого перевода; воссоединение с семьей, когда лицо, которого касается заявление, находится за пределами Польши; а также, когда они находятся за пределами Польши, отдельные члены семей граждан Польши, ЕС или граждан Великобритании, на которых распространяется Соглашение о выходе, или лица, которые ведут с ними семейную жизнь."
        quotes:
          - page: &start https://www.gov.pl/web/udsc/informacja-o-uruchomieniu-systemu-teleinformatycznego-mos--portalu-do-skladania-wnioskow-o-udzielenie-zezwolenia-na-pobyt-w-polsce-w-formie-elektronicznej
            text: "Wnioski o udzielenie zezwolenia na pobyt czasowy:\n- w celu wykonywania pracy w ramach przeniesienia wewnątrz przedsiębiorstwa;\n- w celu mobilności długoterminowej pracownika kadry kierowniczej, specjalisty lub pracownika odbywającego staż, w ramach przeniesienia wewnątrz przedsiębiorstwa;\n- w celu połączenia się z rodziną – w sytuacji, gdy cudzoziemiec, którego wniosek dotyczy, przebywa poza granicami Polski;\n- dla członka rodziny obywatela RP, obywatela państwa członkowskiego UE lub obywatela Zjednoczonego Królestwa Wielkiej Brytanii i Irlandii Północnej, o którym mowa w art. 10 ust. 1 lit. b i d Umowy Wystąpienia – w sytuacji, gdy cudzoziemiec, którego wniosek dotyczy, przebywa poza granicami Polski;\n- cudzoziemcowi prowadzącemu życie rodzinne w rozumieniu Konwencji o ochronie praw człowieka i podstawowych wolności z obywatelem RP, obywatelem państwa członkowskiego UE lub obywatelem Zjednoczonego Królestwa Wielkiej Brytanii i Irlandii Północnej, o którym mowa w art. 10 ust. 1 lit. b i d Umowy Wystąpienia – w sytuacji, gdy cudzoziemiec którego wniosek dotyczy przebywa poza terytorium RP,\nnadal należy składać w wersji papierowej, na dotychczasowych zasadach."
    # Content re-check of F3 (2026-10-04): UDSC's notice above is broader in wording than the act.
    # The act's paper list (art. 106j) names art. 159 ust. 1 and art. 160 pkt 1, 3, 4, 6, not
    # art. 158 (a Polish citizen's spouse), whose paper application is left unexamined (art. 106c
    # ust. 5). Official wording only; which permit applies is for the office or free legal aid.
    - id: paper-scope
      important: true
      condition: { not: { fact: pobyt_czasowy.purpose, in: [seasonal, study, internship, family, business, short] } }
      statement:
        value:
          pl: "Przepisów art. 105 ust. 1 i art. 106–106i nie stosuje się do wniosku o udzielenie zezwolenia, o którym mowa w art. 139a ust. 1 i art. 139o ust. 1, oraz zezwolenia, o którym mowa w art. 159 ust. 1 lub art. 160 pkt 1, 3, 4 lub 6, cudzoziemcowi przebywającemu poza granicami Rzeczypospolitej Polskiej."
          en: "The act lists which applications aren't covered by art. 105 ust. 1 and art. 106–106i (the rule to file by the last day of legal stay, and the rules for filing through MOS): the intra-company transfer permit and the long-term mobility permit within an intra-company transfer (art. 139a, 139o), and, for a person outside Poland, temporary residence under art. 159 ust. 1 (family of a foreigner who lives in Poland) or art. 160 pkt 1, 3, 4 or 6 (certain other family members of a Polish, EU, EFTA or UK citizen who lives in Poland, for example a dependant or someone living a family life with them). The permit for a family member of a Polish citizen under art. 158, such as a spouse, isn't on this list. If you aren't sure which permit applies, ask the voivodeship office or free legal aid before you file."
          uk: "Закон перелічує, на які заяви не поширюються ст. 105 ч. 1 і ст. 106–106i (правило подати заяву до останнього дня легального перебування і правила подання через MOS): дозвіл для внутрішньокорпоративного переведення і дозвіл на довгострокову мобільність у межах такого переведення (ст. 139a, 139o), а також, щодо особи за межами Польщі, тимчасове перебування за ст. 159 ч. 1 (сім'я іноземця, який живе в Польщі) або ст. 160 п. 1, 3, 4 чи 6 (окремі інші члени сім'ї громадянина Польщі, ЄС, ЄАВТ або Великої Британії, який живе в Польщі, наприклад утриманець або особа, яка веде з ним сімейне життя). Дозволу для члена сім'ї громадянина Польщі за ст. 158, наприклад подружжя, у цьому переліку немає. Якщо не впевнені, який дозвіл вам підходить, запитайте у воєводському управлінні або скористайтеся безоплатною правовою допомогою, перш ніж подавати заяву."
          ru: "Закон перечисляет, на какие заявления не распространяются ст. 105 ч. 1 и ст. 106–106i (правило подать заявление до последнего дня легального пребывания и правила подачи через MOS): разрешение для внутрикорпоративного перевода и разрешение на долгосрочную мобильность в рамках такого перевода (ст. 139a, 139o), а также, в отношении человека за пределами Польши, временное пребывание по ст. 159 ч. 1 (семья иностранца, который живет в Польше) или ст. 160 п. 1, 3, 4 или 6 (отдельные другие члены семьи гражданина Польши, ЕС, ЕАСТ или Великобритании, который живет в Польше, например иждивенец или человек, который ведет с ним семейную жизнь). Разрешения для члена семьи гражданина Польши по ст. 158, например супруга, в этом перечне нет. Если не уверены, какое разрешение вам подходит, спросите в воеводском управлении или обратитесь за бесплатной юридической помощью, прежде чем подавать заявление."
        quotes:
          - page: https://api.sejm.gov.pl/eli/acts/DU/2025/1794/text.pdf
            text: "Przepisów art. 105 ust. 1 i art. 106–106i nie stosuje się do wniosku o udzielenie zezwolenia, o którym mowa w art. 139a ust. 1 i art. 139o ust. 1, oraz zezwolenia, o którym mowa w art. 159 ust. 1 lub art. 160 pkt 1, 3, 4 lub 6, cudzoziemcowi przebywającemu poza granicami Rzeczypospolitej Polskiej."
          - page: *foreigners
            text: "Zezwolenia na pobyt czasowy dla członka rodziny obywatela Rzeczypospolitej Polskiej udziela się cudzoziemcowi, gdy:"
    # WAIT-1a (2026-10-07): "Waiting for a decision or card", shown in its own section of the web
    # guide (apps/web/lib/waiting.ts decides which warnings go there and in what order). Evidence:
    # docs/knowledge/VERIFICATION-wait-1a-sources-2026-10-07.md and its quotes record. Conditions
    # on the three waiting questions only mark the official wording as matching the reader's stage,
    # filing route or office; nothing here says the reader's stay is legal (owner clarification 1).
    - id: wait-cukr-ends-case
      statement:
        value:
          pl: "Jeżeli obywatel Ukrainy złożył wniosek o wydanie karty pobytu w przypadku, o którym mowa w art. 42c, postępowanie w sprawie udzielenia mu zezwolenia na pobyt czasowy, wszczęte na podstawie wniosku tego obywatela Ukrainy i niezakończone przed dniem złożenia przez niego wniosku o wydanie karty pobytu, umarza się z mocy prawa."
          en: "If a citizen of Ukraine has applied for a residence card under art. 42c (the CUKR card), their temporary residence permit case, started on their own application and not ended before the day they applied for the card, is discontinued by law."
          uk: "Якщо громадянин України подав заяву про видачу карти побиту у випадку, передбаченому ст. 42c (карта CUKR), провадження щодо надання йому дозволу на тимчасове перебування, розпочате за його заявою і не завершене до дня подання заяви про карту, припиняється в силу закону."
          ru: "Если гражданин Украины подал заявление о выдаче карты побыту в случае, предусмотренном ст. 42c (карта CUKR), производство о выдаче ему разрешения на временное пребывание, начатое по его заявлению и не завершенное до дня подачи заявления о карте, прекращается в силу закона."
        quotes:
          - page: &ukr-aid https://api.sejm.gov.pl/eli/acts/DU/2026/1293/text.pdf
            text: "Jeżeli obywatel Ukrainy złożył wniosek o wydanie karty pobytu w przypadku, o którym mowa w art. 42c, postępowanie w sprawie udzielenia mu zezwolenia na pobyt czasowy, wszczęte na podstawie wniosku tego obywatela Ukrainy i niezakończone przed dniem złożenia przez niego wniosku o wydanie karty pobytu, umarza się z mocy prawa."
