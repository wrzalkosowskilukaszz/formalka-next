          - page: *wm
            text: "340 zł:\n- Zezwolenie na pobyt czasowy - inne okoliczności (pozostałe przypadki) np.:\n- prowadzenie działalności gospodarczej,\n- podjęcie nauki, podjęcie studiów\n- pobyt/ połączenie z rodziną"
