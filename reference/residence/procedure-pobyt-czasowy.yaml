              uk: "Без гербового збору для дозволу, що надається іноземцю, який користується тимчасовим захистом (і для деяких інших дозволів, перелічених у законі)."
              ru: "Без гербового сбора для разрешения, предоставляемого иностранцу, который пользуется временной защитой (и для некоторых других разрешений, перечисленных в законе)."
            quotes:
              - page: *act
                text: "340 zł 1) zezwolenie, o którym mowa w art. 160 pkt 4, 5 lub 6, art. 176 i art. 186 ust. 1 pkt 8 i 9 ustawy z dnia 12 grudnia 2013 r. o cudzoziemcach 2) zezwolenie udzielane cudzoziemcowi korzystającemu z ochrony czasowej"
    - id: stamp-duty-work
