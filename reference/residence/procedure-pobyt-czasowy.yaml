        value:
          pl: "Wniosek o udzielenie zezwolenia na pobyt czasowy uznaje się za złożony w przypadku, gdy zostaną spełnione łącznie następujące warunki:"
          en: "An application for a temporary residence permit counts as filed only when both of these are met: the application and its attachments were signed with a qualified electronic signature, a personal signature (podpis osobisty) or a trusted signature (podpis zaufany); and you receive the official confirmation of receipt (UPO), or your parent, guardian or curator does, if they filed it for you as the law allows."
          uk: "Заява на дозвіл на тимчасове перебування вважається поданою лише тоді, коли виконано обидві умови: заяву з додатками підписано кваліфікованим електронним підписом, особистим підписом (podpis osobisty) або довіреним підписом; і ви отримали офіційне підтвердження отримання (UPO) або його отримали ваші батьки, опікун або куратор, якщо вони подали заяву за вас, як дозволяє закон."
          ru: "Заявление на разрешение на временное пребывание считается поданным, только когда выполнены оба условия: заявление с приложениями подписано квалифицированной электронной подписью, личной подписью (podpis osobisty) или доверенной подписью; и вы получили официальное подтверждение получения (UPO) или его получили ваши родители, опекун или куратор, если они подали заявление за вас, как позволяет закон."
        quotes:
          - page: *mos-act
            text: "Wniosek o udzielenie zezwolenia na pobyt czasowy uznaje się za złożony w przypadku, gdy zostaną spełnione łącznie następujące warunki:"
          - page: *mos-act
            text: "1) wniosek o udzielenie zezwolenia na pobyt czasowy wraz z załącznikami do tego wniosku został opatrzony kwalifikowanym podpisem elektronicznym, podpisem osobistym lub podpisem zaufanym zgodnie z ust. 3 i 4;"
          - page: *mos-act
            text: "2) cudzoziemiec albo osoba, która w imieniu cudzoziemca złożyła wniosek w przypadku, o którym mowa w art. 105 ust. 2, otrzyma urzędowe poświadczenie odbioru wniosku o udzielenie zezwolenia na pobyt czasowy."
    - id: wait-upo-technical
      condition: { all: [{ fact: pobyt_czasowy.waiting_for, eq: decision }, { not: { fact: pobyt_czasowy.filed_via, eq: paper_before_mos } }] }
      statement:
        value:
          pl: "Otrzymane UPO jest dowodem na poprawność techniczną złożonego wniosku i odebraniu go przez system."
          en: "The UPO you receive proves that the application was technically correct and that the system received it. Whether the data and attachments in the application are correct is checked by an employee of the voivodeship office."
          uk: "Отримане UPO є доказом технічної правильності поданої заяви і того, що система її отримала. Правильність даних і додатків у заяві перевіряє працівник воєводського управління."
          ru: "Полученное UPO является доказательством технической правильности поданного заявления и того, что система его получила. Правильность данных и приложений в заявлении проверяет сотрудник воеводского управления."
        quotes:
          - page: *qa
            text: "Otrzymane UPO jest dowodem na poprawność techniczną złożonego wniosku i odebraniu go przez system."
          - page: *qa
            text: "Poprawność danych we wniosku oraz załączników będzie natomiast weryfikował pracownik urzędu wojewódzkiego."
    - id: wait-certificate
      condition: { all: [{ fact: pobyt_czasowy.waiting_for, eq: decision }, { not: { fact: pobyt_czasowy.filed_via, eq: paper_before_mos } }] }
      statement:
        value:
          pl: "Jeśli dane i załączniki będą poprawne, będziesz mógł pobrać zaświadczenie o złożeniu wniosku pobytowego, które zastępuje wcześniejszy stempel w paszporcie."
          en: "If the data and attachments are correct, you'll be able to download the certificate that your residence application was filed; it replaces the old passport stamp. Under the act, the certificate states that the application was filed and on what date, and prints the act's rule on legal stay while the case is pending, with its exception."
          uk: "Якщо дані й додатки правильні, ви зможете завантажити довідку про подання заяви на перебування; вона замінює колишній штамп у паспорті. За законом довідка зазначає, що заяву подано і коли, та містить текст правила закону про легальне перебування під час розгляду справи разом із винятком."
          ru: "Если данные и приложения правильные, вы сможете скачать справку о подаче заявления на пребывание; она заменяет прежний штамп в паспорте. По закону справка указывает, что заявление подано и когда, и содержит текст правила закона о легальном пребывании во время рассмотрения дела вместе с исключением."
        quotes:
          - page: *qa
            text: "Jeśli dane i załączniki będą poprawne, będziesz mógł pobrać zaświadczenie o złożeniu wniosku pobytowego, które zastępuje wcześniejszy stempel w paszporcie."
          - page: *mos-act
            text: "Zaświadczenie, o którym mowa w ust. 1 pkt 1, zawiera:"
          - page: *mos-act
            text: "3) informację, że wniosek o udzielenie cudzoziemcowi zezwolenia na pobyt czasowy został złożony, oraz datę złożenia wniosku;"
          - page: *mos-act
            text: "4) treść ust. 1 pkt 2 i ust. 2;"
    - id: wait-paper-stamp
      condition: { all: [{ fact: pobyt_czasowy.waiting_for, eq: decision }, { not: { fact: pobyt_czasowy.filed_via, eq: mos } }] }
      statement:
        value:
          pl: "1) wojewoda umieszcza w dokumencie podróży cudzoziemca odcisk stempla potwierdzającego złożenie wniosku o udzielenie zezwolenia na pobyt czasowy;"
          en: "Applications filed on paper, before the MOS reform, follow the earlier rules. Under them, when the application was filed on time and had no formal gaps (or they were filled in time), the voivode put a stamp in the foreigner's passport confirming that the application was filed."
          uk: "Заяви, подані на папері до реформи MOS, розглядають за попередніми правилами. За ними, якщо заяву подано вчасно і вона не мала формальних недоліків (або їх усунули в строк), воєвода ставив у паспорт іноземця штамп, що підтверджує подання заяви."
          ru: "Заявления, поданные на бумаге до реформы MOS, рассматривают по прежним правилам. По ним, если заявление подано вовремя и в нем не было формальных недостатков (или их устранили в срок), воевода ставил в паспорт иностранца штамп, подтверждающий подачу заявления."
        quotes:
          - page: *foreigners
            text: "Jeżeli termin na złożenie wniosku o udzielenie cudzoziemcowi zezwolenia na pobyt czasowy został zachowany i wniosek nie zawiera braków formalnych lub braki formalne zostały uzupełnione w terminie:"
          - page: *foreigners
            text: "1) wojewoda umieszcza w dokumencie podróży cudzoziemca odcisk stempla potwierdzającego złożenie wniosku o udzielenie zezwolenia na pobyt czasowy;"
          - page: *mos-act
            text: "Do postępowań w sprawach uregulowanych w ustawach zmienianych niniejszą ustawą wszczętych i niezakończonych przed dniem wejścia w życie art. 1 pkt 3–5, 8–41, 44 lit. b, pkt 47–49, 50 i 52, art. 2, art. 5–7, art. 8 pkt 1 lit. b oraz c, art. 10, art. 11, art. 13, art. 14 oraz art. 18 ust. 1 i 2 stosuje się przepisy dotychczasowe."
    - id: wait-paper-before-mos
      condition: { all: [{ fact: pobyt_czasowy.waiting_for, eq: decision }, { not: { fact: pobyt_czasowy.filed_via, eq: mos } }] }
      statement:
        value:
          pl: "Jeśli Twój wniosek wpłynął do urzędu wojewódzkiego przed 27 kwietnia 2026 r., czyli przed dniem uruchomienia nowego portalu MOS, Twoja sprawa będzie rozpatrywana - nie będziesz musiał umarzać postępowania i składać nowego wniosku o udzielenie zezwolenia na pobyt w Polsce poprzez portal MOS."
          en: "If your application reached the voivodeship office before 27 April 2026, the day the new MOS portal started, your case will be examined: you don't have to end the case and file a new application through MOS. Paper applications that were posted but hadn't reached the office before 27 April 2026 won't be examined (they are left unexamined): the posting date doesn't count."
          uk: "Якщо ваша заява надійшла до воєводського управління до 27 квітня 2026 р., тобто до дня запуску нового порталу MOS, вашу справу розглянуть: вам не потрібно припиняти провадження і подавати нову заяву через MOS. Паперові заяви, які надіслали, але які не надійшли до управління до 27 квітня 2026 р., не розглядатимуть (їх залишать без розгляду): дата відправлення не має значення."
          ru: "Если ваше заявление поступило в воеводское управление до 27 апреля 2026 г., то есть до дня запуска нового портала MOS, ваше дело рассмотрят: вам не нужно прекращать производство и подавать новое заявление через MOS. Бумажные заявления, которые отправили, но которые не поступили в управление до 27 апреля 2026 г., рассматривать не будут (их оставят без рассмотрения): дата отправки не учитывается."
        quotes:
          - page: *qa
            text: "Jeśli Twój wniosek wpłynął do urzędu wojewódzkiego przed 27 kwietnia 2026 r., czyli przed dniem uruchomienia nowego portalu MOS, Twoja sprawa będzie rozpatrywana - nie będziesz musiał umarzać postępowania i składać nowego wniosku o udzielenie zezwolenia na pobyt w Polsce poprzez portal MOS."
          - page: *info
            text: "Wnioski o udzielenie zezwolenia na pobyt czasowy, pobyt stały i pobyt rezydenta długoterminowego UE w wersji papierowej, które zostały wysłane i nie wpłynęły do urzędów wojewódzkich przed 27 kwietnia 2026 r., nie będą rozpatrywane (wnioski będą pozostawione bez rozpoznania) – nie będzie liczyła się data nadania przesyłki pocztowej."
    # Time limits and remedies (owner clarification 6): the statute, the ministry's practice and
    # the courts' reading as the RPO relays it, each attributed and dated in apps/web/lib/waiting.ts.
    # No conclusion of our own, no docket numbers, no ponaglenie draft.
    - id: wait-remedies-statute
      condition: { fact: pobyt_czasowy.waiting_for, eq: decision }
      statement:
        value:
          pl: "Zaprzestanie czynności przez organ prowadzący postępowanie w sprawach, o których mowa w ust. 1, lub ich dokonywanie z opóźnieniem, w okresie, o którym mowa w ust. 1, nie może być podstawą wywodzenia środków prawnych dotyczących bezczynności, przewlekłości lub naruszenia prawa strony do rozpoznania sprawy bez zbędnej zwłoki."
          en: "If, during the suspension period, the authority stops working on these cases or acts late, that cannot be the basis for legal remedies about inaction, overlong proceedings or a breach of the party's right to have the case dealt with without undue delay."
          uk: "Якщо протягом періоду зупинення строків орган припиняє дії в цих справах або вчиняє їх із запізненням, це не може бути підставою для правових засобів щодо бездіяльності, затягування провадження чи порушення права сторони на розгляд справи без зайвої затримки."
          ru: "Если в период приостановления сроков орган прекращает действия по этим делам или совершает их с опозданием, это не может быть основанием для правовых средств в связи с бездействием, затягиванием производства или нарушением права стороны на рассмотрение дела без излишней задержки."
        quotes:
          - page: *ukr-aid
            text: "Zaprzestanie czynności przez organ prowadzący postępowanie w sprawach, o których mowa w ust. 1, lub ich dokonywanie z opóźnieniem, w okresie, o którym mowa w ust. 1, nie może być podstawą wywodzenia środków prawnych dotyczących bezczynności, przewlekłości lub naruszenia prawa strony do rozpoznania sprawy bez zbędnej zwłoki."
    - id: wait-remedies-mswia-udsc
      condition: { fact: pobyt_czasowy.waiting_for, eq: decision }
      statement:
        value:
          pl: "Natomiast Szef Urzędu do Spraw Cudzoziemców, który jako organ administracji publicznej wyższego stopnia w stosunku do wojewodów w sprawach objętych zakresem przedmiotowym art. 100d ustawy specjalnej, nie posiadając kompetencji do dokonywania kontroli konstytucyjności przepisów ustawowych w taki sposób jak sądy administracyjne w związku z byciem organem właściwym w sprawach rozpatrywania ponagleń na bezczynność lub przewlekłe prowadzenie postępowania przez wojewodów (art. 37 § 1 K.p.a.), jest w dalszym ciągu obowiązany do stosowania przepisu art. 100d ustawy specjalnej."
          en: "The Head of the Office for Foreigners is the voivodes' higher authority in the cases art. 100d covers and rules on ponaglenia about their inaction or overlong proceedings. Unlike the administrative courts, the Head can't review whether a statute is constitutional, and so is still obliged to apply art. 100d. The ministry also writes that art. 100c and 100d apply only to the cases they list that voivodes handle."
          uk: "Голова Управління у справах іноземців є органом вищого рівня щодо воєвод у справах, які охоплює ст. 100d, і розглядає ponaglenia (формальні нагадування про бездіяльність або затягування провадження воєводами). На відміну від адміністративних судів, він не може перевіряти конституційність законів, тож і далі зобов'язаний застосовувати ст. 100d. Міністерство також пише, що ст. 100c і 100d стосуються лише перелічених у них справ, які ведуть воєводи."
          ru: "Глава Управления по делам иностранцев является органом высшей инстанции по отношению к воеводам в делах, которые охватывает ст. 100d, и рассматривает ponaglenia (формальные напоминания о бездействии или затягивании производства воеводами). В отличие от административных судов, он не может проверять конституционность законов, поэтому по-прежнему обязан применять ст. 100d. Министерство также пишет, что ст. 100c и 100d касаются только перечисленных в них дел, которые ведут воеводы."
        quotes:
          - page: &mswia https://bip.brpo.gov.pl/sites/default/files/2026-08/Odpowiedz_MSWiA_cudzoziemcy_legalizacja_pobytu_przewleklosc_30_06_2026.pdf
            text: "Natomiast Szef Urzędu do Spraw Cudzoziemców, który jako organ administracji publicznej wyższego stopnia w stosunku do wojewodów w sprawach objętych zakresem przedmiotowym art. 100d ustawy specjalnej, nie posiadając kompetencji do dokonywania kontroli konstytucyjności przepisów ustawowych w taki sposób jak sądy administracyjne w związku z byciem organem właściwym w sprawach rozpatrywania ponagleń na bezczynność lub przewlekłe prowadzenie postępowania przez wojewodów (art. 37 § 1 K.p.a.), jest w dalszym ciągu obowiązany do stosowania przepisu art. 100d ustawy specjalnej."
          - page: *mswia
            text: "Przepisy art. 100c i art. 100d ustawy specjalnej mają zastosowanie wyłącznie do postępowań w sprawach administracyjnych w nich określonych, prowadzonych przez wojewodów."
    - id: wait-remedies-mswia-courts
      condition: { fact: pobyt_czasowy.waiting_for, eq: decision }
      statement:
        value:
          pl: "Tym samym pomimo formalnego obowiązywania przepisu art. 100d ustawy specjalnej oraz faktu, że aktualnie wciąż trwa okres, jaki objęty jest tym terminem (do dnia 4 marca 2027 r.), istnieje wysokie prawdopodobieństwo, że wojewódzki sąd administracyjny, który będzie rozpatrywał skargę na bezczynność lub przewlekłe prowadzenie postępowania przez wojewodę w sprawie objętej zakresem przedmiotowym tego przepisu, w odniesieniu do okresu bezczynności lub przewlekłości występujących po dniu 30 czerwca 2024 r., odmówi zastosowania tego przepisu i rozpozna skargę z jego pominięciem."
          en: "Even though art. 100d is formally in force and the period it covers (until 4 March 2027) is still running, it is highly likely that a voivodeship administrative court hearing a complaint about a voivode's inaction or overlong proceedings in a case the provision covers will, for inaction or delay after 30 June 2024, refuse to apply it and decide the complaint without it."
          uk: "Хоча ст. 100d формально чинна і період, який вона охоплює (до 4 березня 2027 р.), ще триває, існує висока ймовірність, що воєводський адміністративний суд, розглядаючи скаргу на бездіяльність або затягування провадження воєводою у справі, яку охоплює це положення, щодо бездіяльності чи затягування після 30 червня 2024 р. відмовиться його застосовувати і розгляне скаргу без нього."
          ru: "Хотя ст. 100d формально действует и период, который она охватывает (до 4 марта 2027 г.), еще продолжается, высока вероятность, что воеводский административный суд, рассматривая жалобу на бездействие или затягивание производства воеводой по делу, которое охватывает это положение, в отношении бездействия или затягивания после 30 июня 2024 г. откажется его применять и рассмотрит жалобу без него."
        quotes:
          - page: *mswia
            text: "Tym samym pomimo formalnego obowiązywania przepisu art. 100d ustawy specjalnej oraz faktu, że aktualnie wciąż trwa okres, jaki objęty jest tym terminem (do dnia 4 marca 2027 r.), istnieje wysokie prawdopodobieństwo, że wojewódzki sąd administracyjny, który będzie rozpatrywał skargę na bezczynność lub przewlekłe prowadzenie postępowania przez wojewodę w sprawie objętej zakresem przedmiotowym tego przepisu, w odniesieniu do okresu bezczynności lub przewlekłości występujących po dniu 30 czerwca 2024 r., odmówi zastosowania tego przepisu i rozpozna skargę z jego pominięciem."
    - id: wait-remedies-rpo-nsa
      condition: { fact: pobyt_czasowy.waiting_for, eq: decision }
      statement:
        value:
          pl: "Ponadto, jak wskazał NSA, wspomniany przepis ustawy o pomocy obywatelom Ukrainy nie stanowi podstawy do wyłączenia kontroli przez sądy administracyjne skarg na bezczynności organu lub przewlekłe prowadzenie postępowania."
          en: "The RPO writes that, as the Supreme Administrative Court (NSA) pointed out, this provision of the Ukraine aid act is no basis for excluding administrative courts' review of complaints about an authority's inaction or overlong proceedings. It may affect how a complaint is judged, but not whether it may be filed, which the law on administrative court proceedings governs (art. 53 § 2b): a ponaglenie without formal defects, filed first, is enough."
          uk: "Уповноважений пише, що, як зазначив Вищий адміністративний суд, це положення закону про допомогу громадянам України не є підставою для виключення контролю адміністративних судів за скаргами на бездіяльність органу чи затягування провадження. Воно може впливати на оцінку скарги по суті, але не на те, чи можна її подати; це регулює закон про провадження в адміністративних судах (ст. 53 § 2b): достатньо попередньо подати ponaglenie без формальних недоліків."
          ru: "Уполномоченный пишет, что, как указал Высший административный суд, это положение закона о помощи гражданам Украины не является основанием для исключения контроля административных судов за жалобами на бездействие органа или затягивание производства. Оно может влиять на оценку жалобы по существу, но не на то, можно ли ее подать; это регулирует закон о производстве в административных судах (ст. 53 § 2b): достаточно предварительно подать ponaglenie без формальных недостатков."
        quotes:
          - page: &rpo https://bip.brpo.gov.pl/sites/default/files/2026-06/Do_MSWiA_cudzoziemcy_legalizacja_pobytu_przewleklosc_1_06_2026.pdf
            text: "Ponadto, jak wskazał NSA, wspomniany przepis ustawy o pomocy obywatelom Ukrainy nie stanowi podstawy do wyłączenia kontroli przez sądy administracyjne skarg na bezczynności organu lub przewlekłe prowadzenie postępowania."
          - page: *rpo
            text: "Regulacja ta może mieć wpływ na merytoryczną ocenę skargi, jednak nie może stanowić o dopuszczalności jej wniesienia, która uregulowana została w art. 53 § 2b ustawy z dnia 30 sierpnia 2002 r. – Prawo o postępowaniu przed sądami administracyjnymi4."
          - page: *rpo
            text: "Oznacza to, że wystarczające jest tutaj uprzednie wniesienie pozbawionego braków formalnych ponaglenia."
    - id: wait-remedies-cjeu
      condition: { fact: pobyt_czasowy.waiting_for, eq: decision }
      statement:
        value:
          pl: "Jednocześnie pragnę poinformować, że resort spraw wewnętrznych i administracji obecnie oczekuje na rozstrzygnięcie w sprawie C-254/25 prowadzonej przed Europejskim Trybunałem Sprawiedliwości Unii Europejskiej (TSUE) – przywołanej w wystąpieniu Pana Rzecznika – dotyczącej odpowiedzi na pytania prejudycjalne skierowane do TSUE przez Wojewódzki Sąd Administracyjny w Gliwicach, odnośnie do art. 100c i 100d ustawy pomocowej."
