# Temporary residence permit (zezwolenie na pobyt czasowy), GUIDES-01: the national route,
# hand-authored from UDSC's MOS pages and its launch notice. Fees come from the stamp duty act
# itself (consolidated text Dz.U. 2025 poz. 1154, annex part III), corroborated by the
# Warmińsko-Mazurski voivodeship page that lists the same amounts (source priority: the act,
# then UDSC, then an office page). UDSC's MOS page gives only "340 to 640 zł" for temporary and
# permanent permits together; the act is the specific source, so its amounts are shown.
# No place layer yet (plan-guardian): voivodeships differ, the national rule comes first.
# Legal audit 2026-10-02: the Act on Foreigners (consolidated Dz.U. 2025 poz. 1079) as amended by
# the MOS reform (Dz.U. 2025 poz. 1794, not yet consolidated) and by Dz.U. 2026 poz. 203 (art. 113c).
# Polish statements are verbatim official wording; en/uk are our translations.

- id: temporary-residence
  domain: residence
  related: [mos-filing]
  riskClass: C
  verificationLevel: auto_structured
  checkedAt: "2026-10-01"
  title:
    pl: Zezwolenie na pobyt czasowy
    en: Temporary residence permit
    uk: Дозвіл на тимчасове перебування
    ru: Разрешение на временное пребывание
  summary:
    pl: Jak złożyć wniosek o zezwolenie na pobyt czasowy, ile kosztuje i co dzieje się po złożeniu. Większość wniosków składa się tylko przez internet, w systemie MOS; kilka rodzajów nadal na papierze.
    en: How to apply for a temporary residence permit, what it costs and what happens after you file. Most applications are filed online only, in MOS; a few kinds still go on paper.
    uk: Як подати заяву на дозвіл на тимчасове перебування, скільки це коштує і що відбувається після подання. Більшість заяв подають лише онлайн, у системі MOS; кілька видів і далі подають на папері.
    ru: Как подать заявление на разрешение на временное пребывание, сколько это стоит и что происходит после подачи. Большинство заявлений подают только онлайн, в системе MOS; несколько видов по-прежнему подают на бумаге.
  applicability:
    conditions: []
  exclusions:
    - id: eu-citizens-and-families
      statement:
        value:
          pl: "obywateli państw członkowskich Unii Europejskiej, państw członkowskich Europejskiego Stowarzyszenia Wolnego Handlu (EFTA) – stron umowy o Europejskim Obszarze Gospodarczym lub Konfederacji Szwajcarskiej oraz członków ich rodzin, którzy do nich dołączają lub z nimi przebywają;"
          en: "The Act on Foreigners doesn't apply to citizens of EU countries, of EFTA countries that are party to the EEA agreement, or of Switzerland, nor to their family members who join them or live with them."
          uk: "Закон про іноземців не застосовується до громадян держав ЄС, держав ЄАВТ, що є сторонами угоди про ЄЕП, або Швейцарії, а також до членів їхніх родин, які приєднуються до них або перебувають із ними."
          ru: "Закон об иностранцах не применяется к гражданам государств ЕС, государств ЕАСТ, являющихся сторонами соглашения о ЕЭП, или Швейцарии, а также к членам их семей, которые присоединяются к ним или находятся вместе с ними."
        quotes:
          - page: &foreigners https://api.sejm.gov.pl/eli/acts/DU/2025/1079/text.pdf
            text: "Ustawy nie stosuje się do:"
          - page: *foreigners
            text: "obywateli państw członkowskich Unii Europejskiej, państw członkowskich Europejskiego Stowarzyszenia Wolnego Handlu (EFTA) – stron umowy o Europejskim Obszarze Gospodarczym lub Konfederacji Szwajcarskiej oraz członków ich rodzin, którzy do nich dołączają lub z nimi przebywają;"
  requiredFacts: [pobyt_czasowy.purpose]
  steps:
    - id: pay-fees
      condition: { not: { fact: pobyt_czasowy.purpose, eq: family_abroad } }
      title:
        pl: Zapłać opłatę skarbową i opłatę za kartę, zanim złożysz wniosek
        en: Pay the stamp duty and the card fee before you file
        uk: Сплатіть гербовий збір і плату за карту до подання заяви
        ru: Оплатите гербовый сбор и плату за карту до подачи заявления
      description:
        pl: Dwie osobne opłaty, na dwa osobne konta. Potwierdzenia dołączasz do wniosku.
        en: Two separate payments, to two separate accounts. You attach the confirmations to the application.
        uk: Два окремі платежі на два окремі рахунки. Підтвердження додаєте до заяви.
        ru: Два отдельных платежа на два отдельных счета. Подтверждения прикладываете к заявлению.
      channels: [online]
      quotes:
        - page: &wm https://www.gov.pl/web/uw-warminsko-mazurski/cudzoziemcy---zezwolenia-na-pobyt-czasowy-na-terytorium-rp
          text: "Opłata skarbowa jest należnością, którą należy uiścić z góry pod rygorem zwrotu wniosku o udzielenie zezwolenia na pobyt."
        - page: &fees https://www.gov.pl/web/udsc/informacja-o-oplatach
          text: "Do wniosku o udzielenie zezwolenia na pobyt czasowy, stały i rezydenta długoterminowego UE w systemie MOS musisz dołączyć potwierdzenia dokonania opłaty skarbowej (w wysokości zależnej od rodzaju zezwolenia – od 340 zł do 640 zł) oraz opłaty za wydanie karty pobytu (100 zł) - pamiętaj, że są to osobne opłaty i należy ich dokonać na osobne konta."
    - id: ask-for-attachment
      condition: { not: { fact: pobyt_czasowy.purpose, eq: family_abroad } }
      title:
        pl: Jeśli trzeba, poproś pracodawcę, uczelnię albo organizatora stażu o załącznik
        en: If needed, ask your employer, university or internship organiser for their attachment
        uk: Якщо потрібно, попросіть роботодавця, університет або організатора стажування про додаток
        ru: Если нужно, попросите работодателя, университет или организатора стажировки о приложении
      description:
        pl: W formularzu podajesz ich adres e-mail; dostają link do części wniosku, którą sami wypełniają i podpisują. Bez niej wniosku nie da się złożyć, a na podpis można czekać długo.
        en: In the form you give their e-mail address; they get a link to the part of the application they fill in and sign themselves. Without it the application can't be filed, and the signature can take a long time.
        uk: У формі ви вказуєте їхню електронну адресу; вони отримують посилання на частину заяви, яку самі заповнюють і підписують. Без неї заяву не можна подати, а підпису можна чекати довго.
        ru: В форме вы указываете их адрес электронной почты; они получают ссылку на часть заявления, которую сами заполняют и подписывают. Без нее заявление нельзя подать, а подписи можно ждать долго.
      channels: [online]
      quotes:
        - page: &info https://www.gov.pl/web/udsc/info-mos
          text: "Podczas wypełniania wniosku będziesz musiał podać adres e-mail pracodawcy, jednostki prowadzącej studia albo organizatora stażu lub wolontariatu. Na ten adres zostanie wysłany odnośnik z częścią z właściwym załącznikiem do wniosku przeznaczonym do wypełnienia i podpisania przez ten podmiot. Będzie to konieczne do skutecznego złożenia wniosku;"
        - page: *info
          text: "Pamiętaj, że jeśli do wniosku konieczne jest dołączenie załącznika podpisanego przez inną osobę (np. pracodawcę), możesz oczekiwać przez długi czas na uzyskanie tego podpisu."
    - id: file-in-mos
      condition: { not: { fact: pobyt_czasowy.purpose, eq: family_abroad } }
      title:
        pl: Złóż wniosek w systemie MOS
        en: File the application in MOS
        uk: Подайте заяву в системі MOS
        ru: Подайте заявление в системе MOS
      description:
        pl: Konto, formularz, załączniki i podpis krok po kroku opisuje nasz przewodnik po MOS.
        en: Our MOS guide walks through the account, the form, the attachments and the signature.
        uk: Обліковий запис, форму, вкладення й підпис крок за кроком описує наш путівник по MOS.
        ru: Учетную запись, форму, вложения и подпись шаг за шагом описывает наш путеводитель по MOS.
      dependsOn: [pay-fees]
      channels: [online]
      seeProcedures: [mos-filing]
      links:
        - url: https://www.mos.cudzoziemcy.gov.pl/
          title:
            pl: Portal MOS
            en: The MOS portal
            uk: Портал MOS
            ru: Портал MOS
      quotes:
        - page: *info
          text: "Od 27 kwietnia 2026 r. wniosek o udzielenie zezwolenia na pobyt w Polsce (pobyt czasowy, stały i rezydenta długoterminowego UE) możesz złożyć wyłącznie w formie elektronicznej, za pomocą dedykowanego portalu MOS, dostępnego poprzez przeglądarkę internetową."
    - id: print-certificate
      condition: { not: { fact: pobyt_czasowy.purpose, eq: family_abroad } }
      title:
        pl: Pobierz zaświadczenie o złożeniu wniosku
        en: Download the certificate confirming your application
        uk: Завантажте довідку про подання заяви
        ru: Скачайте справку о подаче заявления
      description:
        pl: Pobierasz je z MOS, gdy pracownik urzędu wojewódzkiego sprawdzi wniosek. Zastępuje dawny stempel w paszporcie. Ustawa wiąże je ze złożeniem wniosku w terminie i bez braków formalnych (albo z ich uzupełnieniem w terminie).
        en: You download it from MOS once a voivodeship office employee has checked the application. It replaces the old stamp in the passport. The act ties it to filing on time and without formal gaps (or filling them in time).
        uk: Ви завантажуєте її з MOS, коли працівник воєводського управління перевірить заяву. Вона замінює колишній штамп у паспорті. Закон пов'язує її з поданням заяви вчасно і без формальних недоліків (або з їх усуненням у строк).
        ru: Вы скачиваете ее из MOS, когда сотрудник воеводского управления проверит заявление. Она заменяет прежний штамп в паспорте. Закон связывает ее с подачей заявления вовремя и без формальных недостатков (или с их устранением в срок).
      dependsOn: [file-in-mos]
      channels: [online]
      quotes:
        - page: *info
          text: "Po weryfikacji i zatwierdzeniu wniosku przez pracownika urzędu wojewódzkiego będziesz mógł pobrać z systemu i wydrukować zaświadczenie o złożeniu wniosku o udzielenie zezwolenia na pobyt w Polsce, które zastąpi dotychczasowy stempel w paszporcie."
        - page: &mos-act https://api.sejm.gov.pl/eli/acts/DU/2025/1794/text.pdf
          text: "wojewoda wydaje cudzoziemcowi zaświadczenie potwierdzające złożenie wniosku o udzielenie zezwolenia na pobyt czasowy;"
    - id: fingerprints
      condition: { not: { fact: pobyt_czasowy.purpose, eq: family_abroad } }
      title:
        pl: Staw się na wezwanie wojewody (odciski palców, paszport)
        en: Go to the voivodeship office when summoned (fingerprints, passport)
        uk: З'явіться на виклик воєводи (відбитки пальців, паспорт)
        ru: Явитесь по вызову воеводы (отпечатки пальцев, паспорт)
      description:
        pl: Składasz odciski palców i wzór podpisu, pokazujesz oryginał paszportu i w razie potrzeby uzupełniasz wniosek.
        en: You give fingerprints and a specimen signature, show the original passport and, if needed, complete the application.
        uk: Ви здаєте відбитки пальців і зразок підпису, показуєте оригінал паспорта і за потреби доповнюєте заяву.
        ru: Вы сдаете отпечатки пальцев и образец подписи, показываете оригинал паспорта и при необходимости дополняете заявление.
      dependsOn: [file-in-mos]
      channels: [in_person]
      officeKind: voivodeship_office
      quotes:
        - page: *info
          text: "Wojewoda prowadzący sprawę wezwie Cię do osobistego stawiennictwa, abyś złożył odciski palców i wzór podpisu oraz okazał oryginał paszportu, a w razie konieczności – uzupełnił informacje zawarte we wniosku lub dołączył dodatkowe dokumenty."
    - id: decision
      condition: { not: { fact: pobyt_czasowy.purpose, eq: family_abroad } }
      title:
        pl: Odbierz decyzję wojewody
        en: Receive the voivode's decision
        uk: Отримайте рішення воєводи
        ru: Получите решение воеводы
      description:
        pl: "Wojewoda wysyła decyzję na wskazany przez Ciebie adres do doręczeń: Twój albo pełnomocnika, jeśli go masz. Odwołanie wysyłasz poza MOS, na papierze albo na adres e-doręczeń wojewody; termin podaje decyzja."
        en: "The voivode sends the decision to the address for official letters you gave (adres do doręczeń): yours, or your proxy's if you have one. An appeal goes outside MOS, on paper or to the voivode's e-Delivery (e‑Doręczenia) address; the decision states the deadline."
        uk: "Воєвода надсилає рішення на адресу для листування (adres do doręczeń), яку ви вказали: вашу або вашої уповноваженої особи, якщо вона у вас є. Оскарження надсилають поза MOS, на папері або на адресу воєводи для електронного вручення (e‑Doręczenia); строк зазначено в рішенні."
        ru: "Воевода отправляет решение на адрес для корреспонденции (adres do doręczeń), который вы указали: ваш или вашего уполномоченного лица, если оно у вас есть. Жалобу на решение отправляют вне MOS, на бумаге или на адрес воеводы для электронного вручения (e‑Doręczenia); срок указан в решении."
      dependsOn: [fingerprints]
      quotes:
        - page: *info
          text: "Wojewoda prowadzący sprawę wyśle decyzję na wskazany przez Ciebie adres do doręczeń (Twój lub pełnomocnika, jeśli go posiadasz)."
        - page: https://www.gov.pl/web/udsc/mos-qa
          text: "Nie, odwołanie będziesz musiał wysłać poza portalem MOS, wysyłając pismo w formie papierowej albo w formie elektronicznej na adres e-doręczeń wojewody."
    # CJ-02 (journey audit 2026-10-05): the card is collected in person (art. 248 as amended by
    # the MOS reform); the decision is delivered to the address for service, a separate event.
    - id: card
      condition: { not: { fact: pobyt_czasowy.purpose, eq: family_abroad } }
      title:
        pl: Odbierz kartę pobytu
        en: Collect the residence card
        uk: Заберіть карту побиту
        ru: Заберите карту побыту
      description:
        pl: Kartę pobytu odbierasz osobiście i pokazujesz ważny dokument podróży (na przykład paszport). Jeśli nie masz ważnego dokumentu podróży i nie możesz go uzyskać, w szczególnie uzasadnionym przypadku możesz pokazać inny dokument potwierdzający tożsamość. Kartę dziecka, które w dniu odbioru nie ma 13 lat, odbiera rodzic albo opiekun i pokazuje swój ważny dokument tożsamości. Dziecko musi przy tym być, jeśli w dniu złożenia wniosku miało już 6 lat; młodsze nie musi. Jeśli przy składaniu wniosku wojewoda zwolnił Cię z osobistego stawiennictwa z powodu choroby lub niepełnosprawności (potwierdzonych zaświadczeniem lekarskim), nie musisz odbierać karty osobiście; przepisy nie mówią, jak wtedy ją dostajesz, więc zapytaj w urzędzie wojewódzkim.
        en: You collect the residence card in person and show a valid travel document (such as a passport). If you have no valid travel document and can't get one, in a particularly justified case you may show another identity document. If the child is under 13 on the day the card is collected, a parent or guardian collects it and shows their own valid identity document. The child must come too if they were already 6 on the day the application was filed; a younger child doesn't have to. If the voivode excused you from coming in person for the application because of illness or disability (confirmed by a medical certificate), you don't have to collect the card in person; the law doesn't say how you get it then, so ask the voivodeship office.
        uk: Карту побиту забираєте особисто і показуєте чинний проїзний документ (наприклад, паспорт). Якщо у вас немає чинного проїзного документа і ви не можете його отримати, в особливо обґрунтованому випадку можна показати інший документ, що посвідчує особу. Карту дитини, якій у день отримання ще немає 13 років, забирає батько, мати або опікун і показує свій чинний документ, що посвідчує особу. Дитина має бути присутня, якщо в день подання заяви їй уже виповнилося 6 років; молодшій дитині приходити не обов'язково. Якщо під час подання заяви воєвода звільнив вас від особистої явки через хворобу чи інвалідність (підтверджені медичною довідкою), забирати карту особисто не потрібно; закон не каже, як тоді її отримати, тож запитайте у воєводському управлінні.
        ru: Карту побыту забираете лично и показываете действительный проездной документ (например, паспорт). Если у вас нет действительного проездного документа и вы не можете его получить, в особо обоснованном случае можно показать другой документ, удостоверяющий личность. Карту ребенка, которому в день получения еще нет 13 лет, забирает родитель или опекун и показывает свой действительный документ, удостоверяющий личность. Ребенок должен присутствовать, если в день подачи заявления ему уже исполнилось 6 лет; младшему ребенку приходить не обязательно. Если при подаче заявления воевода освободил вас от личной явки из-за болезни или инвалидности (подтвержденных медицинской справкой), забирать карту лично не нужно; закон не говорит, как тогда ее получить, поэтому спросите в воеводском управлении.
      dependsOn: [decision]
      channels: [in_person]
      quotes:
        - page: *mos-act
          text: "Cudzoziemiec odbiera kartę pobytu osobiście, chyba że w stosunku do tego cudzoziemca odstąpiono od wezwania do osobistego stawiennictwa na podstawie art. 106h ust. 1, art. 203h ust. 1 lub art. 219h ust. 1."
        - page: *mos-act
          text: "Cudzoziemiec, odbierając kartę pobytu, okazuje ważny dokument podróży."
        - page: *mos-act
          text: "W szczególnie uzasadnionym przypadku, gdy cudzoziemiec nie posiada ważnego dokumentu podróży ani nie ma możliwości jego uzyskania, może okazać inny dokument potwierdzający tożsamość."
        - page: *mos-act
          text: "będącego osobą małoletnią, która do dnia złożenia wniosku o udzielenie zezwolenia na pobyt czasowy nie ukończyła 6. roku życia;"
        - page: *mos-act
          text: "który z powodu choroby lub niepełnosprawności, potwierdzonych zaświadczeniem lekarskim wystawionym nie wcześniej niż na 3 miesiące przed złożeniem wniosku przez właściwego lekarza specjalistę mającego prawo wykonywania zawodu lekarza w rozumieniu ustawy z dnia 5 grudnia 1996 r. o zawodach lekarza i lekarza dentysty, nie może stawić się osobiście w urzędzie wojewódzkim."
        - page: *mos-act
          text: "W przypadku gdy karta pobytu została wydana cudzoziemcowi będącemu osobą małoletnią, która nie ukończyła 13. roku życia do dnia jej odbioru, albo osobą ubezwłasnowolnioną całkowicie, odbioru karty pobytu dokonuje odpowiednio rodzic, opiekun albo kurator, po okazaniu ważnego dokumentu potwierdzającego jego tożsamość."
        - page: *mos-act
          text: "osobą małoletnią, która ukończyła 6. rok życia do dnia złożenia wniosku o:"
        - page: *mos-act
          text: "– wymaga obecności tej osoby."
    # Family member still abroad (UX audit F3): the family member in Poland files on paper with the
    # voivode of their own place of stay (art. 106j, 106l, 104 ust. 1b of the MOS reform). Evidence:
    # docs/knowledge/VERIFICATION-family-abroad-2026-10-03.md. Forms, fees' timing and what happens
    # after the decision are not stated nationally, so the guide sends the reader to the office.
    - id: paper-pay
      condition: { fact: pobyt_czasowy.purpose, eq: family_abroad }
      title:
        pl: "Gdy wniosek dotyczy osoby za granicą: zapłać opłatę skarbową, zanim członek rodziny w Polsce złoży wniosek"
        en: "If the application is for a person abroad: pay the stamp duty before the family member in Poland files"
        uk: "Якщо заява стосується особи за кордоном: сплатіть гербовий збір, перш ніж член сім'ї в Польщі подасть заяву"
        ru: "Если заявление касается человека за границей: оплатите гербовый сбор до того, как член семьи в Польше подаст заявление"
      description:
        pl: Kwotę podaje sekcja Opłaty. Strony urzędowe, które sprawdziliśmy, nie podają, kiedy przy tym wniosku płaci się za kartę pobytu; zapytaj w urzędzie wojewódzkim.
        en: The Fees section gives the amount. The official pages we checked don't say when the residence card fee is paid for this application; ask the voivodeship office.
        uk: Суму наведено в розділі «Збори». Офіційні сторінки, які ми перевірили, не вказують, коли для цієї заяви платять за карту побиту; запитайте у воєводському управлінні.
        ru: Сумма указана в разделе «Сборы». Официальные страницы, которые мы проверили, не указывают, когда для этого заявления платят за карту побыту; спросите в воеводском управлении.
      quotes:
        - page: *wm
          text: "Opłata skarbowa jest należnością, którą należy uiścić z góry pod rygorem zwrotu wniosku o udzielenie zezwolenia na pobyt."
        - page: https://api.sejm.gov.pl/eli/acts/DU/2025/1794/text.pdf
          text: "Wezwanie, o którym mowa w ust. 5, może nastąpić jednocześnie z wezwaniem do uzupełnienia braków formalnych wniosku na podstawie art. 64 § 2 Kodeksu postępowania administracyjnego lub wezwaniem do uiszczenia opłaty skarbowej za udzielenie zezwolenia na pobyt czasowy."
    - id: paper-who-files
      condition: { fact: pobyt_czasowy.purpose, eq: family_abroad }
      title:
        pl: "Gdy wniosek dotyczy osoby za granicą: składa go na papierze członek rodziny w Polsce"
        en: "If the application is for a person abroad: the family member in Poland files it on paper"
        uk: "Якщо заява стосується особи за кордоном: її подає на папері член сім'ї в Польщі"
        ru: "Если заявление касается человека за границей: его подает на бумаге член семьи в Польше"
      description:
        pl: Nie w systemie MOS. Członek rodziny składa go u wojewody tam, gdzie sam przebywa w Polsce. Zapytaj w tym urzędzie wojewódzkim, na jakim formularzu i czy można go wysłać pocztą.
        en: Not in MOS. The family member files it with the voivode of the region where they are staying in Poland. Ask that voivodeship office which form to use and whether it can be sent by post.
        uk: Не в системі MOS. Член сім'ї подає її воєводі за місцем свого перебування в Польщі. Уточніть у цьому воєводському управлінні, який потрібен бланк і чи можна надіслати заяву поштою.
        ru: Не в системе MOS. Член семьи подает его воеводе по месту своего пребывания в Польше. Уточните в этом воеводском управлении, какой нужен бланк и можно ли отправить заявление почтой.
      officeKind: voivodeship_office
      quotes:
        - page: https://api.sejm.gov.pl/eli/acts/DU/2025/1794/text.pdf
          text: "Wniosek o udzielenie cudzoziemcowi przebywającemu poza granicami Rzeczypospolitej Polskiej zezwolenia na pobyt czasowy, o którym mowa w art. 159 ust. 1 lub art. 160 pkt 1, 3, 4 lub 6, członek rodziny rozdzielonej składa w postaci papierowej na formularzu zawierającym:"
        - page: https://api.sejm.gov.pl/eli/acts/DU/2025/1794/text.pdf
          text: "Zezwolenia na pobyt czasowy, o którym mowa w art. 159 ust. 1 lub art. 160 pkt 1, 3, 4 lub 6, cudzoziemcowi przebywającemu poza granicami Rzeczypospolitej Polskiej, udziela lub odmawia jego udzielenia wojewoda właściwy ze względu na miejsce pobytu członka rodziny rozdzielonej, w drodze decyzji."
        - page: https://api.sejm.gov.pl/eli/acts/DU/2025/1794/text.pdf
          text: "członek rodziny rozdzielonej – cudzoziemca zamieszkującego na terytorium Rzeczypospolitej Polskiej, który występuje z wnioskiem o udzielenie zezwolenia na pobyt czasowy w celu połączenia się z rodziną cudzoziemcowi przebywającemu poza granicami Rzeczypospolitej Polskiej, lub obywatela polskiego, obywatela innego państwa członkowskiego Unii Europejskiej, państwa członkowskiego Europejskiego Stowarzyszenia Wolnego Handlu (EFTA) – strony umowy o Europejskim Obszarze Gospodarczym, Konfederacji Szwajcarskiej lub obywatela Zjednoczonego Królestwa Wielkiej Brytanii i Irlandii Północnej, o którym mowa w art. 10 ust. 1 lit. b i d Umowy Wystąpienia, zamieszkującego na terytorium Rzeczypospolitej Polskiej, który występuje z wnioskiem o udzielenie zezwolenia na pobyt czasowy, o którym mowa w art. 160 pkt 1, 3, 4 lub 6, cudzoziemcowi przebywającemu poza granicami Rzeczypospolitej Polskiej;"
    - id: paper-attachments
      condition: { fact: pobyt_czasowy.purpose, eq: family_abroad }
      title:
        pl: "Gdy wniosek dotyczy osoby za granicą: dołącz kopię jej paszportu, jej zdjęcie i zgodę"
        en: "If the application is for a person abroad: attach a copy of their passport, their photo and their consent"
        uk: "Якщо заява стосується особи за кордоном: додайте копію її паспорта, її фото і згоду"
        ru: "Если заявление касается человека за границей: приложите копию его паспорта, его фото и согласие"
      description:
        pl: Osoba za granicą wyraża zgodę na urzędowym formularzu. Zgoda nie jest potrzebna, jeśli członek rodziny w Polsce jest jej przedstawicielem ustawowym. Dołącz też dokumenty, które potwierdzają dane z wniosku.
        en: The person abroad gives consent on an official form. It isn't needed if the family member in Poland is their legal representative. Also attach documents that prove what the application says.
        uk: Особа за кордоном дає згоду на офіційному бланку. Згода не потрібна, якщо член сім'ї в Польщі є її законним представником. Додайте також документи, що підтверджують дані із заяви.
        ru: Человек за границей дает согласие на официальном бланке. Согласие не нужно, если член семьи в Польше является его законным представителем. Приложите также документы, подтверждающие данные из заявления.
      dependsOn: [paper-who-files]
      quotes:
        - page: https://api.sejm.gov.pl/eli/acts/DU/2025/1794/text.pdf
          text: "Członek rodziny rozdzielonej, składając wniosek o udzielenie zezwolenia na pobyt czasowy, o którym mowa w art. 159 ust. 1 lub art. 160 pkt 1, 3, 4 lub 6, przedstawia kopię ważnego dokumentu podróży cudzoziemca oraz dołącza do wniosku aktualną fotografię cudzoziemca i zgodę na złożenie przez członka rodziny rozdzielonej wniosku o udzielenie zezwolenia na pobyt czasowy w celu połączenia się z rodziną lub zezwolenia na pobyt czasowy, o którym mowa w art. 160 pkt 1, 3, 4 lub 6, wyrażoną na formularzu określonym w przepisach wydanych na podstawie art. 107 ust. 1, chyba że członek rodziny rozdzielonej jest przedstawicielem ustawowym cudzoziemca."
        - page: https://api.sejm.gov.pl/eli/acts/DU/2025/1794/text.pdf
          text: "Do wniosku o udzielenie zezwolenia na pobyt czasowy, o którym mowa w art. 159 ust. 1 lub art. 160 pkt 1, 3, 4 lub 6, członek rodziny rozdzielonej dodatkowo dołącza dokumenty niezbędne do potwierdzenia danych zawartych we wniosku i okoliczności uzasadniających ubieganie się o udzielenie zezwolenia, o którym mowa w art. 159 ust. 1 lub art. 160 pkt 1, 3, 4 lub 6."
    - id: paper-missing
      condition: { fact: pobyt_czasowy.purpose, eq: family_abroad }
      title:
        pl: "Gdy wniosek dotyczy osoby za granicą: wojewoda wezwie do dosłania brakującej kopii paszportu, zdjęcia albo zgody"
        en: "If the application is for a person abroad: the voivode will ask for a missing passport copy, photo or consent"
        uk: "Якщо заява стосується особи за кордоном: воєвода попросить надіслати копію паспорта, фото або згоду, яких бракує"
        ru: "Если заявление касается человека за границей: воевода попросит дослать недостающую копию паспорта, фото или согласие"
      description:
        pl: Wojewoda daje co najmniej 14 dni od doręczenia pisma na dosłanie kopii paszportu, zdjęcia albo zgody. Przy tym wniosku od osoby za granicą nie pobiera się odcisków palców ani wzoru podpisu.
        en: The voivode gives at least 14 days from the day the letter is delivered to send the passport copy, photo or consent. For this application, no fingerprints or signature specimen are taken from the person abroad.
        uk: Воєвода дає щонайменше 14 днів від дня вручення листа, щоб надіслати копію паспорта, фото або згоду. Для цієї заяви в особи за кордоном не беруть відбитків пальців і зразка підпису.
        ru: Воевода дает не менее 14 дней со дня вручения письма, чтобы дослать копию паспорта, фото или согласие. Для этого заявления у человека за границей не берут отпечатки пальцев и образец подписи.
      dependsOn: [paper-attachments]
      quotes:
        - page: https://api.sejm.gov.pl/eli/acts/DU/2025/1794/text.pdf
          text: "Jeżeli do wniosku o udzielenie zezwolenia na pobyt czasowy, o którym mowa w art. 159 ust. 1 lub art. 160 pkt 1, 3, 4 lub 6, nie zostały dołączone dokumenty, o których mowa w ust. 3, wojewoda wzywa członka rodziny rozdzielonej do ich przedłożenia w terminie nie krótszym niż 14 dni od dnia doręczenia wezwania."
        - page: https://api.sejm.gov.pl/eli/acts/DU/2025/1794/text.pdf
          text: "W przypadku złożenia wniosku o udzielenie cudzoziemcowi przebywającemu poza granicami Rzeczypospolitej Polskiej zezwolenia na pobyt czasowy, o którym mowa w art. 159 ust. 1 lub art. 160 pkt 1, 3, 4 lub 6, od tego cudzoziemca nie pobiera się odcisków linii papilarnych ani wzoru podpisu."
    # CJ-02 content audit: on this route the first card is not issued ex officio; it is issued on
    # the person's own application (art. 229 ust. 4 pkt 1 and 1c), and art. 106h (the waiver)
    # doesn't apply (art. 106j), so the generic card step above is excluded here.
    - id: paper-card
      condition: { fact: pobyt_czasowy.purpose, eq: family_abroad }
      title:
        pl: "Gdy wniosek dotyczył osoby za granicą: o pierwszą kartę pobytu ta osoba składa osobny wniosek"
        en: "If the application was for a person abroad: that person applies separately for the first residence card"
        uk: "Якщо заява стосувалася особи за кордоном: ця особа окремо подає заяву на першу карту побиту"
        ru: "Если заявление касалось человека за границей: этот человек отдельно подает заявление на первую карту побыту"
      description:
        pl: Po udzieleniu zezwolenia pierwszej karty pobytu nie wydaje się z urzędu, tylko na wniosek tej osoby. Kartę wydaje wojewoda, który udzielił zezwolenia; jak złożyć wniosek, krajowe źródła, które mamy, nie mówią, więc zapytaj w tym urzędzie wojewódzkim. Kartę odbiera się osobiście i pokazuje ważny dokument podróży.
        en: Once the permit is granted, the first residence card is not issued automatically but on that person's application. The card is issued by the voivode who granted the permit; the national sources we have don't say how to apply, so ask that voivodeship office. The card is collected in person, showing a valid travel document.
        uk: Після надання дозволу першу карту побиту видають не автоматично, а за заявою цієї особи. Карту видає воєвода, який надав дозвіл; як подати заяву, національні джерела, які ми маємо, не кажуть, тож запитайте в цьому воєводському управлінні. Карту забирають особисто, показавши чинний проїзний документ.
        ru: После выдачи разрешения первую карту побыту выдают не автоматически, а по заявлению этого человека. Карту выдает воевода, который выдал разрешение; как подать заявление, национальные источники, которые у нас есть, не говорят, поэтому спросите в этом воеводском управлении. Карту забирают лично, показав действительный проездной документ.
      dependsOn: [paper-missing]
      quotes:
        - page: *foreigners
          text: "Pierwszą kartę pobytu w przypadku cudzoziemca, który:"
        - page: *foreigners
          text: "uzyskał zezwolenie na pobyt czasowy w celu połączenia się z rodziną, a w dniu złożenia wniosku o udzielenie mu tego zezwolenia przebywał poza granicami Rzeczypospolitej Polskiej, lub"
        - page: *foreigners
          text: "uzyskał zezwolenie na pobyt czasowy, o którym mowa w art. 160 pkt 1, 3, 4 lub 6, a w dniu złożenia wniosku o udzielenie mu tego zezwolenia przebywał poza granicami Rzeczypospolitej Polskiej, lub"
        - page: *foreigners
          text: "– wydaje się na wniosek cudzoziemca."
        - page: *foreigners
          text: "Kartę pobytu wydaje lub odmawia jej wydania wojewoda, który udzielił cudzoziemcowi zezwolenia na pobyt czasowy, zezwolenia na pobyt stały lub zezwolenia na pobyt rezydenta długoterminowego UE."
        - page: *mos-act
          text: "Cudzoziemiec, odbierając kartę pobytu, okazuje ważny dokument podróży."
  documents:
    - id: photo
      condition: { not: { fact: pobyt_czasowy.purpose, eq: family_abroad } }
      namePl:
        value: aktualną fotografię w formacie cyfrowym
        quotes:
          - page: &qa https://www.gov.pl/web/udsc/mos-qa
            text: "aktualną fotografię w formacie cyfrowym;"
      description:
        pl: Jako plik, do 2,5 MB.
        en: As a file, up to 2.5 MB.
        uk: Як файл, до 2,5 МБ.
        ru: Как файл, до 2,5 МБ.
    - id: travel-document
      condition: { not: { fact: pobyt_czasowy.purpose, eq: family_abroad } }
      namePl:
        value: odwzorowanie cyfrowe (skan lub zdjęcie) wszystkich stron ważnego dokumentu podróży
        quotes:
          - page: *qa
            text: "odwzorowanie cyfrowe (skan lub zdjęcie) wszystkich stron ważnego dokumentu podróży;"
      description:
        pl: Wszystkie strony paszportu, nie tylko strona ze zdjęciem.
        en: Every page of the passport, not just the photo page.
        uk: Усі сторінки паспорта, а не лише сторінка з фото.
        ru: Все страницы паспорта, а не только страница с фото.
    - id: payment-confirmations
      condition: { not: { fact: pobyt_czasowy.purpose, eq: family_abroad } }
      namePl:
        value: potwierdzenie dokonania płatności
        quotes:
          - page: *qa
            text: "potwierdzenie dokonania płatności (skan dokumentu lub elektroniczne potwierdzenie przelewu): opłaty w wysokości 100 zł za wydanie karty pobytu oraz opłaty skarbowej w za udzielenie zezwolenia na pobyt (od 340 zł do 640 zł, w zależności od rodzaju zezwolenia);"
      description:
        pl: Obu opłat, skan albo potwierdzenie przelewu.
        en: For both fees, a scan or the transfer confirmation.
        uk: За обидва збори, скан або підтвердження переказу.
        ru: За оба сбора, скан или подтверждение перевода.
    # The three attachments are named by who fills them in (agent dry run, 2026-10-10: all three
    # read "załącznik podpisany elektronicznie przez", cut where UDSC's list begins). UDSC's page
    # splits each name into a lead-in and a list item, which no single quote can carry, so the
    # names are the act's own words (art. 106 ust. 2, 5 and 7 as amended by Dz.U. 2025 poz.
    # 1794). UDSC's list stays quoted: it says the attachment is signed electronically.
    - id: employer-attachment
      condition: { fact: pobyt_czasowy.purpose, in: [work, business] }
      namePl:
        value: wypełniony przez podmiot powierzający mu pracę załącznik
        quotes:
          - page: *mos-act
            text: "Cudzoziemiec ubiegający się o udzielenie zezwolenia na pobyt czasowy i pracę, zezwolenia na pobyt czasowy w celu wykonywania pracy w zawodzie wymagającym wysokich kwalifikacji, zezwolenia na pobyt czasowy w celu mobilności długoterminowej posiadacza Niebieskiej Karty UE albo zezwolenia na pobyt czasowy w celu prowadzenia działalności gospodarczej, jeżeli celem pobytu cudzoziemca jest wykonywanie pracy przez pełnienie funkcji w zarządzie spółki z ograniczoną odpowiedzialnością lub spółki akcyjnej, którą utworzył lub której udziały lub akcje objął lub nabył, lub prowadzenie spraw spółki komandytowej lub komandytowo-akcyjnej przez komplementariusza, lub działanie w charakterze prokurenta, dołącza do wniosku o udzielenie zezwolenia na pobyt czasowy wypełniony przez podmiot powierzający mu pracę załącznik zawierający:"
          - page: *info
            text: "załącznik podpisany elektronicznie przez:\n- pracodawcę – w przypadku wniosku o udzielenie zezwolenia:\n- na pobyt czasowy i pracę,"
          - page: *info
            text: "na pobyt czasowy w celu prowadzenia działalności gospodarczej udziela się cudzoziemcowi, którego celem pobytu jest wykonywanie pracy poprzez pełnienie funkcji w zarządzie spółki z ograniczoną odpowiedzialnością lub spółki akcyjnej, którą utworzył lub której udziały lub akcje objął lub nabył, lub prowadzenie spraw spółki komandytowej lub komandytowo-akcyjnej przez komplementariusza, lub działanie w charakterze prokurenta,"
      description:
        pl: Od pracodawcy, który wypełnia i podpisuje go w MOS. Przy własnej firmie dotyczy to pracy w zarządzie spółki z o.o. lub S.A., prowadzenia spraw spółki komandytowej lub komandytowo-akcyjnej jako komplementariusz albo działania jako prokurent.
        en: An attachment that the employer fills in and signs in MOS. For your own business, this applies when you work on the board of a limited liability or joint-stock company, run a limited or limited joint-stock partnership as its general partner, or act as a commercial proxy (prokurent).
        uk: Додаток, який роботодавець заповнює і підписує в MOS. Для власного бізнесу це стосується роботи в правлінні товариства з обмеженою відповідальністю або акціонерного товариства, ведення справ командитного чи командитно-акціонерного товариства як повного товариша або дій як прокурент (prokurent).
        ru: Приложение, которое работодатель заполняет и подписывает в MOS. Для собственного бизнеса это касается работы в правлении общества с ограниченной ответственностью или акционерного общества, ведения дел коммандитного или коммандитно-акционерного товарищества в качестве полного товарища или действий в качестве прокуриста (prokurent).
    - id: university-attachment
      condition: { fact: pobyt_czasowy.purpose, eq: study }
      namePl:
        value: wypełniony przez jednostkę prowadzącą studia załącznik
        quotes:
          - page: *mos-act
            text: "Cudzoziemiec ubiegający się o udzielenie zezwolenia na pobyt czasowy w celu kształcenia się na studiach dołącza do wniosku o udzielenie zezwolenia na pobyt czasowy wypełniony przez jednostkę prowadzącą studia załącznik zawierający:"
          - page: *info
            text: "jednostkę prowadzącą studia – w przypadku wniosku o udzielenie zezwolenia na pobyt czasowy w celu kształcenia się na studiach;"
          - page: *info
            text: "załącznik podpisany elektronicznie przez:"
      description:
        pl: Od uczelni, która wypełnia i podpisuje go w MOS.
        en: An attachment that the university fills in and signs in MOS.
        uk: Додаток, який університет заповнює і підписує в MOS.
        ru: Приложение, которое университет заполняет и подписывает в MOS.
    - id: internship-attachment
      condition: { fact: pobyt_czasowy.purpose, eq: internship }
      namePl:
        value: wypełniony przez organizatora stażu lub jednostkę organizacyjną, na rzecz której cudzoziemiec ma wykonywać świadczenia jako wolontariusz, załącznik
        quotes:
          - page: *mos-act
            text: "Cudzoziemiec ubiegający się o udzielenie zezwolenia na pobyt czasowy dla stażysty lub zezwolenia na pobyt czasowy dla wolontariusza dołącza do wniosku o udzielenie zezwolenia na pobyt czasowy wypełniony przez organizatora stażu lub jednostkę organizacyjną, na rzecz której cudzoziemiec ma wykonywać świadczenia jako wolontariusz, załącznik zawierający:"
          - page: *info
            text: "organizatora stażu lub wolontariatu – w przypadku wniosku o udzielnie zezwolenia na pobyt czasowy w celu odbycia stażu lub wolontariatu."
          - page: *info
            text: "załącznik podpisany elektronicznie przez:"
      description:
        pl: Od organizatora stażu albo wolontariatu, który wypełnia i podpisuje go w MOS.
        en: An attachment that the internship or volunteering organiser fills in and signs in MOS.
        uk: Додаток, який організатор стажування або волонтерства заповнює і підписує в MOS.
        ru: Приложение, которое организатор стажировки или волонтерства заполняет и подписывает в MOS.
    - id: paper-passport-copy
