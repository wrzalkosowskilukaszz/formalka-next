          en: "The office's Citizen Helpline („Infolinia dla Obywatela”) gives no information on case statuses or on its departments' internal procedures. Neither does its information desk."
          uk: "Інфолінія для громадян („Infolinia dla Obywatela”) не надає інформації про статуси справ чи внутрішні процедури окремих відділів. Інформаційний пункт управління також не надає такої інформації."
          ru: "Горячая линия для граждан („Infolinia dla Obywatela”) не дает информации о статусах дел или внутренних процедурах отдельных отделов. Информационный пункт управления также не дает такой информации."
        quotes:
