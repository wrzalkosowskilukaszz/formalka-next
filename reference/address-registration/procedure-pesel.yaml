          ru: "Дело рассматривают безотлагательно, не позднее чем через 30 дней после подачи заявления."
        quotes:
          - page: &krakow https://www.bip.krakow.pl/uslugi/SA-34&metka=1
            text: "Sprawa załatwiana jest niezwłocznie, nie później niż w terminie 30 dni od złożenia wniosku."
      differs:
