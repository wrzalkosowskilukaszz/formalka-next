# PESEL number for foreigners: the standalone application (nadanie numeru PESEL na wniosek),
# hand-authored from the gov.pl service card, with the Warsaw and Kraków city layers
# (PESEL-01, ADR-0011). The other way to a PESEL, address registration (zameldowanie), is its
# own procedure (next).
#
# Every quote names the official page it comes from (`page`); the `load-procedures` job
# resolves it to the latest snapshot of that page and publishes only if every quote is found
# there. Polish statements are verbatim official wording; en/uk are our translations of it.
#
# Known conflict (JOURNEYS.md §5): Kraków's card SA-34 still says anyone may file through a
# proxy, while the gov.pl card and Warsaw say that people other than EU/EFTA/Swiss/UK citizens
# and their families must file in person since 1 January 2026. We show the national rule to
# everyone, and Kraków's wording as `differs` in its place layer, next to it, so the guide is
# marked "sources disagree" (rule 4).

- id: pesel-application
  domain: pesel
  related: [zameldowanie-foreigner]
  riskClass: A
  verificationLevel: sources_disagree
  checkedAt: "2026-10-01"
  title:
    pl: Numer PESEL na wniosek
    en: Getting a PESEL number by application
    uk: Номер PESEL за заявою
    ru: Номер PESEL по заявлению
  summary:
    pl: Jak dostać numer PESEL, jeśli nie możesz się zameldować, a urząd go od Ciebie wymaga. Wniosek składasz w urzędzie gminy.
    en: How to get a PESEL number if you can't register your address and an office requires one from you. You file the application at a municipal office.
    uk: Як отримати номер PESEL, якщо ви не можете зареєструвати адресу, а установа його вимагає. Заяву подають в управлінні гміни.
    ru: Как получить номер PESEL, если вы не можете зарегистрировать адрес, а учреждение его требует. Заявление подают в управлении гмины.
  applicability:
    rule: { fact: pesel.stay_over_30, eq: "no" }
    conditions:
      - id: cannot-register-and-required
        rule: { fact: pesel.stay_over_30, eq: "no" }
        # Partial twice over: we don't ask whether an office requires the number (UX audit F9),
        # and "no" to pesel.stay_over_30 stands in for the official "nie możesz się zameldować"
        # (a stay of 30 days or less is exempt from registration, not barred from it; content
        # audit 2026-10-05). The quote is always shown verbatim.
        partial: true
        statement:
          value:
            pl: "Jeśli nie możesz się zameldować, a jakiś urząd wymaga od ciebie numeru PESEL – złóż wniosek."
            en: "If you can't register your address and an office requires a PESEL number from you, file an application."
            uk: "Якщо ви не можете зареєструвати адресу, а якась установа вимагає від вас номер PESEL, подайте заяву."
            ru: "Если вы не можете зарегистрировать адрес, а какое-либо учреждение требует от вас номер PESEL, подайте заявление."
          quotes:
            - page: &govpl https://www.gov.pl/web/gov/uzyskaj-numer-pesel-dla-cudzoziemcow
              text: "Jeśli nie możesz się zameldować, a jakiś urząd wymaga od ciebie numeru PESEL – złóż wniosek."
  requiredFacts:
    - pesel.has_number
    - pesel.temporary_protection
    - pesel.stay_over_30
    - pesel.citizen_group
  steps:
    - id: fill-in
      title:
        pl: Wypełnij wniosek
        en: Fill in the application
        uk: Заповніть заяву
        ru: Заполните заявление
      description:
        pl: Wniosek pobierzesz ze strony albo dostaniesz w urzędzie gminy. Podpisz go własnoręcznie.
        en: Download the application form or get it at the municipal office. Sign it by hand.
        uk: Бланк заяви можна завантажити або отримати в управлінні гміни. Підпишіть його власноруч.
        ru: Бланк заявления можно скачать или получить в управлении гмины. Подпишите его собственноручно.
      channels: [in_person]
      # The official form (EL/W/1, verified 2026-10-03: PDF, Polish), also on Documents.
      links:
        - &form
          url: https://www.gov.pl/attachment/2098ee8f-6401-4bf6-b046-626377a446a9
          title:
            pl: Pobierz wniosek o nadanie numeru PESEL (PDF, po polsku)
            en: Download the PESEL application form (PDF, in Polish)
            uk: Завантажити заяву про присвоєння номера PESEL (PDF, польською)
            ru: Скачать заявление о присвоении номера PESEL (PDF, на польском)
      quotes:
        - page: *govpl
          text: "wniosek o nadanie numeru PESEL – otwórz plik w nowym oknie – pobierz i wypełnij w domu. Możesz też dostać go w urzędzie gminy,"
        - page: *govpl
          text: "Wniosek należy własnoręcznie podpisać."
    - id: file
      title:
        pl: Złóż wniosek w urzędzie gminy
        en: File the application at a municipal office
        uk: Подайте заяву в управлінні гміни
        ru: Подайте заявление в управлении гмины
      description:
        pl: Możesz wybrać dowolny urząd gminy w Polsce.
        en: You can choose any municipal office in Poland.
        uk: Можна обрати будь-яке управління гміни в Польщі.
        ru: Можно выбрать любое управление гмины в Польше.
      dependsOn: [fill-in]
      channels: [in_person]
      officeKind: municipal_office
      quotes:
        - page: *govpl
          text: "Złóż wniosek w dowolnym urzędzie gminy – jeśli nie możesz się zameldować, a potrzebujesz numeru PESEL."
    - id: notification
      title:
        pl: Odbierz powiadomienie o nadaniu numeru PESEL
        en: Receive the notice that a PESEL number was assigned
        uk: Отримайте повідомлення про присвоєння номера PESEL
        ru: Получите уведомление о присвоении номера PESEL
      dependsOn: [file]
      channels: [in_person]
      officeKind: municipal_office
      quotes:
        - page: *govpl
          text: "Urzędnik przyjmie twoje zgłoszenie od razu. Jeśli jest podstawa do nadania numeru PESEL – dostaniesz powiadomienie o nadaniu numeru PESEL."
  documents:
    - id: application
      namePl:
        value: wniosek o nadanie numeru PESEL
        quotes:
          - page: *govpl
            text: "wniosek o nadanie numeru PESEL – otwórz plik w nowym oknie – pobierz i wypełnij w domu. Możesz też dostać go w urzędzie gminy,"
      description:
        pl: Formularz wniosku, podpisany własnoręcznie.
        en: The application form, signed by hand.
        uk: Бланк заяви, підписаний власноруч.
        ru: Бланк заявления, подписанный собственноручно.
      form: original
      links: [*form]
    # "One of these" (PESEL journey step 6, owner 2026-10-05): the act lists the travel document
    # for everyone, another ID with citizenship for EU/EFTA/Swiss citizens, and another ID only
    # in a specially justified case; one block of text read as "bring all of these".
    - id: identity
      namePl:
        value: ważny dokument podróży
        quotes:
          - page: &act https://api.sejm.gov.pl/eli/acts/DU/2026/384/text.pdf
            text: "Podstawę rejestracji danych cudzoziemca stanowi ważny dokument podróży, a w przypadku obywatela państwa członkowskiego Unii Europejskiej, obywatela państwa członkowskiego Europejskiego Porozumienia o Wolnym Handlu (EFTA) – strony umowy o Europejskim Obszarze Gospodarczym lub obywatela Konfederacji Szwajcarskiej – również inny dokument potwierdzający tożsamość i obywatelstwo."
          - page: *govpl
            text: "dokument, który potwierdzi twoją tożsamość i inne dane, które wpiszesz we wniosku."
          - page: &krakow-doc https://www.bip.krakow.pl/uslugi/SA-34&metka=1
            text: "Dowód osobisty lub paszport (do wglądu)."
      description:
        pl: Na przykład paszport.
        en: For example, a passport.
        uk: Наприклад, паспорт.
        ru: Например, паспорт.
      form: original
    - id: identity-eu
      condition: { not: { fact: pesel.citizen_group, eq: other } }
      alternativeTo: [identity]
      namePl:
        value: inny dokument potwierdzający tożsamość i obywatelstwo
        quotes:
          - page: *krakow-doc
            text: "Przygotuj ważny dokument podróży lub – jeśli jesteś obywatelem państwa członkowskiego UE, EFTA lub Konfederacji Szwajcarskiej - inny ważny dokument, który potwierdzi twoją tożsamość i obywatelstwo (dowód osobisty)."
          - page: *act
            text: "Podstawę rejestracji danych cudzoziemca stanowi ważny dokument podróży, a w przypadku obywatela państwa członkowskiego Unii Europejskiej, obywatela państwa członkowskiego Europejskiego Porozumienia o Wolnym Handlu (EFTA) – strony umowy o Europejskim Obszarze Gospodarczym lub obywatela Konfederacji Szwajcarskiej – również inny dokument potwierdzający tożsamość i obywatelstwo."
      description:
        pl: Tylko sami obywatele UE, EFTA i Szwajcarii, na przykład dowód osobisty. Przepis nie wymienia tu obywateli Wielkiej Brytanii ani członków rodziny.
        en: Only for citizens of EU and EFTA countries and Switzerland themselves, for example an identity card. The act doesn't name UK citizens or family members here.
        uk: Лише для самих громадян ЄС, ЄАВТ і Швейцарії, наприклад посвідчення особи. Закон тут не згадує громадян Великої Британії чи членів сім'ї.
        ru: Только для самих граждан ЕС, ЕАСТ и Швейцарии, например удостоверение личности. Закон здесь не называет граждан Великобритании или членов семьи.
      form: original
    - id: identity-exceptional
      alternativeTo: [identity]
      namePl:
        value: inny dokument potwierdzający tożsamość
        quotes:
          - page: *act
            text: "W szczególnie uzasadnionym przypadku, gdy cudzoziemiec nie posiada ważnego dokumentu podróży ani nie ma możliwości jego uzyskania, podstawę rejestracji danych może stanowić inny dokument potwierdzający tożsamość."
      description:
        pl: Wyjątkowo, gdy nie masz ważnego dokumentu podróży i nie możesz go zdobyć. To szczególnie uzasadniony przypadek, więc zapytaj w urzędzie gminy, czy Twój dokument wystarczy.
        en: Exceptionally, if you have no valid travel document and can't get one. It's for a specially justified case, so ask the municipal office whether your document will do.
        uk: Винятково, якщо у вас немає чинного проїзного документа і ви не можете його отримати. Це особливо обґрунтований випадок, тож запитайте в управлінні гміни, чи підійде ваш документ.
        ru: В исключительных случаях, если у вас нет действительного проездного документа и вы не можете его получить. Это особо обоснованный случай, поэтому спросите в управлении гмины, подойдёт ли ваш документ.
      form: original
    # Not an alternative: the other details in the application need their documents too (gov.pl,
    # act art. 18 ust. 2 "udokumentowane dane"; content audit of cd16aa2).
    - id: other-data
      namePl:
        value: oryginalne dokumenty (do wglądu) potwierdzające pozostałe dane
        quotes:
          - page: *krakow-doc
            text: "Przygotuj oryginalne dokumenty (do wglądu) potwierdzające pozostałe dane, jeśli zawarłeś je we wniosku (stanu cywilnego) – (szczegóły w sekcji „Wymagane dokumenty”)."
          - page: *govpl
            text: "dokument, który potwierdzi twoją tożsamość i inne dane, które wpiszesz we wniosku."
          - page: *act
            text: "Wniosek o nadanie numeru PESEL zawiera wskazanie podstawy prawnej oraz udokumentowane dane, o których mowa w art. 8 pkt 1–9, 11–13, 15 i 22–24a, z uwzględnieniem art. 9 i art. 12."
      description:
        pl: Dokumenty potwierdzające inne dane, które wpiszesz we wniosku, na przykład o stanie cywilnym. Zapytaj w urzędzie, które dokładnie.
        en: Documents confirming the other details you write in the application, for example your civil status. Ask the office which ones exactly.
        uk: Документи, що підтверджують інші дані, які ви впишете в заяву, наприклад про сімейний стан. Запитайте в установі, які саме.
        ru: Документы, подтверждающие другие данные, которые вы впишете в заявление, например о семейном положении. Спросите в учреждении, какие именно.
      form: original
  fees:
    - id: free
      purpose:
        pl: Wniosek o nadanie numeru PESEL
        en: The PESEL application
        uk: Заява про присвоєння PESEL
        ru: Заявление о присвоении PESEL
      amountPln:
        value: 0
        quotes:
          - page: *govpl
            text: "Usługa jest bezpłatna."
    # The register check (PESEL journey step 2): only for someone who has, or may have, a number.
    - id: check-online-free
      optional: true
      condition: { fact: pesel.has_number, eq: "yes" }
      purpose:
        pl: Sprawdzenie danych w rejestrze PESEL i pobranie zaświadczenia online
        en: Checking your data in the PESEL register and downloading the certificate online
        uk: Онлайн-перевірка даних у реєстрі PESEL і завантаження довідки
        ru: Онлайн-проверка данных в реестре PESEL и скачивание справки
      amountPln:
        value: 0
        quotes:
          - page: &sprawdz https://www.gov.pl/web/gov/sprawdz-swoje-dane-w-rejestrze-pesel
            text: "Usługa jest bezpłatna."
    - id: check-office-certificate
      optional: true
      condition: { fact: pesel.has_number, eq: "yes" }
      purpose:
        pl: Zaświadczenie z rejestru PESEL w urzędzie gminy, za każdą osobę
        en: Certificate from the PESEL register at a municipal office, per person
        uk: Довідка з реєстру PESEL в управлінні гміни, за кожну особу
        ru: Справка из реестра PESEL в управлении гмины, за каждого человека
      amountPln:
        value: 17
        quotes:
          - page: *sprawdz
            text: "Opłata skarbowa wynosi 17 zł za każdą osobę."
  deadlines:
    # The PESEL UKR deadline, for a reader under temporary protection (journey test of cd16aa2: it
    # was only in "worth knowing", while Deadlines showed the 7 days of the other application).
    # It runs from arrival: people who already hold PESEL UKR (phase-out act DU/2026/203 art. 24
    # pkt 2) or the UDSC certificate (art. 20) have other rules, as the PESEL UKR guide says.
    - id: ukr-application
      condition: { fact: pesel.temporary_protection, eq: "yes" }
      description:
        pl: Na wniosek o numer PESEL ze statusem UKR po przyjeździe, licząc od dnia przekroczenia granicy Polski. Kto ma już PESEL ze statusem UKR albo zaświadczenie UDSC o ochronie czasowej, ma osobne zasady, opisane w przewodniku o PESEL ze statusem UKR.
        en: For the application for a PESEL with UKR status after arriving, counted from the day you cross the Polish border. People who already have a PESEL with UKR status or the UDSC certificate of temporary protection have their own rules, described in the guide on PESEL with UKR status.
        uk: На заяву на PESEL зі статусом UKR після приїзду, від дня перетину кордону Польщі. Для тих, хто вже має PESEL зі статусом UKR або довідку UDSC про тимчасовий захист, діють окремі правила, описані в путівнику про PESEL зі статусом UKR.
        ru: На заявление на PESEL со статусом UKR после приезда, со дня пересечения границы Польши. Для тех, у кого уже есть PESEL со статусом UKR или справка UDSC о временной защите, действуют отдельные правила, описанные в путеводителе о PESEL со статусом UKR.
      rule:
        value: { kind: relative, amount: 30, unit: day, from: border_crossing }
        quotes:
          - page: https://api.sejm.gov.pl/eli/acts/DU/2026/862/text.pdf
            text: "Wniosek, o którym mowa w ust. 1, składa się w terminie 30 dni od dnia przekroczenia granicy Rzeczypospolitej Polskiej."
      consequence:
        value:
          pl: "1) cudzoziemiec nie złożył wniosku, o którym mowa w art. 110a ust. 1, w terminie określonym w art. 110a ust. 2;"
          en: "Temporary protection ends if the person doesn't file the application for a PESEL with UKR status within those 30 days."
          uk: "Тимчасовий захист припиняється, якщо особа не подала заяву на PESEL зі статусом UKR протягом цих 30 днів."
          ru: "Временная защита прекращается, если человек не подал заявление на PESEL со статусом UKR в течение этих 30 дней."
        quotes:
          - page: https://api.sejm.gov.pl/eli/acts/DU/2026/862/text.pdf
            text: "Ochrona czasowa wygasa, w przypadku gdy:"
          - page: https://api.sejm.gov.pl/eli/acts/DU/2026/862/text.pdf
            text: "1) cudzoziemiec nie złożył wniosku, o którym mowa w art. 110a ust. 1, w terminie określonym w art. 110a ust. 2;"
    - id: fix-missing
      description:
        pl: Na usunięcie braków we wniosku, jeśli urząd Cię do tego wezwie.
        en: To complete the application if the office asks you to.
        uk: На усунення недоліків заяви, якщо установа вас про це попросить.
        ru: На устранение недостатков заявления, если учреждение попросит вас об этом.
      rule:
        value: { kind: relative, amount: 7, unit: day, from: request_delivered }
        quotes:
          - page: *act
            text: "Jeżeli wniosek nie spełnia wymogów, o których mowa w ust. 2, należy wezwać wnioskodawcę do usunięcia braków w terminie 7 dni z pouczeniem, że ich nieusunięcie spowoduje pozostawienie wniosku bez rozpoznania."
          - page: https://warszawa19115.pl/-/nadanie-numeru-pesel-na-wniosek-cudzoziemca-ktory-nie-jest-obywatelem-krajow-ue-efta-wielkiej-brytanii-lub-czlonkiem-ich-rodzin
            text: "Jeżeli wniosek nie będzie spełniał wymogów określonych w przepisach, wezwiemy Cię do usunięcia braków. Jeśli tego nie zrobisz w ciągu 7 dni, Twój wniosek zostawimy bez rozpoznania."
      consequence:
        value:
          pl: "Jeżeli wniosek nie spełnia wymogów, o których mowa w ust. 2, należy wezwać wnioskodawcę do usunięcia braków w terminie 7 dni z pouczeniem, że ich nieusunięcie spowoduje pozostawienie wniosku bez rozpoznania."
          en: "If the application doesn't meet the requirements, the office asks you to complete it within 7 days. If you don't, the application won't be considered."
          uk: "Якщо заява не відповідає вимогам, установа попросить усунути недоліки протягом 7 днів. Якщо їх не усунуто, заяву залишать без розгляду."
          ru: "Если заявление не соответствует требованиям, учреждение попросит устранить недостатки в течение 7 дней. Если они не устранены, заявление оставят без рассмотрения."
        quotes:
          - page: *act
            text: "Jeżeli wniosek nie spełnia wymogów, o których mowa w ust. 2, należy wezwać wnioskodawcę do usunięcia braków w terminie 7 dni z pouczeniem, że ich nieusunięcie spowoduje pozostawienie wniosku bez rozpoznania."
  variations:
    - id: warszawa
      territory: ["1465011"]
      note:
        value:
          pl: "Wniosek musisz złożyć osobiście w dowolnej delegaturze Biura Administracji i Spraw Obywatelskich w Warszawie."
          en: "You must file the application in person at any district office (delegatura) of the Office of Administration and Civic Affairs in Warsaw."
          uk: "Заяву потрібно подати особисто в будь-якому районному відділенні (delegatura) Бюро адміністрації та громадянських справ у Варшаві."
          ru: "Заявление нужно подать лично в любом районном отделении (delegatura) Бюро администрации и гражданских дел в Варшаве."
        quotes:
          - page: &warszawa https://warszawa19115.pl/-/nadanie-numeru-pesel-na-wniosek-cudzoziemca-ktory-nie-jest-obywatelem-krajow-ue-efta-wielkiej-brytanii-lub-czlonkiem-ich-rodzin
            text: "Wniosek musisz złożyć osobiście w dowolnej delegaturze Biura Administracji i Spraw Obywatelskich w Warszawie."
      officeIds:
        - warszawa-baiso-bemowo
