  deadlines:
    - id: other-citizens
      condition: { not: { fact: zameldowanie.citizen_group, eq: eu_efta } }
      description:
        pl: Dla cudzoziemców spoza UE, EFTA i Szwajcarii, także obywateli Wielkiej Brytanii; liczy się od dnia zamieszkania pod adresem. Członek rodziny obywatela UE, EFTA lub Szwajcarii ma 30 dni. Członek rodziny obywatela polskiego ma 30 dni tylko w przypadkach wymienionych w ustawie o obywatelach UE i członkach ich rodzin, a w większości z nich trzeba spełnić łącznie kilka warunków; w innych przypadkach też ma 4 dni. Jeśli nie masz pewności, zapytaj w urzędzie gminy, zanim miną 4 dni.
        en: For foreigners from outside the EU, EFTA and Switzerland, including UK citizens; counted from the day you move in at the address. A family member of an EU, EFTA or Swiss citizen has 30 days. A family member of a Polish citizen has 30 days only in the cases listed in the act on EU citizens and their families, and most of these cases have several conditions that must all be met; otherwise they also have 4 days. If you're not sure, ask the municipal office before the 4 days run out.
        uk: Для іноземців з-поза ЄС, ЄАВТ і Швейцарії, зокрема громадян Великої Британії; відлік від дня заселення за адресою. Член сім'ї громадянина ЄС, ЄАВТ або Швейцарії має 30 днів. Член сім'ї громадянина Польщі має 30 днів лише у випадках, перелічених у законі про громадян ЄС та їхні родини, і в більшості з них треба виконати одразу кілька умов; в інших випадках він теж має 4 дні. Якщо ви не впевнені, запитайте в управлінні гміни, поки не минули 4 дні.
        ru: Для иностранцев не из ЕС, ЕАСТ и Швейцарии, в том числе граждан Великобритании; отсчет со дня заселения по адресу. Член семьи гражданина ЕС, ЕАСТ или Швейцарии имеет 30 дней. Член семьи гражданина Польши имеет 30 дней только в случаях, перечисленных в законе о гражданах ЕС и их семьях, и в большинстве из них нужно выполнить сразу несколько условий; в остальных случаях он тоже имеет 4 дня. Если вы не уверены, спросите в управлении гмины, пока не прошли 4 дня.
      rule:
        value: { kind: relative, amount: 4, unit: day, from: arrival_at_address }
        quotes:
          - page: *govpl
            text: "Najpóźniej w 4 dniu od zamieszkania w Polsce, w lokalu, w którym chcesz się zameldować."
          - page: *act
            text: "Cudzoziemiec niewymieniony w ust. 1–2a, przebywający na terytorium Rzeczypospolitej Polskiej, ma obowiązek zameldować się w miejscu pobytu stałego lub czasowego najpóźniej czwartego dnia, licząc od dnia przybycia do tego miejsca."
          # Art. 41 ust. 2 and 2a: the 30 days for family members, and for family members of a
          # Polish citizen only as the 2006 act's art. 2 pkt 4 lit. b defines them.
          - page: *act
            text: &art41-2 "Członek rodziny cudzoziemca, o którym mowa w ust. 1, niebędący obywatelem państwa członkowskiego Unii Europejskiej, obywatelem państwa członkowskiego Europejskiego Porozumienia o Wolnym Handlu (EFTA) – strony umowy o Europejskim Obszarze Gospodarczym lub obywatelem Konfederacji Szwajcarskiej, jest obowiązany zameldować się w miejscu pobytu stałego lub czasowego najpóźniej w 30 dniu, licząc od dnia przybycia do tego miejsca."
          - page: *act
            text: &art41-2a "Przepis ust. 2 stosuje się także do członka rodziny obywatela Rzeczypospolitej Polskiej, o którym mowa w art. 2 pkt 4 lit. b ustawy z dnia 14 lipca 2006 r. o wjeździe na terytorium Rzeczypospolitej Polskiej, pobycie oraz wyjeździe z tego terytorium obywateli państw członkowskich Unii Europejskiej i członków ich rodzin (Dz. U. z 2025 r. poz. 1164 i 1794)."
          - page: https://api.sejm.gov.pl/eli/acts/DU/2026/1065/text.pdf
            text: "w przypadku członka rodziny obywatela Rzeczypospolitej Polskiej – cudzoziemca niebędącego obywatelem UE:"
      consequence:
        value:
          pl: "Cudzoziemiec niebędący obywatelem państwa członkowskiego Unii Europejskiej, obywatelem państwa członkowskiego Europejskiego Porozumienia o Wolnym Handlu (EFTA) – strony umowy o Europejskim Obszarze Gospodarczym lub obywatelem Konfederacji Szwajcarskiej, który nie dopełnia ciążącego na nim obowiązku meldunkowego, podlega karze grzywny."
          en: "A foreigner who isn't a citizen of an EU or EFTA (EEA) state or of Switzerland and doesn't meet the registration obligation is liable to a fine."
          uk: "Іноземець, який не є громадянином держави ЄС, ЄАВТ (сторони угоди про ЄЕП) або Швейцарії і не виконує обов'язку реєстрації, підлягає штрафу."
          ru: "Иностранец, который не является гражданином государства ЕС, ЕАСТ (стороны соглашения о ЕЭП) или Швейцарии и не выполняет обязанность регистрации, подлежит штрафу."
        quotes:
          - page: *act
            text: "Cudzoziemiec niebędący obywatelem państwa członkowskiego Unii Europejskiej, obywatelem państwa członkowskiego Europejskiego Porozumienia o Wolnym Handlu (EFTA) – strony umowy o Europejskim Obszarze Gospodarczym lub obywatelem Konfederacji Szwajcarskiej, który nie dopełnia ciążącego na nim obowiązku meldunkowego, podlega karze grzywny."
