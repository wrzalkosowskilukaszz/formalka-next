# Address registration (zameldowanie) for foreigners, permanent or temporary, hand-authored
# from the gov.pl card (one page holding every branch: EU/EFTA or not, permanent or temporary)
# with the Warsaw and Kraków place layers (PESEL-02, ADR-0011). Registering also gives a PESEL
# number (see the PESEL guide's "register instead" warning).
#
# Every quote names the official page it comes from (`page`); the `load-procedures` job
# resolves it to the latest snapshot of that page and publishes only if every quote is found
# there. Polish statements are verbatim official wording; en/uk are our translations of it.
#
# The gov.pl card repeats some sentences in several branches; each quote here is used only
# under the condition its branch states (citizen group, kind of stay).
#
# Known conflict: for people in Poland visa-free, gov.pl and Kraków list a residence document
# besides the travel document, while Warsaw asks only for the travel document. The act's art. 43
# ust. 3 (in force in its Dz.U. 2025 poz. 1794 wording since 27 April 2026) is quoted too, without
# our reading of it (rule 4). Legal audit 2026-10-02: the act (Dz.U. 2026 poz. 384) is stricter
# than gov.pl's "over 3 months": non-EU foreigners register any stay over 30 days.

- id: zameldowanie-foreigner
  domain: zameldowanie
  related: [pesel-application]
  riskClass: B
  verificationLevel: sources_disagree
  checkedAt: "2026-10-01"
  title:
    pl: Zameldowanie cudzoziemca
    en: Registering your address (zameldowanie)
    uk: Реєстрація адреси (zameldowanie)
    ru: Регистрация адреса (zameldowanie)
  summary:
    pl: Jak zameldować się na pobyt stały albo czasowy pod adresem, pod którym mieszkasz. Z meldunkiem możesz też dostać numer PESEL.
    en: How to register your permanent or temporary stay at the address where you live. Registering can also get you a PESEL number.
    uk: Як зареєструвати постійне або тимчасове перебування за адресою, де ви живете. З реєстрацією ви можете також отримати номер PESEL.
    ru: Как зарегистрировать постоянное или временное пребывание по адресу, где вы живете. С регистрацией вы можете также получить номер PESEL.
  applicability:
    conditions:
      - id: lives-in-poland
        statement:
          value:
            pl: "Cudzoziemcy są zwolnieni z obowiązku meldunkowego, jeżeli okres ich pobytu na terytorium Rzeczypospolitej Polskiej nie przekracza 30 dni."
            en: "Foreigners don't have to register if their stay in Poland doesn't exceed 30 days."
            uk: "Іноземці звільнені від обов'язку реєстрації, якщо їхнє перебування на території Польщі не перевищує 30 днів."
            ru: "Иностранцы освобождены от обязанности регистрации, если их пребывание на территории Польши не превышает 30 дней."
          quotes:
            - page: &act https://api.sejm.gov.pl/eli/acts/DU/2026/384/text.pdf
              text: "Cudzoziemcy są zwolnieni z obowiązku meldunkowego, jeżeli okres ich pobytu na terytorium Rzeczypospolitej Polskiej nie przekracza 30 dni."
            - page: &govpl https://www.gov.pl/web/gov/zamelduj-sie-na-pobyt-staly-dla-cudzoziemcow
              text: "Jeśli mieszkasz w Polsce – zamelduj się na pobyt stały lub czasowy (czyli powyżej 3 miesięcy)."
  requiredFacts:
    - zameldowanie.citizen_group
    - zameldowanie.stay
  steps:
    - id: fill-in
      title:
        pl: Wypełnij formularz meldunkowy
        en: Fill in the registration form
        uk: Заповніть реєстраційний бланк
        ru: Заполните регистрационный бланк
      description:
        pl: Formularz zgłoszenia pobytu stałego albo czasowego pobierzesz ze strony albo wypełnisz w urzędzie gminy.
        en: Download the form for a permanent or a temporary stay, or fill it in at the municipal office.
        uk: Бланк для постійного або тимчасового перебування можна завантажити або заповнити в управлінні гміни.
        ru: Бланк для постоянного или временного пребывания можно скачать или заполнить в управлении гмины.
      channels: [in_person]
      links:
        # The official forms (EL/ZC/1, EL/ZPS/1; verified 2026-10-03: PDF, Polish and English),
        # also on Documents.
        - &formTemporary
          url: https://www.gov.pl/attachment/606f2b47-0c11-4744-a2b4-9eab57c2fbb8
          title:
            pl: Pobierz formularz zgłoszenia pobytu czasowego (PDF, po polsku i angielsku)
            en: Download the temporary stay registration form (PDF, Polish and English)
            uk: Завантажити бланк реєстрації тимчасового перебування (PDF, польською та англійською)
            ru: Скачать бланк регистрации временного пребывания (PDF, на польском и английском)
        - &formPermanent
          url: https://www.gov.pl/attachment/82958602-cf7d-4d31-8911-627a1566075f
          title:
            pl: Pobierz formularz zgłoszenia pobytu stałego (PDF, po polsku i angielsku)
            en: Download the permanent stay registration form (PDF, Polish and English)
            uk: Завантажити бланк реєстрації постійного перебування (PDF, польською та англійською)
            ru: Скачать бланк регистрации постоянного пребывания (PDF, на польском и английском)
      quotes:
        - page: *govpl
          text: "formularz zgłoszenia pobytu stałego, plik PDF 1,74 MB lub formularz zgłoszenia pobytu czasowego, plik PDF 1,73 MB – pobierz i wypełnij w domu albo zrób to w swoim urzędzie gminy. Możesz też poprosić urzędnika, żeby wydrukował wypełniony formularz z systemu;"
    - id: owner-confirms
      title:
        pl: Poproś właściciela o potwierdzenie na formularzu
        en: Ask the owner to confirm on the form
        uk: Попросіть власника підтвердити на бланку
        ru: Попросите собственника подтвердить на бланке
      description:
        pl: Właściciel mieszkania albo inna osoba lub firma z tytułem prawnym do niego potwierdza na formularzu, że tam mieszkasz.
        en: The owner of the flat, or another person or company with a legal title to it, confirms on the form that you live there.
        uk: Власник житла або інша особа чи компанія, що має на нього правовий титул, підтверджує на бланку, що ви там живете.
        ru: Собственник жилья или другое лицо либо компания, имеющие юридическое право на это жилье, подтверждают на бланке, что вы там живете.
      dependsOn: [fill-in]
      channels: [in_person]
      quotes:
        - page: *govpl
          text: "Na formularzu, który przyniesiesz do urzędu, właściciel lub inny podmiot, który ma tytuł prawny do mieszkania, musi potwierdzić, że przebywasz w tym lokalu."
    - id: file
      title:
        pl: Złóż formularz w urzędzie gminy
        en: File the form at the municipal office
        uk: Подайте бланк в управлінні гміни
        ru: Подайте бланк в управлении гмины
      description:
        pl: W urzędzie gminy, w której mieszkasz; pokaż tam dokumenty wymienione w części „Dokumenty”. Przez internet mogą to zrobić tylko obywatele UE i EFTA oraz członkowie ich rodzin, z profilem zaufanym albo kwalifikowanym podpisem.
        en: At the municipal office of the place where you live; there, show the documents listed under “Documents”. Only EU and EFTA citizens and their family members can do this online, with a Trusted Profile (Profil Zaufany) or a qualified e-signature.
        uk: В управлінні гміни, де ви живете; покажіть там документи, перелічені в розділі «Документи». Онлайн це можуть зробити лише громадяни ЄС і ЄАВТ та члени їхніх сімей, з довіреним профілем (Profil Zaufany) або кваліфікованим підписом.
        ru: В управлении гмины, где вы живете; покажите там документы, перечисленные в разделе «Документы». Онлайн это могут сделать только граждане ЕС и ЕАСТ и члены их семей, с доверенным профилем (Profil Zaufany) или квалифицированной подписью.
      dependsOn: [owner-confirms]
      channels: [in_person, online]
      officeKind: municipal_office
      quotes:
        - page: *govpl
          text: "W urzędzie gminy, na terenie której mieszkasz."
        - page: *govpl
          text: "Złóż w urzędzie formularz meldunkowy i okaż pozostałe dokumenty."
        - page: *govpl
          text: "Jeśli chcesz złożyć formularz przez Internet, potrzebujesz profilu zaufanego lub kwalifikowanego certyfikatu podpisu elektronicznego."
    - id: registered
      title:
        pl: Urzędnik melduje Cię od razu
        en: The official registers you straight away
        uk: Посадовець реєструє вас одразу
        ru: Сотрудник регистрирует вас сразу
      dependsOn: [file]
      channels: [in_person]
      officeKind: municipal_office
      quotes:
        - page: *govpl
          text: "Urzędnik zamelduje cię od razu po otrzymaniu twojego zgłoszenia."
  documents:
    - id: form-temporary
      condition: { fact: zameldowanie.stay, eq: temporary }
      namePl:
        value: formularz zgłoszenia pobytu czasowego
        quotes:
          - page: *govpl
            text: "formularz zgłoszenia pobytu czasowego, plik PDF 1,73 MB – pobierz i wypełnij w domu albo zrób to w swoim urzędzie gminy. Możesz też poprosić urzędnika, żeby wydrukował wypełniony formularz z systemu,"
      description:
        pl: Do zameldowania na pobyt czasowy, z potwierdzeniem właściciela.
        en: For registering a temporary stay, with the owner's confirmation.
        uk: Для реєстрації тимчасового перебування, з підтвердженням власника.
        ru: Для регистрации временного пребывания, с подтверждением собственника.
      form: original
      links: [*formTemporary]
      # Content audit of F14: the official page names one form per kind of stay ("… lub …").
      alternativeTo: [form-permanent]
    - id: form-permanent
      condition: { fact: zameldowanie.stay, eq: permanent }
      namePl:
        value: formularz zgłoszenia pobytu stałego
        quotes:
          - page: *govpl
            text: "formularz zgłoszenia pobytu stałego, plik PDF 1,74 MB lub formularz zgłoszenia pobytu czasowego, plik PDF 1,73 MB – pobierz i wypełnij w domu albo zrób to w swoim urzędzie gminy. Możesz też poprosić urzędnika, żeby wydrukował wypełniony formularz z systemu;"
      description:
        pl: Do zameldowania na pobyt stały, z potwierdzeniem właściciela.
        en: For registering a permanent stay, with the owner's confirmation.
        uk: Для реєстрації постійного перебування, з підтвердженням власника.
        ru: Для регистрации постоянного пребывания, с подтверждением собственника.
      form: original
      links: [*formPermanent]
    - id: identity-eu
      condition: { fact: zameldowanie.citizen_group, eq: eu_efta }
      namePl:
        value: ważny dokument podróży lub inny ważny dokument, który potwierdzi twoją tożsamość i obywatelstwo
        quotes:
          - page: *govpl
            text: "ważny dokument podróży lub inny ważny dokument, który potwierdzi twoją tożsamość i obywatelstwo,"
      description:
        pl: Dla obywateli UE i EFTA.
        en: For EU and EFTA citizens.
        uk: Для громадян ЄС і ЄАВТ.
        ru: Для граждан ЕС и ЕАСТ.
      form: original
    - id: family-card
      condition: { fact: zameldowanie.citizen_group, eq: eu_efta }
      namePl:
        value: ważną kartę pobytu członka rodziny obywatela UE
        quotes:
          - page: *govpl
            text: "ważną kartę stałego pobytu członka rodziny obywatela UE albo\n- ważną kartę pobytu członka rodziny obywatela UE albo\n- inny dokument, który potwierdzi, że jesteś członkiem rodziny obywatela UE;"
      description:
        pl: Tylko dla członków rodziny obywatela UE, razem z ważnym dokumentem podróży; albo karta stałego pobytu albo inny dokument potwierdzający, że jesteś członkiem rodziny.
        en: Only for family members of an EU citizen, together with a valid travel document; or the permanent residence card; or another document confirming you're a family member.
        uk: Лише для членів сім'ї громадянина ЄС, разом із дійсним проїзним документом; або карта постійного перебування, або інший документ, що підтверджує, що ви член сім'ї.
        ru: Только для членов семьи гражданина ЕС, вместе с действительным проездным документом; или карта постоянного пребывания, или другой документ, подтверждающий, что вы член семьи.
      form: original
    - id: travel-document
      condition: { not: { fact: zameldowanie.citizen_group, eq: eu_efta } }
      namePl:
        value: ważny dokument podróży
        quotes:
          # Permanent stay (non-EU branch) and temporary stay (non-EU branch).
          - page: *govpl
            text: "- ważny dokument podróży;\n- JEDEN z poniższych dokumentów:"
          - page: *govpl
            text: "- ważny dokument podróży,\n- wizę."
      description:
        pl: Ważny dokument podróży. Dla osób spoza UE, EFTA i Szwajcarii, także obywateli Wielkiej Brytanii.
        en: A valid travel document. For people from outside the EU, EFTA and Switzerland, including UK citizens.
        uk: Дійсний проїзний документ. Для осіб з-поза ЄС, ЄАВТ і Швейцарії, зокрема громадян Великої Британії.
        ru: Действительный проездной документ. Для людей из-за пределов ЕС, ЕАСТ и Швейцарии, в том числе граждан Великобритании.
      form: original
    - id: uk-residence-document
      condition: { fact: zameldowanie.citizen_group, eq: uk_wa }
      namePl:
        value: ważne zaświadczenie o zarejestrowaniu pobytu albo ważny dokument potwierdzający prawo stałego pobytu
        quotes:
          - page: *act
            text: "Obywatel Zjednoczonego Królestwa Wielkiej Brytanii i Irlandii Północnej, o którym mowa w art. 10 ust. 1 lit. b lub d Umowy o wystąpieniu Zjednoczonego Królestwa Wielkiej Brytanii i Irlandii Północnej z Unii Europejskiej i Europejskiej Wspólnoty Energii Atomowej, dokonując zameldowania na pobyt stały, przedstawia ważne zaświadczenie o zarejestrowaniu pobytu albo ważny dokument potwierdzający prawo stałego pobytu, a członek jego rodziny, o którym mowa w art. 10 ust. 1 lit. e i f tej umowy, przedstawia ważną kartę pobytową lub ważną kartę stałego pobytu."
          - page: *act
            text: "Obywatel Zjednoczonego Królestwa Wielkiej Brytanii i Irlandii Północnej, o którym mowa w art. 10 ust. 1 lit. b lub d Umowy o Wystąpieniu Zjednoczonego Królestwa Wielkiej Brytanii i Irlandii Północnej z Unii Europejskiej i Europejskiej Wspólnoty Energii Atomowej, dokonując zameldowania się na pobyt czasowy, przedstawia ważne zaświadczenie o zarejestrowaniu pobytu albo ważny dokument potwierdzający prawo stałego pobytu, a członek jego rodziny, o którym mowa w art. 10 ust. 1 lit. e i f tej umowy, przedstawia ważną kartę pobytową lub ważną kartę stałego pobytu."
      description:
        pl: Dla obywateli Wielkiej Brytanii objętych umową o wystąpieniu; członek rodziny pokazuje ważną kartę pobytową albo kartę stałego pobytu. Razem z ważnym dokumentem podróży.
        en: For UK citizens covered by the Withdrawal Agreement; a family member shows a valid residence card (karta pobytowa) or permanent residence card. Together with a valid travel document.
        uk: Для громадян Великої Британії, на яких поширюється Угода про вихід; член сім'ї показує дійсну карту перебування або карту постійного перебування. Разом із дійсним проїзним документом.
        ru: Для граждан Великобритании, на которых распространяется Соглашение о выходе; член семьи показывает действительную карту пребывания или карту постоянного пребывания. Вместе с действительным проездным документом.
      form: original
    - id: visa
      condition:
        all:
          - { fact: zameldowanie.citizen_group, eq: other }
          - { fact: zameldowanie.stay, eq: temporary }
      namePl:
        value: wizę
        quotes:
          - page: *govpl
            text: "- wizę.\nJeśli jesteś w Polsce w ramach ruchu bezwizowego albo czekasz na wydanie decyzji w sprawie udzielenia zezwolenia na pobyt czasowy, zezwolenia na pobyt stały lub zezwolenia na pobyt rezydenta długoterminowego UE i jednocześnie złożyłeś w terminie wniosek o wydanie takiego zezwolenia, przygotuj:"
      description:
        pl: Do zameldowania na pobyt czasowy, jeśli jesteś w Polsce na podstawie wizy.
        en: For registering a temporary stay, if you're in Poland on a visa.
        uk: Для реєстрації тимчасового перебування, якщо ви перебуваєте в Польщі на підставі візи.
        ru: Для регистрации временного пребывания, если вы находитесь в Польше на основании визы.
      # "One of these, depending on your situation" (UX audit F14): the official page lists
      # them as alternatives for different situations, never both.
      alternativeTo: [visa-free-or-waiting]
      form: original
    - id: visa-free-or-waiting
      condition:
        all:
          - { fact: zameldowanie.citizen_group, eq: other }
          - { fact: zameldowanie.stay, eq: temporary }
      namePl:
        value: tymczasowe zaświadczenie tożsamości cudzoziemca
        quotes:
          - page: &mos-act https://api.sejm.gov.pl/eli/acts/DU/2025/1794/text.pdf
            text: "Cudzoziemiec dokonujący zameldowania się na pobyt czasowy przedstawia wizę, a w przypadku gdy wjazd cudzoziemca nastąpił na podstawie umowy przewidującej zniesienie lub ograniczenie obowiązku posiadania wizy albo cudzoziemiec przebywa na terytorium Rzeczypospolitej Polskiej na podstawie art. 108 ust. 1 pkt 2, art. 206 ust. 1 pkt 2 lub art. 222a ust. 1 pkt 2 ustawy z dnia 12 grudnia 2013 r. o cudzoziemcach (Dz. U. z 2025 r. poz. 1079 i 1794) – dokument podróży, tymczasowe zaświadczenie tożsamości cudzoziemca, kartę pobytu, dokument „zgoda na pobyt tolerowany” albo zezwolenie na pobyt czasowy, zezwolenie na pobyt stały, zezwolenie na pobyt rezydenta długoterminowego Unii Europejskiej lub decyzję o nadaniu statusu uchodźcy w Rzeczypospolitej Polskiej, udzieleniu w Rzeczypospolitej Polskiej ochrony uzupełniającej, zgody na pobyt ze względów humanitarnych albo zgody na pobyt tolerowany."
          - page: *govpl
            text: "Jeśli jesteś w Polsce w ramach ruchu bezwizowego albo czekasz na wydanie decyzji w sprawie udzielenia zezwolenia na pobyt czasowy, zezwolenia na pobyt stały lub zezwolenia na pobyt rezydenta długoterminowego UE i jednocześnie złożyłeś w terminie wniosek o wydanie takiego zezwolenia, przygotuj:\n- ważny dokument podróży,\n- JEDEN z poniższych dokumentów:\n- tymczasowe zaświadczenie tożsamości cudzoziemca,\n- kartę pobytu,\n- zgodę na pobyt tolerowany,\n- zezwolenie na pobyt czasowy,\n- zezwolenie na pobyt stały,\n- zezwolenie na pobyt rezydenta długoterminowego UE,\n- decyzję o nadaniu statusu uchodźcy w Polsce, udzieleniu w Polsce ochrony uzupełniającej, zgody na pobyt ze względów humanitarnych albo zgody na pobyt tolerowany."
          # General statement in the card's intro; supports the referral to the office, not a rule
          # for this case (content re-audit of F14).
          - page: *govpl
            text: "Dokumenty, które potwierdzają prawo do twojego pobytu w Polsce, musisz pokazać w urzędzie."
      description:
        pl: "Zamiast wizy, jeśli jesteś w Polsce w ramach ruchu bezwizowego albo czekasz na decyzję o zezwoleniu na pobyt, o które wystąpiono w terminie. Wystarczy JEDEN z tych dokumentów: to zaświadczenie, karta pobytu, zgoda na pobyt tolerowany, zezwolenie na pobyt czasowy, zezwolenie na pobyt stały, zezwolenie na pobyt rezydenta długoterminowego UE albo decyzja o nadaniu statusu uchodźcy w Polsce, udzieleniu w Polsce ochrony uzupełniającej, zgody na pobyt ze względów humanitarnych lub zgody na pobyt tolerowany. Jeśli nie masz wizy i żadna z tych dwóch sytuacji Cię nie dotyczy, zapytaj w urzędzie gminy, jakie dokumenty potwierdzające prawo do pobytu masz pokazać."
        en: "Instead of a visa, if you're in Poland visa-free or waiting for a decision on a residence permit you applied for in time. ONE of these is enough: this certificate, a residence card, a tolerated stay consent, a temporary residence permit, a permanent residence permit, an EU long-term resident permit, or a decision granting refugee status or subsidiary protection in Poland, or consent to a humanitarian or tolerated stay. If you have no visa and neither situation fits you, ask the municipal office which documents confirming your right to stay you need to show."
        uk: "Замість візи, якщо ви в Польщі в межах безвізового режиму або чекаєте на рішення щодо дозволу на перебування, про який подали заяву вчасно. Достатньо ОДНОГО з цих документів: ця довідка, карта побиту, згода на толероване перебування, дозвіл на тимчасове перебування, дозвіл на постійне перебування, дозвіл на перебування довгострокового резидента ЄС або рішення про надання статусу біженця в Польщі, додаткового захисту в Польщі, згоди на перебування з гуманітарних причин чи згоди на толероване перебування. Якщо у вас немає візи і жодна з цих двох ситуацій вас не стосується, запитайте в управлінні гміни, які документи, що підтверджують право на перебування, потрібно показати."
        ru: "Вместо визы, если вы в Польше в рамках безвизового режима или ждете решения о разрешении на пребывание, заявление на которое подали вовремя. Достаточно ОДНОГО из этих документов: эта справка, карта побыту, согласие на толерированное пребывание, разрешение на временное пребывание, разрешение на постоянное пребывание, разрешение на пребывание долгосрочного резидента ЕС или решение о предоставлении статуса беженца в Польше, дополнительной защиты в Польше, согласия на пребывание по гуманитарным причинам или согласия на толерированное пребывание. Если у вас нет визы и ни одна из этих двух ситуаций вас не касается, спросите в управлении гмины, какие документы, подтверждающие право на пребывание, нужно показать."
      form: original
