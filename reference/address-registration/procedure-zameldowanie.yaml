      statement:
        value:
          pl: "Najpóźniej w 4 dniu od zamieszkania w Polsce, w lokalu, w którym chcesz się zameldować."
          en: "At the latest on the 4th day, counting from the day you move in at the address where you want to register."
          uk: "Не пізніше 4-го дня, рахуючи від дня заселення в житло, де ви хочете зареєструватися."
          ru: "Не позднее 4-го дня, считая со дня заселения в жилье, где вы хотите зарегистрироваться."
        quotes:
          - page: *govpl
            text: "Najpóźniej w 4 dniu od zamieszkania w Polsce, w lokalu, w którym chcesz się zameldować."
    - id: no-online
      important: true
      condition: { not: { fact: zameldowanie.citizen_group, eq: eu_efta } }
      statement:
        value:
          pl: "Uwaga! Jeśli nie jesteś obywatelem państwa członkowskiego UE albo EFTA i nie jesteś członkiem rodziny takiego obywatela, nie możesz zameldować się przez Internet."
          en: "Note: if you're not a citizen of an EU or EFTA member state and not a family member of one, you can't register online."
          uk: "Увага! Якщо ви не громадянин держави-члена ЄС або ЄАВТ і не член сім'ї такого громадянина, ви не можете зареєструватися онлайн."
          ru: "Внимание! Если вы не гражданин государства-члена ЕС или ЕАСТ и не член семьи такого гражданина, вы не можете зарегистрироваться онлайн."
        quotes:
          - page: *govpl
            text: "Uwaga! Jeśli nie jesteś obywatelem państwa członkowskiego UE albo EFTA i nie jesteś członkiem rodziny takiego obywatela, nie możesz zameldować się przez Internet."
    - id: no-pesel-in-person
      condition: { fact: zameldowanie.citizen_group, eq: other }
      statement:
        value:
          pl: "Możesz się zameldować osobiście lub przez pełnomocnika. Swojego pełnomocnictwa możesz mu udzielić wyłącznie na piśmie.\nJeśli jednak nie masz numeru PESEL – przyjdź do urzędu osobiście."
          en: "You can register in person or through a proxy, whom you can authorise only in writing. But if you don't have a PESEL number, come to the office in person."
          uk: "Ви можете зареєструватися особисто або через уповноважену особу, довіреність якій можна дати лише письмово. Але якщо у вас немає номера PESEL, прийдіть до установи особисто."
          ru: "Вы можете зарегистрироваться лично или через уполномоченное лицо, доверенность которому можно дать только письменно. Но если у вас нет номера PESEL, придите в учреждение лично."
        quotes:
          - page: *govpl
            text: "Możesz się zameldować osobiście lub przez pełnomocnika. Swojego pełnomocnictwa możesz mu udzielić wyłącznie na piśmie.\nJeśli jednak nie masz numeru PESEL – przyjdź do urzędu osobiście."
    - id: stay-over-30-days
      important: true
      condition: { not: { fact: zameldowanie.citizen_group, eq: eu_efta } }
      statement:
        value:
          pl: "Jeśli mieszkasz w danym miejscu tylko czasowo, a planowany okres przebywania pod tym adresem jest dłuższy niż 3 miesiące (pobyt czasowy, dotyczy obywateli UE, EFTA, Konfederacji Szwajcarskiej lub członków ich rodzin) lub więcej niż 30 dni (pobyt czasowy, dotyczy obywateli niekwalifikujących się do powyższej grupy)."
          en: "You register a temporary stay if you live at an address only temporarily and plan to stay there for more than 3 months (citizens of the EU, EFTA or Switzerland and their family members) or for more than 30 days (people who don't belong to that group)."
          uk: "Ви реєструєте тимчасове перебування, якщо живете за адресою лише тимчасово і плануєте пробути там понад 3 місяці (громадяни ЄС, ЄАВТ чи Швейцарії та члени їхніх сімей) або понад 30 днів (особи, які не належать до цієї групи)."
          ru: "Вы регистрируете временное пребывание, если живете по адресу лишь временно и планируете пробыть там более 3 месяцев (граждане ЕС, ЕАСТ или Швейцарии и члены их семей) или более 30 дней (лица, не относящиеся к этой группе)."
        quotes:
          - page: https://www.bip.krakow.pl/uslugi/SA-12&metka=1
            text: "Jeśli mieszkasz w danym miejscu tylko czasowo, a planowany okres przebywania pod tym adresem jest dłuższy niż 3 miesiące (pobyt czasowy, dotyczy obywateli UE, EFTA, Konfederacji Szwajcarskiej lub członków ich rodzin) lub więcej niż 30 dni (pobyt czasowy, dotyczy obywateli niekwalifikujących się do powyższej grupy)."
          - page: *act
            text: "Cudzoziemiec niewymieniony w ust. 1–2a, przebywający na terytorium Rzeczypospolitej Polskiej, ma obowiązek zameldować się w miejscu pobytu stałego lub czasowego najpóźniej czwartego dnia, licząc od dnia przybycia do tego miejsca."
          - page: *act
            text: *art41-2
          - page: *act
            text: *art41-2a
    - id: no-valid-passport
      condition:
        all:
          - { not: { fact: zameldowanie.citizen_group, eq: eu_efta } }
          - { fact: zameldowanie.stay, eq: temporary }
      statement:
        value:
          pl: "W szczególnie uzasadnionym przypadku, gdy cudzoziemiec dokonujący zameldowania się na pobyt czasowy nie posiada ważnego dokumentu podróży ani nie ma możliwości jego uzyskania, może przedstawić inny dokument potwierdzający tożsamość."
          en: "In particularly justified cases, if you are registering a temporary stay and have no valid travel document and no way of getting one, you may show another document that confirms your identity."
          uk: "В особливо обґрунтованих випадках, якщо ви реєструєте тимчасове перебування і не маєте дійсного проїзного документа та не можете його отримати, ви можете показати інший документ, що підтверджує вашу особу."
          ru: "В особо обоснованных случаях, если вы регистрируете временное пребывание и у вас нет действительного проездного документа и нет возможности его получить, вы можете предъявить другой документ, удостоверяющий личность."
        quotes:
          - page: *mos-act
            text: "W szczególnie uzasadnionym przypadku, gdy cudzoziemiec dokonujący zameldowania się na pobyt czasowy nie posiada ważnego dokumentu podróży ani nie ma możliwości jego uzyskania, może przedstawić inny dokument potwierdzający tożsamość."
    - id: declared-period
      condition:
        all:
          - { not: { fact: zameldowanie.citizen_group, eq: eu_efta } }
          - { fact: zameldowanie.stay, eq: temporary }
      statement:
        value:
          pl: "Deklarowany przez cudzoziemca niewymienionego w ust. 1–2a okres pobytu czasowego pod określonym adresem nie może przekroczyć okresu, w którym cudzoziemiec ten może legalnie przebywać na terytorium Rzeczypospolitej Polskiej, zgodnie z dokumentem potwierdzającym jego prawo pobytu."
          en: "If you're not one of the foreigners listed in paragraphs 1–2a of the article (citizens of the EU, EFTA or Switzerland, their family members, and some family members of Polish citizens), the period of temporary stay you declare at an address can't be longer than the time you may legally stay in Poland under the document that confirms your right to stay."
          uk: "Якщо ви не належите до іноземців, перелічених у частинах 1–2а цієї статті закону (громадяни ЄС, ЄАВТ чи Швейцарії, члени їхніх сімей і деякі члени сімей громадян Польщі), задекларований вами строк тимчасового перебування за адресою не може бути довшим, ніж час, протягом якого ви можете легально перебувати в Польщі згідно з документом, що підтверджує ваше право на перебування."
          ru: "Если вы не относитесь к иностранцам, перечисленным в частях 1–2а этой статьи закона (граждане ЕС, ЕАСТ или Швейцарии, члены их семей и некоторые члены семей граждан Польши), заявленный вами срок временного пребывания по адресу не может быть дольше, чем время, в течение которого вы можете легально находиться в Польше согласно документу, подтверждающему ваше право на пребывание."
        quotes:
          - page: *act
            text: "Deklarowany przez cudzoziemca niewymienionego w ust. 1–2a okres pobytu czasowego pod określonym adresem nie może przekroczyć okresu, w którym cudzoziemiec ten może legalnie przebywać na terytorium Rzeczypospolitej Polskiej, zgodnie z dokumentem potwierdzającym jego prawo pobytu."
          - page: https://warszawa19115.pl/-/zameldowanie-na-pobyt-czasowy-cudzoziemcow-w-tym-obywateli-panstw-czlonkowskich-unii-europejskiej-ue-i-czlonkow-ich-rodzin
            text: "Jeśli nie jesteś obywatelem państwa UE, EFTA lub Konfederacji Szwajcarskiej, ani członkiem rodziny takiego obywatela, deklarowany przez Ciebie okres pobytu pod określonym adresem nie może być dłuższy niż okres, przez który możesz legalnie przebywać w Polsce."
    - id: short-stay
      statement:
        value:
          pl: "Nie musisz się meldować, jeśli wiesz, że twój pobyt w Polsce nie będzie trwał dłużej niż 30 dni – na przykład, gdy spędzasz w Polsce urlop."
          en: "You don't have to register if you know your stay in Poland won't last longer than 30 days, for example when you're on holiday in Poland."
          uk: "Вам не потрібно реєструватися, якщо ви знаєте, що ваше перебування в Польщі триватиме не довше 30 днів, наприклад, коли ви у відпустці в Польщі."
          ru: "Вам не нужно регистрироваться, если вы знаете, что ваше пребывание в Польше продлится не дольше 30 дней, например, когда вы в отпуске в Польше."
        quotes:
          - page: *govpl
            text: "Nie musisz się meldować, jeśli wiesz, że twój pobyt w Polsce nie będzie trwał dłużej niż 30 dni – na przykład, gdy spędzasz w Polsce urlop."
    - id: no-owner-confirmation
      important: true
      statement:
        value:
          pl: "Jeśli masz problem z uzyskaniem tytułu prawnego do lokalu lub oświadczenia właściciela, nadal możesz złożyć formularz meldunkowy."
          en: "If you have trouble getting a legal title to the flat or the owner's confirmation, you can still file the registration form."
          uk: "Якщо у вас проблема з отриманням правового титулу на житло або підтвердження власника, ви все одно можете подати реєстраційний бланк."
          ru: "Если у вас проблема с получением юридического права на жилье или подтверждения собственника, вы все равно можете подать регистрационный бланк."
        quotes:
          - page: *govpl
            text: "Jeśli masz problem z uzyskaniem tytułu prawnego do lokalu lub oświadczenia właściciela, nadal możesz złożyć formularz meldunkowy."
    # The rest of the official "Problem z zameldowaniem" list: where to file and the statement
    # (content audit of b2bd10d; PESEL journey step 3, owner 2026-10-05).
    - id: no-owner-where
      statement:
        value:
          pl: "złóż formularz meldunkowy w urzędzie gminy, na terenie której położona jest nieruchomość,"
          en: "If you have no document showing your right to the flat or the owner won't confirm, file the registration form at the municipal office of the gmina where the property is."
          uk: "Якщо такого документа немає або власник не підтверджує, подайте реєстраційний бланк в управлінні гміни, на території якої розташована нерухомість."
          ru: "Если такого документа нет или собственник не подтверждает, подайте регистрационный бланк в управлении гмины, на территории которой находится недвижимость."
        quotes:
          - page: *govpl
            text: "złóż formularz meldunkowy w urzędzie gminy, na terenie której położona jest nieruchomość,"
    - id: no-owner-statement
      statement:
        value:
          pl: "do zgłoszenia dołącz oświadczenie, w którym poinformujesz urząd, dlaczego nie masz wymaganych dokumentów,"
          en: "Attach to the registration form a written statement telling the office why you don't have the required documents."
          uk: "Додайте до реєстраційного бланка письмове пояснення, чому у вас немає потрібних документів."
          ru: "Приложите к регистрационному бланку письменное объяснение, почему у вас нет нужных документов."
        quotes:
          - page: *govpl
            text: "do zgłoszenia dołącz oświadczenie, w którym poinformujesz urząd, dlaczego nie masz wymaganych dokumentów,"
    - id: no-owner-procedure
      statement:
        value:
          pl: "urząd przeprowadzi postępowanie administracyjne i ustali, czy mieszkasz w lokalu, w którym chcesz się zameldować. Jeżeli tak – wyda decyzję administracyjną o zameldowaniu."
          en: "Without the owner's confirmation, the office runs an administrative procedure to establish whether you live at the address. If you do, it issues an administrative decision registering you."
          uk: "Без підтвердження власника установа проведе адміністративну процедуру й встановить, чи ви живете за цією адресою. Якщо так, вона видасть адміністративне рішення про реєстрацію."
          ru: "Без подтверждения собственника учреждение проведет административную процедуру и установит, живете ли вы по этому адресу. Если да, оно выдаст административное решение о регистрации."
        quotes:
          - page: *govpl
            text: "urząd przeprowadzi postępowanie administracyjne i ustali, czy mieszkasz w lokalu, w którym chcesz się zameldować. Jeżeli tak – wyda decyzję administracyjną o zameldowaniu."
    - id: one-place
      statement:
        value:
          pl: "Nie możesz mieć meldunku jednocześnie w 2 miejscach pobytu stałego albo 2 miejscach pobytu czasowego."
          en: "You can't be registered at 2 permanent or 2 temporary addresses at the same time."
          uk: "Не можна бути зареєстрованим одночасно за 2 адресами постійного або 2 адресами тимчасового перебування."
          ru: "Нельзя быть зарегистрированным одновременно по 2 адресам постоянного или 2 адресам временного пребывания."
        quotes:
          - page: *govpl
            text: "Nie możesz mieć meldunku jednocześnie w 2 miejscach pobytu stałego albo 2 miejscach pobytu czasowego."
  outcome:
    value:
      pl: "Urzędnik zamelduje cię od razu po otrzymaniu twojego zgłoszenia."
      en: "The official registers you as soon as they receive your form."
      uk: "Посадовець зареєструє вас одразу після отримання вашого реєстраційного бланка."
      ru: "Сотрудник зарегистрирует вас сразу после получения вашего регистрационного бланка."
    quotes:
      - page: *govpl
        text: "Urzędnik zamelduje cię od razu po otrzymaniu twojego zgłoszenia."
  handoff:
    when:
      pl: Jeśli nie zdążysz w terminie, właściciel nie chce potwierdzić Twojego pobytu albo urząd odmawia zameldowania. W sprawie terminu możesz też zapytać w urzędzie gminy.
      en: If you've missed the deadline, the owner won't confirm that you live there, or the office refuses to register you. About the deadline you can also ask the municipal office.
      uk: Якщо ви не встигли в строк, власник не хоче підтвердити ваше проживання або установа відмовляє в реєстрації. Щодо строку можна також запитати в управлінні гміни.
      ru: Если вы не успели в срок, собственник не хочет подтвердить ваше проживание или учреждение отказывает в регистрации. По поводу срока можно также спросить в управлении гмины.
    options:
