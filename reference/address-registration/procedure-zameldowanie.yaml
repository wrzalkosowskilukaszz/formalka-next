        ru: Для регистрации постоянного пребывания достаточно ОДНОГО документа из официального списка, например карты побыту, выданной в связи с разрешением на постоянное пребывание, разрешением на пребывание долгосрочного резидента ЕС, согласием на пребывание по гуманитарным причинам, дополнительной защитой или предоставлением статуса беженца в Польше.
