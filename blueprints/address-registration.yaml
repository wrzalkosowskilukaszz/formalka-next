# Case blueprint: address registration (zameldowanie) for a foreigner. One route. The deadline reads
# "najpóźniej w N dniu od zamieszkania": whether the move-in day is day 1 is open (06 §7 Q3), so the
# engine keeps both readings and reminds on the earlier one.
id: address-registration
title: { pl: Zameldowanie }
caretaker: { name: Asia, feminine: true }
routes: [zameldowanie-foreigner]
routeLevel:
  id: route
  title: { pl: Twoja sytuacja }
levels:
  - id: fill-in
    title: { pl: Formularz }
    steps: { zameldowanie-foreigner: fill-in }
  - id: owner-confirms
    title: { pl: Potwierdzenie właściciela }
    steps: { zameldowanie-foreigner: owner-confirms }
  - id: file
    title: { pl: Wizyta w urzędzie gminy }
    steps: { zameldowanie-foreigner: file }
    documents: true
    fees: true
    submits: true
    completesWith: filing
  - id: registered
    title: { pl: Zameldowanie }
    steps: { zameldowanie-foreigner: registered }
    completesWith: registered
# Audit F4 (2026-10-16): corrections to the registry's mapping, each with words from its own quotes.
# The EU group joins citizens and their family members; the card is for family members only.
onlyIf:
  family-card:
    label: { pl: "Tylko jeśli jesteś członkiem rodziny obywatela UE, EFTA lub Szwajcarii." }
    basis: "potwierdzi, że jesteś członkiem rodziny obywatela UE"
# The guide says filing doesn't have to wait for the owner's confirmation.
optionalAfter:
  - { level: file, on: owner-confirms, basis: "nadal możesz złożyć formularz meldunkowy" }
notes:
  no-owner-confirmation: file
deadlines:
  other-citizens: { level: file, counting: nth-day, role: user }
  eu-efta: { level: file, counting: nth-day, role: user }
events:
  arrival_at_address: { label: { pl: "Dzień, od którego mieszkasz pod tym adresem" } }
  filing: { label: { pl: Dzień złożenia formularza w urzędzie } }
  registered: { label: { pl: Dzień zameldowania } }
